name: teal-otter-3
title: "Seed Vault - a four-table cold-room accession register with composite keys, three chained-join associations and a taxon-partitioned germination window"
description: |
  A conservation seed archive spread over four sibling tables of one schema: stored accessions keyed on
  their code and collection date, the taxa and cold rooms they resolve against, and the germination
  trials keyed on trial number and accession. One relational mapping names a main-table alias per
  class, declares composite primary keys of mixed type on two of them, derives a literal curation
  column and a concatenated grade column beside the direct column bindings, and reaches the taxon
  name of a trial through a chained two-hop traversal. Three named equi-joins of differing key shape
  - two single-column and one two-column - realise the three declared associations as relational
  association implementations, so navigation becomes an inner join and a driver row whose vault key
  does not resolve drops out. Three single-execution services differ structurally: a three-parameter
  filtered projection of eight mixed-type columns with an existence test over the to-many trial
  traversal and a single-value coercion, a rolled-up per-vault seed total restricted by a membership
  test, and a taxon-partitioned window ranking where a tie shares the leading rank. A data space
  packages the mapping, runtime and two of those endpoints behind support metadata, and the runtime
  binds the mapping to a Snowflake connection authenticated through OAuth.
