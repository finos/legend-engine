name: coral-cove-2
title: "Coral Cove 2 — A Wide Relational Reef Monitoring Store Published Through Tabular Services And A Data Space"
description: |
  A reef monitoring network whose physical layer is one relational store of sibling tables in a
  single schema, each explicitly typed with a declared key, joined to its neighbours by named
  equality joins that the mapping layer reuses rather than restating per property.

  Every mapped class pins its main table alias explicitly, so column references, keys and join
  origins all resolve against one aliased table among the many similarly shaped ones, and every
  class mapping declares its own primary key: the survey pass, the colony and the bleaching
  episode declare composite keys over an identifier plus a version or sequence boundary column,
  so the same domain identifier recurring across versions yields one instance per key tuple.
  Properties are either direct column reads under the alias or single-hop join-reached reads,
  and the optional properties resolve to null where the column is unpopulated.

  Four associations connect class pairs with navigable ends and are implemented relationally
  against the named joins, so traversal generates the join in either direction, a to-many end
  multiplies rows and an unmatched end is simply empty.

  The consumer surface is a family of tabular services whose bodies retrieve a class extent,
  optionally filter it and project properties into named columns, plus a data space that names
  the mapping and runtime pair a consumer executes against, the domain elements it covers and
  three of the services as featured executables. The runtime binds the mapping to a warehouse
  connection with a delegated authentication strategy, which fixes the dialect the generated
  plan targets; a second runtime over a local connection stands the schema up from its own
  setup statements so the mapping and service tests execute.

