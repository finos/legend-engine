name: verdant-otter-2
title: "Verdant Otter — Canal Lock Passage Register (processing-temporal register read through composed mappings and point-in-time tabular projections)"
description: |
  A canal navigation register whose every corrected class is processing-temporal:
  lock chambers, licensed vessels, keeper shifts and the passages recorded
  through the chambers each carry the temporal stereotype and each sits on its
  own milestoned sibling table, while a static reach reference table in an
  included store supplies the reach names the corrected tables reach across
  declared equality joins. The bindings are assembled by composition — a reach
  mapping is pulled into the waterway mapping that owns the corrected class
  mappings, and that mapping is in turn included by the outer mapping that owns
  the test suite — so the resolved mapping set spans three elements and one
  connection has to serve every store reached that way. Services enter the model
  only through the milestoned accessor with a point-in-time date parameter and
  produce wide tabular projections over a mixed primitive surface of strings,
  fixed-precision numerics, floats, dates and timestamps, so the milestoning
  window is the only predicate the plan carries; their fixtures hold a
  correction closed out before the requested instant and a version opened after
  it, proving the out-of-range rows drop. Two associations relate the corrected
  chamber and vessel to their passages with an explicit multiplicity at each
  end, and a two-context data space publishes the composed mapping, the model
  elements and the executable projections behind one discovery surface.

