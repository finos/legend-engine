name: indigo-quokka-3
title: "Indigo Quokka — Observing-Network Sky Almanac Served Through Composite-Keyed Views and a Data Space"
description: |
  An amateur astronomy observing-network almanac. Nine flat classes hold
  magnitude estimates and seasonal statistics for variable stars, comets,
  asteroids, meteor showers and novae, most of their properties optional
  numbers and dates. One database declares a single schema of raw tables and
  one user view per table; every view declares a composite primary key and
  every class mapping reads one view with a mirrored mapping key. Eleven
  single-execution services owned by one deployment identifier share one
  mapping and one engine runtime over a key-pair authenticated warehouse
  connection: seven project a whole class, two filter on an observing-night
  path parameter and two on a night together with an object code. A data
  space with a diagram and email support pairs the mapping and runtime in a
  single execution context and lists the four filtered services as its
  executables.
