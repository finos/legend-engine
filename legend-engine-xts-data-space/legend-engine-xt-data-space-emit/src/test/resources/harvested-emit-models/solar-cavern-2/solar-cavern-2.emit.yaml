      - test/solarcavern2/mapping/CavernMapping.pure
      - test/solarcavern2/profile/CavernMeta.pure
      - test/solarcavern2/runtime/CavernRuntime.pure
      - test/solarcavern2/service/ChamberReadingService.pure
      - test/solarcavern2/store/CavernDb.pure
