name: coral-prairie
title: "Coral Prairie Restoration Register — Association-Implemented Navigation over a Multi-Table Grassland Store"
description: |
  A prairie restoration register whose plot hub navigates to management zones, burn units,
  seed mixes, soil series and field technicians through associations implemented over named
  inner joins, one end of which resolves through a two-link join chain. Nested string
  transforms derive the plot code, display name and slug from the landed columns. Three
  single-execution services publish the plot register, the zone register and a filtered
  species-rich selection as tabular projections, and a data space groups the mapping, the
  runtime and the three services as sample executables behind an email support contact.
