name: emerald-hatchery-3
title: "Emerald Hatchery — Freshwater Rearing Ponds (data space over two relational mappings with filtered, projected, de-duplicated and date-differenced service endpoints)"
description: |
  A freshwater hatchery rearing model published as a data space with two
  execution contexts: the live rearing warehouse, where ponds and stocked
  cohorts are mapped onto a two-table schema, and a retired-pond archive
  addressed through its own mapping, connection and runtime. Four services
  drive the query surface — an active-pond lookup that narrows on an optional
  decommissioning date, a set-membership water-source filter and a capacity
  floor before ordering; a species lookup that de-duplicates its projection so
  repeated cohorts in one pond report once; a stocking window that composes
  date and count comparisons, normalises codes at projection time and derives
  the days each cohort has been growing out; and an archive endpoint that
  projects and de-duplicates the retired ponds for a requested grade band.
  Every service carries an inline relational fixture and asserts its tabular
  payload.

