name: solar-apiary-3
title: "Solar Apiary - a profiled pollinator transect binding surfaced through a two-tier data space"
description: |
  A pollinator meadow survey. Transect counts are bound to a single aliased
  table through an explicit primary key, banded by bloom cover inside the
  service projection, and surfaced through a data space that pairs an
  in-process survey tier with a vault-authenticated warehouse tier. The
  warehouse-tier service is compiled and plan-generated only, while the survey
  tier carries the asserted fixture.
