name: ember-lantern-2
title: "Lantern Workshop Production Record — Processing-Temporal Services, Cross-Schema Stores and Data Space Contexts"
description: |
  An advanced processing-temporal relational model over a lantern workshop
  production record. Every mapped class carries the processing-temporal stereotype
  and every table a matching milestoning block with an infinity sentinel, so each
  service query enters through the milestoned accessor with a single instant
  parameter and the compiler rewrites the read into a window predicate. Two stores,
  one of them cross-schema and multi-table, are bound by four relational mappings
  that each name an explicit main-table alias and primary-key clause; three
  associations are backed by joins so the collection ends fan out at the requested
  instant. Two data spaces publish the mapping and runtime pairs as named execution
  contexts with default contexts, listed executables and support contacts, and three
  runtimes resolve the stores to an in-process pair and a key-pair authenticated
  cloud-warehouse connection.
