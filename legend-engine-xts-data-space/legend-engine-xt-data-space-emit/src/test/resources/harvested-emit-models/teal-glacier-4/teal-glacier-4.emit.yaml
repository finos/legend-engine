name: teal-glacier-4
title: "Glacier monitoring field record and archive over two OAuth warehouses"
description: |
  A glacier monitoring network kept as two parallel families: a live field record of
  glaciers, ablation stake readings and processing-temporal crevasse surveys, and an
  archive with the same shapes. Each family has its own store of quoted-identifier
  tables, its own OAuth warehouse connection, mapping and runtime, and a data space
  exposes both as execution contexts. Glaciers are keyed by code and range, so stake
  readings reach their glacier through a composite join that also implements the
  glacier-to-reading association. An eight-band melt class with an empty fallback and
  a missing-depth sentinel are computed in the mapping. Parameterised services filter
  by path parameters, list membership and a date window ORed with membership.
