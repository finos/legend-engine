name: dusky-hatchery
title: Dusky Hatchery Pond Operations Register
description: >
  A freshwater hatchery register whose rearing ponds are milestoned on a single processing axis
  and bound, one class per table, across a five-table relational store through explicit identity
  column sets and anchoring main tables. A curated entry point groups the mapping, the warehouse
  runtime, two layout diagrams and three parameterised single-execution endpoints that project
  tabular rows resolved at a caller supplied processing instant.
