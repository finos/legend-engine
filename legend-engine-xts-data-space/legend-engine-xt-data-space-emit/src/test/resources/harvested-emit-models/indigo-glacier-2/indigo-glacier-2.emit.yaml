name: indigo-glacier-2
title: "Indigo Glacier Mass-Balance Survey - Filter-Gated Multi-Schema Stores, Store Include, Delegated-Kerberos Sybase Data Space"
description: |
  A glacier mass-balance survey catalogue. A registry store holds sites,
  field crews and composite-keyed stake posts; a survey store includes the
  registry and spreads stake readings, snow pits and melt ponds over a field
  schema with ice cores and composite-keyed isotope samples in a lab schema;
  an archive store keeps dated reading and core history. Every class mapping
  declares an explicit primary key and is gated by a named store filter that
  conjoins state tests with range, null and disjunctive depth-or-layering
  conditions. A survey mapping includes the registry mapping with a store
  rewrite and an include-only catalogue mapping composes survey and archive.
  Three delegated-Kerberos Sybase connections over static datasources back
  five runtimes that a documented data space selects per execution context.
