name: azure-meadow-3
title: "Azure Meadow 3 — a milestoned hay cut register widened by a joined detail table, folded by terrace behind the class and packaged as governed data spaces"
description: |
  An alpine hay meadow held in one relational store across two schemas: a parcel book, a detail table
  carrying the slope and aspect of the parcels cut into alpine terraces, a terrace book, a keeper roster,
  a store-side view folding the parcel book by terrace and a hay cut register.
  The register relation is milestoned by a business window, so one read at a business date returns the nine
  open rows and drops the row whose window closed two years earlier, while a second read at a date inside
  that closed window returns exactly that row — the explicit date, not the extent, is doing the scoping.
  The parcel book is read three ways from one main table: as the root parcel, as a subtype whose own slope
  and aspect are carried on a detail table joined to it rather than on the parcel book itself, and as a fold
  grouped by terrace behind the class so the parcel tally and the plot total are aggregated by the mapping
  rather than by the query; the same fold is then read a fourth way straight off the store view, so the
  aggregation declared once in the store returns what the mapping fold returns.
  The register reaches its parcel one hop out, the terrace of that parcel two hops out and the keeper of that
  terrace three hops out, leaving the tail of the chain unresolved where a parcel is cut into no terrace or a
  terrace is walked by no keeper. A bale tier falls out of an eight-armed nested conditional with an
  unresolved tail, a four-arm band over the bale tally and the moisture falls through to a floor label, a note
  label is composed from the note and its own measured length, and a nested arithmetic fold over the moisture
  and the stem length is walked deep enough that the plan has to compute it before it reads the columns. Sward,
  drying and access enumerations are mapped from coded columns, so an unlisted code yields no member at all.
  The row-shaped endpoint keeps the cuts whose yield band the caller names and which tied at least as many
  bales as the caller names, then places each cut beside a distinct projection of the parcel book over an
  inner join; a second endpoint reads the terrace fold for the terraces the caller names. Both the register
  and the terrace estate are packaged as governed data spaces carrying their diagrams and a support address.
