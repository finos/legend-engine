name: solar-meadow
title: "Solar Meadow - Restored Wildflower Plots with a Grouped Inline View and Banded Bloom Counts"
description: |
  A meadow-restoration monitoring model whose single relational store carries live
  plots, their sward types, the pollinator taxa recorded against them and a grouped
  inline view of bloom counts per plot. One curated mapping reaches the view through
  a plot-to-view join to expose the per-plot tally, resolves sward names over a
  two-hop count-to-plot-to-sward join path, and lands an eight-arm cover-band case
  with an unscored fallback; a cross-table class-mapping filter keeps only taxa that
  were actually counted. A season-digest service rolls stems up per plot and cover
  band inside a window derived by date arithmetic from its parameter, an outer-join
  service places every plot beside its windowed tally so uncounted plots survive with
  an empty tally, and a data space publishes the in-process and archive tiers.
