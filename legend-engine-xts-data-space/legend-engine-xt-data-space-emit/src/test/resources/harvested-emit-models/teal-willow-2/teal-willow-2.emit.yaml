name: teal-willow-2
title: "Teal Willow - Museum curation data product over composed relational stores with association mappings, a diagram and a data space"
description: |
  A museum-curation corpus whose aggregate relational store composes a gallery
  store and a collection store by inclusion and owns the joins that relate their
  tables. An association-rich mapping composes an included base mapping, binds
  three associations through those joins and reaches gallery labels across a
  two-hop path. A governed data space wires the curated mapping to its runtime,
  a stored diagram documents the class graph, and services project exhibits and
  artifacts with row-level assertions.
