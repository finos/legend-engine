name: olive-delta
title: Reef Survey Entry Point With Processing-Temporal Monitoring
description: A reef survey domain whose sites, coral colonies and dive teams are joined through two association implementations over a two-schema relational store. Bleaching observations sit on a processing timeline, and a curated data space binds the mapping, runtime, domain layout and two featured endpoints into one consumable unit.
