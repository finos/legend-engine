name: noble-quarry
title: "Noble Quarry — Bench Surveys Cross-Referenced To A Shared Site Registry"
description: |
  A quarry bench logbook held in two package copies of the same model - a live
  copy whose bench surveys and blast records are processing-temporal, and an
  archive copy frozen into numbered archive cycles. In each copy surveys and
  blasts are linked through a validity-window containment join, and both reach
  a site declared in a shared registry model only through association mappings
  that walk an identifier-scheme table: blasts reach their site over a two-hop
  chain, surveys over a three-hop chain that crosses the scheme table's
  self-join, and every hop is filtered on a source-key literal and a live-batch
  sentinel. Both mappings include the shared registry mapping, every table
  carries a multi-column primary key, and both Snowflake connections rewrite
  their schemas through a schema-mapper post-processor. Three DID-owned
  services publish wide projections - two parameterless registers and one
  bench lookup filtered on a path parameter and also exposed as a tool-server
  endpoint - and a data space features the two registers over the live
  execution context. Mapping test suites exercise each chain in both
  directions, including chains broken at each hop and superseded processing
  versions.
