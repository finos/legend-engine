name: gilded-vineyard-6
title: "Gilded Vineyard 6 — Association-Backed Join Reach across a Multi-Table Trail Store"
description: |
  A ridge trail-network maintenance model. One relational store declares five
  independent tables in a single schema plus three named equi-joins, and one
  mapping binds five flat domain classes to them: each class mapping declares an
  explicit primary key and an aliased main table, and three of them reach a label
  column across a single join hop. Three associations are implemented over the
  same three joins, so the trailhead-to-segment, segment-to-shelter and
  shelter-to-visit paths are traversable from either side. Five single-execution
  services project the mapped classes with explicit result labels and no
  predicate — one of them adding a year extraction over the visit date — and a
  data space with an email support contact publishes the whole binding through a
  single execution context.
