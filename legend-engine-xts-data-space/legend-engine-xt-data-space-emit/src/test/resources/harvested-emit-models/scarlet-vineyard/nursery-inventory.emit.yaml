name: nursery-inventory
title: "Scarlet Vineyard - Nursery Propagation Inventory with Data Space, Profile and Projected Service"
description: |
  A nursery propagation inventory whose two sibling domain types are bound to
  two tables of one relational schema with explicit primary keys and main-table
  aliases. A profile supplies the stereotype and tagged values carried by the
  domain types and by the data space, which groups the mapping with a local and
  a warehouse runtime and advertises the published register endpoint plus a
  support target. The service and the mapping each project a flat tabular
  result whose labels are normalised in the projection.
modelSources:
