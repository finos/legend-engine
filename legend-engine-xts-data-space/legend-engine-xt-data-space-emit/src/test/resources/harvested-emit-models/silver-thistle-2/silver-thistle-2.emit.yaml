name: silver-thistle-2
title: "Silver Thistle 2 — Alpine Trail Network (three association implementations over inner joins, three enumerations resolved through reused enumeration mappings and a two-hop join-reached property)"
description: |
  An alpine trail-network registry. Segments, ranger stations, trail regions and
  patrol logs are bound column-for-column onto one warehouse schema with explicit
  primary keys and main tables, three associations are realised in both traversal
  directions over three inner joins, three enumerations are resolved from text
  columns through enumeration mappings that are reused across relations, and one
  segment property is reached through a two-hop join path. A data space exposes the
  mapping and runtime through a single default execution context, and the mapping
  carries assertion-backed test suites covering forward traversal, reverse
  traversal and enumeration reuse.

