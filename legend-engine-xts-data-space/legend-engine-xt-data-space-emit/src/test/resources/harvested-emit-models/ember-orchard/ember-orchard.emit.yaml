    root: ember-orchard
    files:
      - test/emberorchard/connection/OrchardArchiveConnection.pure
      - test/emberorchard/connection/OrchardNurseryConnection.pure
      - test/emberorchard/dataspace/OrchardRegisterDataSpace.pure
