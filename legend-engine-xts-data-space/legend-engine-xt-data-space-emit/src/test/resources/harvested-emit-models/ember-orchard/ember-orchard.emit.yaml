name: ember-orchard
title: "Ember Orchard — profile-documented wide register projected through an environment-keyed multi-execution service"
description: >-
  A nursery propagation register whose wide specimen record carries a documentation profile on
  every property, contrasted with a narrow unannotated irrigation allocation. Both are bound by
  direct column reads onto a two-schema nursery store, with no joins, transforms or
  enumerations anywhere in the binding layer. One keyed multi-execution service projects all
  twenty-eight documented properties into a named tabular result, unrestricted and unordered,
  and routes the identical projection to a nursery warehouse or to its archive counterpart,
  which share their OAuth scope but differ in datasource and identifier quoting. A data space
  curates the register and pins the production-tier context to the nursery runtime.
modelSources:
