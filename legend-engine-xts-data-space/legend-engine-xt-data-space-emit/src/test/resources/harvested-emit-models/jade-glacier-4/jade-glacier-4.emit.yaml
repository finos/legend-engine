name: jade-glacier-4
title: "Glacier Survey - Ice Core Register, Data Space and a Wide Alias-Contracted Projection"
description: |
  A basic relational EMIT model in a glacier-monitoring domain. One wide ice-core
  relation is bound column-for-column onto a nineteen-property core class - fifteen
  descriptive codes, the two instants the drilling and the logging happened at and
  the two recovered measures - and published through a data space whose single
  execution context pairs the core mapping with the survey warehouse runtime. A
  parameterless single-execution service projects the whole register under a
  deliberately mixed alias contract, de-duplicates it and orders it by core code;
  its assertion-backed suite drives the projection off a shelved core fixture.
