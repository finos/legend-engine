name: golden-otter-5
title: "Glasshouse Plant Nursery Propagation Register"
description: |
  A relational glasshouse nursery model for propagation batches, benches and
  house zones. The store combines filtered tables, grouped inline views,
  inner-join paths and view-backed properties, while four tested services
  exercise deep date windows, conditional batch grading and derived seasonal
  roster queries. A DataSpace packages the mapping and runtime for both the
  propagation and published execution contexts.
modelSources:
  model:
    root: golden-otter-5
    files:
      - test/goldenotter5/connection/NurseryConnections.pure
      - test/goldenotter5/dataspace/NurseryDataSpace.pure
      - test/goldenotter5/domain/NurseryDomain.pure
      - test/goldenotter5/mapping/NurseryMapping.pure
      - test/goldenotter5/runtime/NurseryRuntime.pure
      - test/goldenotter5/service/BenchLoadByHouse.pure
      - test/goldenotter5/service/PropagationBatchesInWindow.pure
      - test/goldenotter5/service/RootedBatchRoster.pure
      - test/goldenotter5/service/VigourBandRoster.pure
      - test/goldenotter5/store/NurseryDb.pure
