name: dusky-delta
title: "Dusky Delta — A Two-Store Apiary Register With A Graded Band Transform And A Version-Resolved Colony Register"
description: |
  An apiary field register split over two relational stores, each holding its tabular units in two
  namespaces. The hive unit is mapped with a graded transform whose eight ordered arms fall through
  to an unbanded sentinel, a second sentinel arm that turns a placeholder queen token into an absent
  value, a fixed register label carried as a mapped literal, and stand, forage and keeper attributes
  reached through one- and two-hop reference paths that cross the namespace boundary. Two declared
  relationships between the stand, the forage belt and the hive unit are resolved through their
  shared reference paths rather than through carried columns. The second store keeps a versioned
  colony register whose rows carry validity bounds, so resolving it at the open instant discards the
  superseded version of a colony while still driving the label transform arms and the inspector
  reference path. Two endpoints publish the two mappings, each narrowing rows with a conjunctive
  predicate whose bound and membership list drop out of the pushed-down statement when the parameter
  is not supplied. A data space catalogues both mappings and both warehouse runtimes as two
  execution contexts. Mapping tests cover every transform arm, both absent-value outcomes and the
  discarded version; endpoint tests cover the supplied and unsupplied path of every parameter.
