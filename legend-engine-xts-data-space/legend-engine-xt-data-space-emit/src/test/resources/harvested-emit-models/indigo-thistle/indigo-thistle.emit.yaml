name: indigo-thistle
title: "Indigo Thistle - data space over a join-reached relational binding of a bird-ringing fieldwork model"
description: |
  A bird-ringing fieldwork model in which sightings and observers are anchored to their own
  main tables with explicit identity columns, and every attribute outside those anchors arrives
  through declared inner equality joins, including a two-hop path from a sighting to its camp.
  The association between the two classes is implemented over the same join layer, and a data
  space publishes the mapping, its warehouse runtime and the element subset consumers should
  start from, together with an email support target.
