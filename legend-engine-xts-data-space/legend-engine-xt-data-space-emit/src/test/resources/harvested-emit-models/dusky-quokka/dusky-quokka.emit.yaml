name: dusky-quokka
title: "Transit Network Register — Association-Backed Joins Behind a Curated Entry Point"
description: |
  A city transit network model whose relationship graph is the point: four classes
  spanning text, numeric, temporal and boolean properties are bound to four tables
  in one relational namespace, each under an explicit identity column and a named
  driving table alias, and every relationship end is implemented over a declared
  inner equality join so navigation resolves to a join rather than to an in-memory
  link. Tabular projections are published as single-execution services, and a
  curated entry point groups the mapping, its runtime, a layout diagram and the
  featured executables with email support metadata.
