name: sunlit-ridge-5
title: "Sunlit Ridge 5 - Plant nursery register over three store schemas, read at a processing date through owned services and a data space"
description: >
  A hillside plant nursery records its seedling trays and planting beds in
  processing-milestoned tables and keeps a plain cultivar catalogue, the
  three tables spread across greenhouse, field and catalogue schemas of one
  store. Flat documented classes are mapped once each by direct columns.
  Three single-execution services owned by a deployment identifier read the
  register: two take a strict-date processing date passed straight into
  all(), one of them keeping only trays of six listed species before
  projecting, and one projects the unmilestoned catalogue. Three Snowflake
  connections with key-pair public authentication back three runtimes, and a
  tagged data space pairs the mapping with a runtime and publishes two of
  the services as executables.
modelSources:
