name: sunlit-cove-6
title: "Sunlit Cove 6 — kelp patch dive survey with an eight-armed cover cascade, a two-hop posting path and three data spaces"
description: |
  A coastal kelp cove patch survey modelled entirely relationally. One survey
  database holds the mapped patches, the dives written against them and the
  station, tract and holdfast registers they are widened from, wired by five
  named inner joins of which one matches an upper-cased dive pair code against a
  concatenated tract code. One relational mapping binds five classes through
  explicit primary keys and main-table aliases, defaults the survey scheme from a
  literal, builds a patch tag by trimming, upper-casing and concatenating the
  holdfast code, resolves a cover band through an eight-armed conditional cascade
  that falls through to a relational null once the cover class leaves the scored
  range, and follows the posting join a second hop into the tract register. Two
  connections behind two runtimes separate the survey warehouse from the
  retained dive archive, and three data spaces publish the survey, shore and
  tally tiers over those two bindings. Three single-execution services drive the
  register, the reach tally and the holdfast lookup: seven conjunctive clauses
  combining injected instant bounds, literal equality, negated equality and two
  set-membership tests that only narrow when the caller supplies them, a
  pushed-down grouping with a count and a sum, and a membership lookup over the
  joined reference detail.
