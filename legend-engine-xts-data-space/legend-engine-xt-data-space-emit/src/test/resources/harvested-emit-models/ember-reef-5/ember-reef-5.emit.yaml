name: ember-reef-5
title: "Reef Buoy Observatory — Seven Processing-Temporal Report Extents Read at the Latest Version"
description: |
  A fringing-reef observatory publishing hourly crest-buoy and daily lagoon-buoy
  water-quality reports, diver transect surveys and a satellite thermal stress
  index. Every report class is processing-temporal and comes in a primary and a
  revised-calibration variant of identical shape, except the stress index. Each
  of seven parameterless services projects every property of one class at the
  latest processing version from a quoted lower-case column store, so a
  superseded version never surfaces. The data space exposes all seven services
  as executables and carries vendor and privacy stereotypes and tagged values.

modelSources:
