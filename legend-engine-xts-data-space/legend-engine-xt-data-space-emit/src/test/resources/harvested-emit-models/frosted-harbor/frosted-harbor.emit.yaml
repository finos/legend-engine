name: frosted-harbor
title: "Frosted Harbor Berthing — A Two-Hop Zone Path, A Unioned Load Root and A Grouped Peak Rejoined to Its Detail Rows"
description: |
  A harbour berthing register whose assignments live on a business timeline and
  carry three bound-checking constraints, two derived properties and a zone read
  across a two-hop join path from the berth to its dock. One service reads the
  extent at a caller-supplied instant, drops layup-graded rows through an
  enumeration inequality, groups the survivors on the two-hop zone and the period
  code with a peak-level aggregate, and joins that grouped relation back to a
  detail projection of the same extent before de-duplicating and ordering. A
  second service queries a load root routed by a union across a quayside and a
  relay population, each side translating its own stored kind label through a
  shared enumeration mapping, reading a roster label from an inline view and
  defaulting its source marker to a literal. Two mapping suites cover the unioned
  register and the grouped dock view, and the store carries filters, three views
  and six joins across six tables.

