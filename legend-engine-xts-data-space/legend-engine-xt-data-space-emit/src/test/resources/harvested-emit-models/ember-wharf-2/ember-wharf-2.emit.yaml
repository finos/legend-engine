name: ember-wharf-2
title: "Ember Wharf 2 - two data spaces over processing-temporal wharf records mapped by composite key onto sibling tables"
description: |
  A harbour wharf operations model. Four processing-temporal record types - berthing slots, gantry
  cranes, vessel visits and staged pallet lots - are mapped onto four unjoined sibling tables of one
  relational store, each class mapping pinning its main table alias and declaring a composite primary
  key over the identifier and the processing-window start so the same identifier can recur across
  load batches. Four single-execution services project the surviving versions flat, and two data
  spaces group the mapping with the warehouse runtime and advertise those services as executables.
