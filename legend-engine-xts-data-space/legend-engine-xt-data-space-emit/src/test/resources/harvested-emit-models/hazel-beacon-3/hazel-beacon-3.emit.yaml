name: hazel-beacon-3
title: "Hazel Beacon — A Two-Store Coastal Beacon Register With Banded Bindings, Ranked Visits And Depot Upkeep"
description: |
  A volunteer coastal trust keeps navigation beacons on two databases. The
  register store holds graded beacons, their shore stations and lamp units in
  one schema and the keepers' inspection visits and the defects raised from
  them in another, while the depot store holds maintenance orders, the crews
  that work them and the parts drawn against them. Two relational mappings
  bind them through primary keys, main-table aliases, joined table-alias
  columns, a literal scheme stamp and eight-, three- and two-armed conditional
  transforms that fall back to a null sentinel. Six associations are
  implemented over the six single-hop inner joins so consumers can navigate
  station to beacon to visit to defect and crew to order to part. Four
  single-execution services prove the bindings through parse, compile and
  execution-plan generation: a register narrowed by day arithmetic off the
  reporting date and a shared code list, a de-duplicated escalation feed, a
  window that ranks lens scores inside each beacon partition, and a capped
  near-term order feed on the second store. Two data spaces surface the two
  bindings with three curated diagrams.
