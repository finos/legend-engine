name: dusky-hatchery-3
title: "Dusky Hatchery Rearing Register — Association-Backed Object Trees, Pagination and Text Documentation"
description: |
  A hatchery rearing register whose brood batches, tanks and facility sites are
  joined across two schemas and traversed through two relational association
  implementations. Batch labels are folded by nested string transforms, three
  single-execution endpoints publish a filtered object-tree fetch, a paginated
  window and a nested tank collection, and markdown text elements document the
  register beside a governed data space.
