name: copper-isle-3
title: "Copper Isle Seabird Census — Data Space, Stored Diagram and Multi-Table Census Mapping"
description: |
  A seabird colony census over a three-relation store: colony counts, the isle
  sector register and the observer shift roster, each bound by its own set
  implementation with a declared primary key and an explicit main-table alias
  and no joins between them. A stored diagram fixes the curated class view, a
  data space publishes the census mapping and its survey runtime as one governed
  execution context, and a parameterised service filters one species by a
  nest-count floor, an accepted survey method and an observed visibility class
  before projecting the derived fledging surplus.

