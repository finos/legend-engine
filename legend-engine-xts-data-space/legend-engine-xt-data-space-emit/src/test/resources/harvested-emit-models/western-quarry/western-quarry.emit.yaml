name: western-quarry
title: "Western Quarry — A Municipal Bale Sorting Model Published Through A Data Space"
description: |
  A municipal recycling depot presses kerbside recyclate into bales, and a small
  relational model of it is published through a data space.

  Two classes are mapped: the baled lot, whose class mapping carries all of the
  derivation, and the sorting depot that pressed it. An association joins them with
  navigable ends in both directions and is given a relational implementation on both
  ends, so navigating from a depot to its bales becomes the store join rather than a
  restated predicate; a mapping test navigates that to-many end and carries the
  bale's derived grade with it.

  The lot mapping exercises four derivation kinds against a two-table store with one
  equality join. The purity grade is an eight-armed nested conditional over the
  measured purity whose fallback resolves to no value; the feed stream is a literal
  supplied by the mapping itself rather than read from any column; the depot name is
  reached across the named join and misses when the lot references a depot that is
  not there; and the kilos per bale is a rounded division over a defaulted bale
  count. Both class mappings declare an explicit primary key and a main table.

  A single-execution service projects the register into eight labelled columns and
  asserts the top arm, a middle arm and the ungraded join-miss row as JSON. A
  Snowflake packageable connection with key-pair authentication and an engine
  runtime resolve it. The data space groups the mapping, its default runtime and the
  service as a featured executable under one named execution context.
