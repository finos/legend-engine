name: cedar-hatchery-2
title: "Cedar Hatchery Record — Processing-Temporal Lots And Inspections Behind One Data Space"
description: |
  A fish-hatchery record split across two relational stores, each holding one
  processing-temporal relation beside its plain lookup relations and joined to
  them by inner joins. Every class mapping anchors its main table, declares a
  single-column identity and reaches lookup columns through join-qualified
  column bindings, while five associations are given relational implementations
  so model-level navigation between the milestoned relation and its lookups
  executes as a store join. Three Snowflake OAuth connections and three engine
  runtimes serve the two mappings on separate tiers, five single-execution
  services project the two milestoned boards at a supplied processing instant
  and the three lookup extents, and one data space catalogues both execution
  contexts with two featured executables and an email support contact.
