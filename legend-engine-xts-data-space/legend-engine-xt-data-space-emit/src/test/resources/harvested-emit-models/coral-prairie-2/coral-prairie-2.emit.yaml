name: coral-prairie-2
title: "Coral Prairie — sward-banded meadow plots over an aliased multi-table grassland store"
description: |
  A prairie grassland survey whose meadow plot class is pinned to one aliased
  table under an explicit composite identifier-and-batch key, so row identity is
  decided by the declared key columns rather than the table's own. Its sward
  vocabulary comes from a nine-armed conditional over a nullable score column with
  a null sentinel fallback, its region name is reached over one named join hop and
  its rainfall norm over two, and a literal defaults the survey programme. Two
  associations are implemented relationally onto the same joins, a data space names
  the mapping and runtime pair, and a batch-parameterised service filters the
  extent twice before projecting it tabularly over a delegated-Kerberos warehouse
  connection.
