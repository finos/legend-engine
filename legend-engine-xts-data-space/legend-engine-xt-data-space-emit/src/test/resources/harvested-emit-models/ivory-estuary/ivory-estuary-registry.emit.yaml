name: ivory-estuary-registry
title: "Ivory Estuary — Tidal Wetland Monitoring Registry (Relational Mapping, Service, Data Space, Diagram)"
description: |
  A tidal-wetland monitoring network published as a curated relational corpus.
  Two domain classes are bound to a two-table store through a mapping that
  anchors each class on a named main-table alias with an explicit primary key
  and resolves the station-to-wetland property across a declared join; the
  bound columns span text, temporal, decimal, floating-point and boolean
  families. A threshold-parameterised single-execution service projects the
  active stations over a Snowflake-typed connection and an engine runtime, and
  a layout element pins both classes and the property that relates them. The
  data space gathers the mapping, runtime, layout element and the service as a
  featured packageable executable, and carries an e-mail support contact. Both
  the mapping and the service carry test suites over embedded relational
  fixtures.

