name: opal-lantern-3
title: "Opal Lantern 3 — Processing-Milestoned Harbour Lamp Register, Included Mappings and Two Data Spaces"
description: |
  A harbour navigation lamp corpus in which every mapped class carries the
  processing-temporal stereotype and every table carries a matching table-level
  milestoning block with an infinity sentinel, so each query is rewritten into a
  window predicate over the in/out columns. A structure mapping binds the lamp
  units and their district keepers to aliased main tables with explicit
  primary-key clauses over the code and window-in columns, and a servicing
  mapping includes it and adds the visit bindings, so the resolved mapping set is
  assembled from two elements and both association ends are backed by named
  inner joins. One service enters through the point-in-time accessor with a date
  parameter, filters on optionality, a negated literal membership set, a
  parameterised membership test and a substring test, and projects a wide
  tabular result; a second scans every stored version instead, projecting both
  window columns so the version count is interpretable. Two data spaces publish
  the mapping and runtime pairs as named execution contexts with a default
  context, featured executables and support contact information.
