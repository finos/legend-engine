name: sable-hatchery
title: "Sable Hatchery - data-space published trail-hut network over a Snowflake-backed store"
description: |
  An alpine trail-hut network mapped relationally: huts and the overnight stays recorded
  against them each bind to an explicit main table with a declared primary key. Three
  single-execution services publish the network - one bands a valley's stays through a
  three-way nested band expression behind a conjunctive predicate with a season set test,
  one narrows huts by valley and access grade, and one aggregates guest counts per valley.
  A data space groups the three endpoints with the mapping and the OAuth-authenticated
  Snowflake-backed engine runtime. Every service carries a test suite executing its query
  against embedded relational fixtures.
