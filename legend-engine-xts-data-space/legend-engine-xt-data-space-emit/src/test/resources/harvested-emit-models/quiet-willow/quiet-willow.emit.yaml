name: quiet-willow
title: "Quiet Willow — Cross-Schema Station Network, Two-Hop Join Navigation & Data Spaces"
description: |
  A non-financial field weather-network model whose station and sensor registers
  live in one schema and whose daily readings live in another. Every relational
  class mapping pins a primary key and a main-table alias; the reading set
  reaches its sensor kind over one inner join and its station name and elevation
  over a two-hop join path that crosses the schema boundary. A profile attaches
  classification stereotypes and tagged values to the mapped classes, mapping
  test suites pin the navigated rows for supplied store data - including an
  unmatched sensor on the first hop and a filtered temperature bound - and two
  data spaces publish the network and telemetry execution contexts over the same
  mapping and H2 runtime.

