name: golden-arboretum-2
title: "Golden Arboretum - alias-qualified join-path projections behind a catalogued data space with curated layout diagrams"
description: |
  An arboretum collection and propagation model. Two relational stores hold the collection tables and
  the propagation tables, and each mapped class names its own main table with an explicit primary key
  while the specimen attributes for bed, soil, grove and cultivar are bound through one-hop and
  two-hop join paths so alias qualification is exercised in several places at once. Two endpoints
  expose structurally different query bodies over the collection mapping, two layout diagrams record
  the curated class views, and a data space groups both execution contexts, both diagrams and both
  featured endpoints behind one support address.
