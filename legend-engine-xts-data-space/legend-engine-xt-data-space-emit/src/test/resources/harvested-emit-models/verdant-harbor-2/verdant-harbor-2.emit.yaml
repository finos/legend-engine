name: verdant-harbor-2
title: "Verdant Harbour Register — Independently Keyed Tables Projected Through One Snowflake-Bound Mapping and a Data Space"
description: |
  A harbour fixture register. Four flat, primitive-typed classes — mooring
  berths, quayside cranes, tide-gauge readings and channel dredging surveys —
  are each bound to their own independently keyed table in a single schema of
  one relational store, so the mapping carries one main-table binding and one
  single-column primary-key declaration per class instead of a rooted table
  graph. Service queries project those classes straight into select lists with
  no predicate, grouping or sort, a mapping test suite resolves identity for a
  fully null-payload row, and a data space with an email support contact wires
  the mapping to the one OAuth-authenticated Snowflake connection the runtime
  exposes.
