name: sunlit-lagoon
title: "Sunlit Lagoon — A Two-Namespace Observatory Register Reached Through Banding Derivations"
description: |
  An invented non-financial observatory register: one relational store split into
  two namespaces, the sky namespace holding the observations and the telescopes
  that took them, the operations namespace holding the sites those telescopes
  stand on, the stewards of those sites and the service visits recorded against
  them. Every reference path is declared on descriptive key columns, and the
  register mapping traverses four of them as association implementations, so a
  property bound through a path pulls the related unit - and, for the site path,
  the second namespace - into the generated statement while a row whose
  counterpart is missing keeps the row and surfaces the widened attributes as
  absent. A named store filter on the site unit removes retired sites, so a visit
  or a telescope pointing at one loses every traversed attribute without losing
  its own row. Attribute derivations live on the classes rather than in the store:
  a seeing band, an aperture class, an altitude band, a boolean exposure test, a
  parameterised exposure band and a composed display label, all computed above
  three defaulting relational transforms. A base mapping holds the site and
  steward units and is included by the register mapping. Two single-execution
  services filter, project and aggregate over the register - one keyed by a path
  segment, one grouping on the joined site name - and a third publishes the same
  body as two execution alternatives keyed by a supplied facility value. A data
  space with two execution contexts lists the classes, publishes both tested
  queries as executables and carries combined support contacts.

