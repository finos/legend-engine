name: amber-estuary-2
title: "Amber Estuary 2 - data-space published reed bed survey over a Snowflake-backed wetland store"
description: |
  A reed bed reserve survey mapped relationally: reed plots and nesting platforms each bind to
  their own explicit main table under a composite primary key of mixed type, and the plot's
  platform label is reached through a sector join so alias qualification matters in more than
  one place. Two single-execution services publish structurally different bodies over the same
  mapping - a parameterized filtered projection that bands the recorded water depth through a
  standalone function call, and an aggregate roll-up per reserve sector - and a data space
  groups both endpoints with the mapping, the Snowflake-backed engine runtime and an email
  support target. Mapping and service test suites execute the projections against embedded
  relational fixtures covering rows that share part of the composite key, a row whose key date
  column is null, and a plot with no join counterpart.
