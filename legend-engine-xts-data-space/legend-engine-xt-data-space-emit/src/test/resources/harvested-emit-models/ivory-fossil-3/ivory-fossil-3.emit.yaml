      - test/ivoryfossil3/mapping/FossilMapping.pure
      - test/ivoryfossil3/runtime/FossilRuntimes.pure
      - test/ivoryfossil3/store/FieldDb.pure
      - test/ivoryfossil3/store/VaultDb.pure
