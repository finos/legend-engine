name: ivory-fossil-3
title: "Ivory Fossil 3 — fossil collection register with routed union and graded field tags"
description: |
  A non-financial fossil collection register. Catalogued and archived specimens are routed
  onto one extent by a union operation over filtered relational class mappings with
  multi-column keys, an eight-arm kind classifier with a null fallback, an enumeration
  mapping fed by a case expression, an embedded measurement and a two-hop site lookup.
  Field tags are graded by model-to-model expressions. Snowflake and Sybase connections
  with mapper post-processors back two multi-context data spaces with diagrams.
modelSources:
