name: solar-prairie-2
title: "Solar Prairie Restoration Station — A Hub Class Reached From Thirteen Record Classes Through Declared Associations"
description: |
  A relational model for a prairie restoration station, shaped as one hub class surrounded by thirteen
  record classes. A single schema holds the site table plus one table per record kind, and one join per
  record kind resolves a record back to its site; a further join pairs two of the record tables directly.
  One mapping binds every mapped class to its own main table alias under an explicitly declared primary
  key, resolves the site name and district of each record across that record's join, and implements every
  declared association as a relational association mapping over the same join. A fifteenth class is kept
  as unmapped reference material. Two Snowflake connections authenticated by delegated token exchange
  back two runtimes over the one store, three tabular endpoints publish a district-scoped record query, a
  rate-filtered record query and an unfiltered projection, and one data space presents the endpoints under
  two execution contexts, one per runtime.
