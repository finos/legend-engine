name: coral-fossil-2
title: "Coral Fossil Survey — Composite-Keyed Relational Survey Behind a Governed Data Space"
description: |
  A fossil-reef field-survey project. Four survey tables in one schema — dig
  sites, catalogued specimens, coral colony readings and field collectors —
  each declare a composite primary key of a survey date with an identifier and,
  for colony readings, a recording instant. Specimens reach their dig site
  through a two-column inner join implemented as a relational association.
  Single-execution services owned by one deployment identifier project each
  class into renamed columns, one of them filtering by a strict-date path
  parameter, over a key-pair authenticated warehouse connection with query
  tagging on. A data space with a classification stereotype, three tagged
  values, a diagram and email support lists the parameterless services as its
  executables.
