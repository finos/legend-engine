name: opal-warren-2
title: "Opal Warren 2 — A Tower Ring Register Over An Included Relational Store With An Eight-Arm Tone Ladder, An Association Implementation And A Digest Service"
description: |
  A tower-ring stewardship register whose store is assembled from two database elements: a core
  store carrying the hung-bell and belfry-frame tables, and a register store that includes it,
  and declares the store filter and the bell-to-belfry join the register is read
  through. Two chained mappings compile in order: a base layer that keys the bell extent on its
  identifier through an explicit main-table alias, resolves the tone label through eight case arms
  and an unrecorded fallback, bands the tier from the tone code, folds a missing bell name and an
  unrecorded headstock onto sentinels and derives the swing margin arithmetically; and a register
  layer that includes it and implements the housing association across the bell-to-belfry join so
  the frame name is reachable one hop out.

  Above the mappings sit a digest service that keeps the weighed bells, projects the bell key, the
  resolved tone label, the tier, the arithmetic margin and the joined frame name as a tabular data
  set, and a governed data space wiring the register mapping to the in-process tier.

  Both the mapping suite and the service suite assert over the same nine-bell ring: one row for
  every tone arm, plus the unnamed, unrecorded-headstock bell that falls through to the sentinels,
  with a scrapped bell present in the mapping fixture to prove the store filter removes it.
