name: coral-cove
title: "Coastal Dune Restoration Register — Processing-Temporal Plots, Plantings And Fence Runs Read At A Requested Instant Through A Data Space"
description: |
  A coastal dune restoration programme whose plot register, marram planting batches and
  drift fence runs are each processing-temporal: every class carries the temporal
  stereotype and every backing table declares a matching processing window with an
  infinity sentinel on the open row. One mapping binds each class to its own main-table
  alias with an explicit key over the identity column and the window-in column, reading a
  mixed type surface of strings, fixed-precision numerics, floats, dates and timestamps as
  direct columns. Three single-execution services enter through the milestoned accessors
  with one point-in-time date parameter, compose set-membership and threshold predicates
  with the window predicate the temporal rewrite adds, and project wide tabular contracts;
  a data space groups the mapping and runtime into a named context and publishes all three
  endpoints. The mapping and service suites each supply a version closed before the
  instant and a window opened after it, so the out-of-range rows are proven to be dropped.
