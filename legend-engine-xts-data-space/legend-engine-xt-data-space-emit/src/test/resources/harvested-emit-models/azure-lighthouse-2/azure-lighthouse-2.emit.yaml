name: azure-lighthouse-2
title: "Azure Lighthouse 2 — catalogued coast-beacon network over a multi-table relational store with plan-generating tabular endpoints"
description: |
  A coastal beacon network mapped relationally: five independent tables of one
  store back five model classes, and every class mapping names its own main table
  and declares an explicit primary key, so each mapped class scopes its own FROM
  clause and row identity. Single-execution endpoints project those classes into
  tabular results — cased labels, scaled ratings and nested classification arms —
  and each carries the mapping and the warehouse-backed engine runtime that
  resolves it into relational instantiation and SQL plan nodes rather than merely
  compiling. A data space groups the mapping, the default runtime and two featured
  endpoints into one catalogued execution context with an email support target,
  while two diagrams record the visual layout of the same classes without adding
  execution semantics. Mapping and service test suites pin the projected rows
  against embedded relational fixtures.
