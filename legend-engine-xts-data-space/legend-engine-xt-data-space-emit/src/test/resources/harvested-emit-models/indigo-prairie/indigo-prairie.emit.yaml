name: indigo-prairie
title: "Indigo Prairie — Cross-Schema Grazing Rotation with Associations and a Governed Data Space"
description: |
  A non-financial prairie grazing model over a multi-table relational store split
  across two schemas, where paddocks, clipped forage samples, herd moves and field
  notes are bound through primary keys and main-table aliases and reached over
  single-hop and two-hop inner join paths that cross the schema boundary.
  Two associations are given relational association implementations in two
  mapping tiers, and filtering, projecting services with parameter profiles
  publish the joined results. A data space exposes both mapping tiers as
  execution contexts with featured packageable-element executables and a support
  email address.

