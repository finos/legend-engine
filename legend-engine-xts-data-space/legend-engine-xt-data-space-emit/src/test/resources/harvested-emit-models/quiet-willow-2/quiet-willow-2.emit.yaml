name: quiet-willow-2
title: "Quiet Willow - a business-temporal carriage workshop register read across four schemas, an aggregate tally view and a two-hop reference chain"
description: |
  The carriage workshop of a narrow-gauge heritage railway, carried as two business-temporal relations - the
  carriage sheets themselves and the overhauls booked against them - so a sheet that only opens later in the
  year is out of range on an earlier day and a booking whose window has closed drops out of that day's totals.
  Both sides declare an explicit primary key and a main-table alias, and the reference data they resolve
  against lives in three further schemas: the depot a carriage sits at is reached through one declared join and
  its region through the two-hop chain beyond it, the works site of an overhaul is reached the same way, and
  the fitters of a site are read back across the staff schema. Every one of those reference properties is
  optional, so the joins are outer rather than inner, while the carriage-to-overhaul relationship is realised
  as an association implementation over a third join and stays inner. Alongside the register the workshop keeps
  a billable-hours tally sheet, aggregated in the store itself as a grouped inline view and joined back onto the
  carriage so the same numbers can be read either by folding the relationship or by reading the view. The
  reference mappings and the enumeration mappings are brought in through two mapping includes rather than
  restated. Above the store sit an as-of register narrowed by a named region, a seating floor and the classes
  kept in traffic, a workload endpoint that fans the bookings out and folds them back to one count and one
  total per carriage before ordering and truncating, and a roster endpoint over the unmilestoned staff schema.
  A governed access point names the tier and its three endpoints, and the mapping and service suites cover a
  multi-hop reference hit, a sheet outside the queried window, a superseded booking and an empty result.
