name: golden-otter-9
title: "Golden Otter 9 — a river otter sanctuary register federated from four included stores and served through parameterised and collection-filtered services"
description: |
  The register of a river otter sanctuary. Four dependency stores each hold one schema - river reaches,
  holts with their habitats, survey sightings and the watch-team observers - and an aggregate store
  declares no tables of its own, includes all four and declares five single-column inner joins whose two
  sides always sit in different schemas. Four dependency mappings carry the class mappings with trimmed,
  upper-cased, concatenated and case-banded transforms; the aggregate mapping includes each of them with
  its store substituted by the aggregate store and declares only the five association mappings, each end
  bound to one join. Two mapping suites read the association graph. Seven single-execution services under
  identifier-based ownership share the mapping and one cloud warehouse runtime: two take integer month and
  year parameters with a three-code membership test, one combines a boolean equality with an existence
  test over to-many sightings, one nests a non-empty test inside an existence test and deduplicates, one
  filters projected rows on a string column before deduplicating, and one narrows a to-many path to the
  latest row inside a projection. A data space lists the services as executables beside a diagram.
