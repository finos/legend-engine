name: golden-reef-5
title: "Golden Reef 5 - processing-temporal nesting sites joined across schemas behind a mapper-post-processed warehouse connection"
description: |
  A turtle-nesting coast survey. Nesting sites are versioned over processing time and reach their
  beach through a one-hop join and the cross-schema field station through a two-hop join path, while
  the clutches walked by the patrol teams carry a mapped literal survey programme and are linked to
  their team through a relational association implementation on top of an included base mapping. A
  parameterised service filters a thirty-day window off a date adjustment, screens the predation
  marker against a collection parameter, then de-duplicates, orders and caps the projection; a second
  multi-execution service counts the sites recorded at a pinned instant per coast region. One runtime
  reads the local survey database, the other a Snowflake warehouse whose connection carries a mapper
  post-processor that rewrites both the schema and the site table onto their published names.
