name: amber-vineyard-2
title: "Amber Vineyard 2 - Fossil Dig Catalogue (store-include, operation mapping, business milestoning)"
description: |
  An advanced relational model over a business-temporally milestoned fossil
  dig catalogue. A single addressable store includes two other stores and
  declares joins spanning their boundaries, including a self-join and
  literal-filtered cross-table joins across schemas. The mapping specialises a
  base dig record through class inheritance, folds an eight-arm conditional and
  an enum-of-expression grade over source codes, resolves an excavator across a
  two-hop join, embeds provenance and inline field metrics, defaults a literal
  register, and unions two note tables through an operation mapping. A data
  space with combined support info and a diagram surface the curated model.
