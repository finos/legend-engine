name: sable-beacon
title: "River Gauge Network - Multi-Hop Join Chain, Conditional Grade Transform and a DataSpace"
description: |
  A river gauge corpus whose readings are resolved to their drainage basin through
  a five-hop sensor, station, district, zone and basin join chain, reused by an
  inline view for the view-backed basin property. The grade label is a conditional
  relational transform with two recognised arms and a null fallback. One service
  filters readings into the cutoff month with date arithmetic and a multi-valued
  grade membership test and asserts all four branch rows, a second aggregates level
  totals per basin, and a DataSpace publishes the mapping under two execution
  contexts.
