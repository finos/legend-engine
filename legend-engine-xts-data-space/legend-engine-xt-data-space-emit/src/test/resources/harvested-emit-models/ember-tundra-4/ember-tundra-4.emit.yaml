name: ember-tundra-4
title: "Ember Tundra 4 — A Bitemporal Herbarium Register With An Eight-Armed Size Band, Let-Bound Collection Windows, Confirmed-Note Exists Tests And A Family Rollup"
description: |
  A herbarium keeps bitemporal specimen sheets, business-dated determination notes and storage
  cabinets, and a processing-dated curator roll in one Snowflake store. The mapping bands each
  sheet height through an eight-armed size cascade falling through to an explicit null. Four
  single-execution services resolve the bitemporal roots with processing and business dates:
  one filters on a family membership set, projects the band and the collection year and extends
  a display column choosing between the band and a fixed label; one binds a window end that
  defaults to the current date, keeps sheets with a confirming note through a milestoned
  to-many exists test with upper-cased contains, and de-duplicates the projected note authors;
  one filters through a cabinet exists or an empty condition, drops empty sheets after
  projection, extends a stature column and groups by family and stature with sum, count and
  max; and one reads the processing-temporal curator roll with a case-insensitive prefix. A data
  space packages the execution context and a diagram; three OAuth connections are bound by
  three engine runtimes, each seeded by the service test suites.
