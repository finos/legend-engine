name: gilded-prairie-2
title: "Gilded Prairie 2 — Assembled Mapping Layers Over Sibling Processing-Temporal Grassland Stores"
description: |
  An advanced grassland-survey catalogue whose relational surface is split across
  three sibling stores — a steward/region reference store, a plot and soil store
  and a survey and stem-count store — pulled together by a fourth store that
  includes all three and declares the joins that cross them. Six processing-temporal
  classes are bound by four mappings assembled through includes: a reference layer,
  a standalone habitat layer, a survey layer that includes the habitat layer, and a
  catalogue layer that includes both and carries the association implementation that
  spans them. Joined properties are reached one and two joins away, so a row whose
  far side is unmatched or temporally closed resolves the joined value as a null.
  Five single-execution services cover point-in-time retrieval, prefix filtering,
  membership over an unbounded caller collection, a window bound computed inside the
  query by shifting a caller date, projection de-duplication and two ordered bounded
  slices, and one data space publishes the three mapping/runtime tiers with the
  services as its executables. Mapping-level suites assert the joined and multi-hop
  projections directly against store fixtures.

