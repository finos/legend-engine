name: sable-aviary
title: "Sable Aviary — Processing-Milestoned Ringing Register With A Data Space And Grouped Register Services"
description: |
  An aviary ringing register whose single-schema store carries three processing-milestoned tables —
  the ringed bird, the flight enclosure and the delivered feed batch — beside the unmilestoned species
  guide and keeper shift they are joined to, so every extent resolves at a processing date and a
  restated row closed out earlier falls out of range. One relational mapping pins each of the five
  classes onto its own main table with an explicit primary key, resolves the diet label through four
  case arms and an unrecorded fallback, pins the register provenance on with a literal transform, and
  binds the enclosure name one join hop out of the milestoned bird extent; the four associations are
  mapped as association implementations so the register can be walked from either end. Above the
  mapping sit a nested condition-banding function, a day-count register-age helper and a headline
  composer, three single-execution services — a filtered and de-duplicated bird register, a
  date-shifted recent-ringing feed and a grouped feed tally — and a data space whose single execution
  context pairs the mapping with the register runtime and features all three services, so a consumer
  can execute without naming either.
