name: jade-isle-2
title: "Jade Isle Trail Network — Processing-Milestoned Warden Patrols Over An Including Mapping Across Two Cross-Schema Stores"
description: |
  An island nature-reserve record published through two mapping layers: a core
  layer resolves trail segments, the protected habitats they cross and the walker
  tallies recorded on them out of one store whose habitat table sits in a second
  schema, and a patrol layer includes that core layer and adds the warden record
  out of a second store whose roster notes likewise sit in a second schema. The
  warden patrol class is kept on a processing timeline, so corrections are closed
  out in place and only the versions open at the requested date resolve. Three
  associations are implemented purely as store joins, every class mapping is
  keyed and aliased onto its main table, and three parameterised tabular services
  cover the shapes the record is consumed through: a membership-filtered segment
  board, a membership-filtered patrol window resolved at a processing date, and
  the unfiltered register at that date. Two data spaces feature the endpoints and
  bind the mapping and runtime pairs a consumer executes against.
