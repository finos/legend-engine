name: western-thistle-2
title: "Propagation Nursery Bench Estate (multi-table relational store, composite keys, three service bodies and a data space)"
description: |
  A plant-propagation nursery estate mapped onto a four-table relational schema in one warehouse
  store: propagation houses, the cultivar reference, the seed lots sown against both, and the
  timestamped bench readings taken inside each house. Every class mapping names its own main table
  and declares an explicit primary-key expression list, two of them composite over mixed types, so
  alias qualification and key derivation are both observable. Three structurally different services
  publish the same mapping - a keyed register with a nested conditional column, a grouped and sorted
  seed tally, and an unparameterised ranked survey - and a data space packages two of them as
  executables under a single execution context.
