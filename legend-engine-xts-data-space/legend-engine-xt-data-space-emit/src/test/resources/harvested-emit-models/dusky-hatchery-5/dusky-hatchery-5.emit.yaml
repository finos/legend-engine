name: dusky-hatchery-5
title: "Dusky Hatchery 5 — Processing-Temporal Fish Hatchery Programme (Multi-Table Store, Diagram, Data Space)"
description: |
  A fish-hatchery rearing programme published as a curated relational corpus.
  Three processing-temporal classes are bound to three milestoned tables of one
  schema, each class mapping anchored on its own named main table with an
  explicit primary key over that alias, and the batch-to-pond property resolved
  across a declared join so two milestoned main tables are aligned on the same
  processing predicate. The column spread covers string, integer, date,
  timestamp, floating-point and decimal families. Three single-execution
  services take the processing instant they resolve at and differ structurally:
  a threshold-filtered projection, a species-parameterised projection reaching
  through the join, and an aggregate over the feeding log. Every suite includes a
  superseded version whose processing window closed before the requested
  instant, and one endpoint is also probed at an instant before any version
  exists. A layout element pins the three classes and the property relating two
  of them, and the data space gathers the mapping, runtime, layout element and
  all three endpoints as featured executables with an e-mail support contact.

