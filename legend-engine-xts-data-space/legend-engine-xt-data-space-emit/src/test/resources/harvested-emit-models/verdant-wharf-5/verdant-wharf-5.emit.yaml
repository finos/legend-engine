name: verdant-wharf-5
title: "Verdant Wharf 5 — Cross-Schema Wharf Berths, Call Legs and Pallet Checks Behind Three Parameterised Service Shapes"
description: |
  A harbour-operations read model spread over two schemas of one relational store —
  quay berths and vessel call legs in the harbour schema, landed pallets and wardens
  checks in the logistics schema — so every generated table reference has to be
  schema-qualified. Four class bindings each pin their own main table alias, two of
  them behind a composite primary key of mixed type, and three named equi-joins of
  different key shapes carry the association implementations plus a two-hop path
  that resolves a wardens check back across the schema boundary to its call leg. An
  eight-armed handling-lane conditional falls through to a null for an unrecognised
  priority. Three services over one Snowflake-bound runtime expose structurally
  distinct query shapes — a three-parameter filtered projection that walks the berth
  association, a grouped aggregate summing pallet totals per class and berth, and a
  nested-collection escalation that tests pallets and their checks before coercing a
  single berth name — each with parameters bound once to selecting and once to
  non-selecting values. A data space packages the mapping, runtime, featured
  endpoints and support address as one product surface.
