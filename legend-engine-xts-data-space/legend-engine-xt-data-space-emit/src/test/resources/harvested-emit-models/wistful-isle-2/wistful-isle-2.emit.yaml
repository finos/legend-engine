name: wistful-isle-2
title: "Wistful Isle Nest Reserve — Data Space over an Association Estate with Two-Hop Inner Joins"
description: |
  A tidal-isle nest reserve in which nest sites, cliff ledge sections and named
  isles are mapped onto three relational tables joined in a chain. Two
  bidirectional associations are implemented as relational association mappings
  over the same join definitions the nest class mapping walks, the nest's isle
  attributes resolve through a forced two-hop inner join path anchored on a
  pinned main-table alias, and a string-function transform composes the access
  note from both hops. A data space publishes the in-process survey tier and the
  warehouse review tier over the one curated mapping.

