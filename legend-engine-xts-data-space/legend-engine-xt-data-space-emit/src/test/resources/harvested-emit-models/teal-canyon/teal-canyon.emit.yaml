name: teal-canyon
title: "Teal Canyon River Monitoring — Association-Implemented Multi-Table Gauge And Survey Servicing Behind A Data Space"
description: |
  A canyon river-monitoring record whose four classes are stitched together by
  three associations that are implemented in the mapping purely as store joins:
  gauges hang off the reaches they are installed on, and each field survey
  reaches both its gauge and the crew that took it. The relational store holds
  four tables in one schema, two of them keyed on a compound key that pairs a
  code with a date or a timestamp, and the gauge class also reaches its reach
  name directly through a joined property rather than through the association.
  Three structurally different tabular services publish the model: a wide
  station board mixing stored columns with a concatenated label and an
  arithmetic score, a thin reach roster over the parent table alone, and a
  survey log that walks both association implementations in one projection and
  scales a reading. A data space with support metadata features two of the three
  endpoints, and the warehouse is addressed through an ambient-credential
  connection.
