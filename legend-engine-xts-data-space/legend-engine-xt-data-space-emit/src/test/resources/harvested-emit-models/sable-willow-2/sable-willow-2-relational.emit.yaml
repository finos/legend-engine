name: sable-willow-2-relational
title: "Sable Willow 2 — Milestoned Hub Navigation Across Included Stores"
description: |
  A wildlife rehabilitation register whose admissions and enclosures are
  corrected over processing time and whose reference species and care rotas live
  in schemas contributed by two upstream stores brought in by inclusion. Six
  associations fan out from the admission hub, one of them implemented through a
  three-hop chain that climbs the enclosure hierarchy over a self-referencing
  join and then crosses schemas on a join predicate that upper-cases a column,
  and three services read the register at a pinned instant through two runtimes
  whose connections remap every schema name at execution time.
