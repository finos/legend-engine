name: indigo-gecko-2
title: "Indigo Gecko 2 - Maker-space tool toolshare tallies, rosters and overdue watch"
description: >
  A maker-space shares tools to members attached to workshop benches.
  Checkouts reach the member, the bench and its steward over up to three to-one
  hops, and the tool and its supplier over two; usage readings are embedded on
  the checkout row, status codes translate to a toolshare state enumeration and a
  case label, and a derived property sums wear and setup points. Period services take
  year-month and bench codes from the URL, filter with negated contains,
  starts-with and ends-with code tests and literal-list membership, then group
  by bench, a conditional tool class and supplier summing wear and all points with
  a non-zero total filter, or project navigated columns and deduplicate. An
  overdue watch uses day differences, date adjustment and the current date over
  empty and populated tag collections. Two data spaces expose the services and
  template projections with a class diagram.
