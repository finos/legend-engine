name: quiet-summit-2
title: "Quiet Summit 2 - data space over four single-execution projection services on a multi-table relational mapping"
description: |
  An alpine ridge observation network. Four weather-post types are mapped onto four tables of one
  relational store through explicit main-table aliases and primary keys, and each type is published
  by its own single-execution service returning a flat tabular projection. A data space groups the
  mapping with a warehouse-backed and an in-process execution context, carries profile stereotypes
  and tagged values, and advertises an email support target.
