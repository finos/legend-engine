name: opal-otter-2
title: "Opal Otter Reach Trials — Two Near-Copy Relational Bindings, a Seeded Embedded Connection and a Deliberately Unresolvable Executable"
description: |
  An otter reach survey scenario registry bound twice. Two near-copy relational
  stores carry the same wide scenario table and a narrow lookup - one keyed on a
  text identifier, one on a whole number - and two mappings bind the same
  scenario class through them, each resolving its lookup label across an inner
  join and each declaring a relational association implementation. The embedded
  database connection carries its own fixture rows inline in the datasource
  specification, so the seeded runtime both provisions and populates the text
  store, and it is the only store the runtime binds. Both services declare
  ownership with an empty identifier: the first pairs the text mapping with that
  runtime and executes, while the second names the whole-number mapping whose
  store the runtime never connects, so it compiles but cannot execute. A
  collection lookup class shadows an association endpoint with an identically
  named and typed to-many property, and a standalone document-format data
  element sits alongside the group unreferenced.
