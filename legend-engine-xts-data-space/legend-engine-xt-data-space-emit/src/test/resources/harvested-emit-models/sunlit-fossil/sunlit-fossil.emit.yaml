name: sunlit-fossil
title: "Specimen Dispatch Dispatches — Business-Temporal Two-Hop Join Chain"
description: |
  An advanced relational model over natural-history specimen dispatches. A single
  store holds four business-milestoned tables forming a three-level chain: dispatch
  terms, dispatches, dispatch line items and item portions. One relational
  mapping carries four root class mappings with explicit primary keys and main
  table aliases, and reaches the child collections through a single-column join
  and a composite two-column join, so every traversal also carries the
  milestoning predicate. Two data spaces publish that one mapping under two
  execution contexts, each pinning a runtime whose Snowflake connection carries
  its own schema-rewrite post-processor, so only the schema qualifier of the
  generated SQL differs between tiers.
