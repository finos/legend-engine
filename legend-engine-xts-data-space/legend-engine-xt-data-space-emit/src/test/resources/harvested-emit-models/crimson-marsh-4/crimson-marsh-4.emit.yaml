name: crimson-marsh-4
title: Crimson Marsh 4 reed census - a business-temporal census banded through an eight-armed ladder onto a null sentinel and reached in both directions across an association
description: >
  A reed census held on a business timeline over a milestoned table, keyed on its own
  census reference against an aliased main table. The census extent is banded in the
  mapping through an eight-armed ladder over the recorded stem grade, and a grade that no
  arm recognises falls through to a null sentinel rather than to a placeholder string, so
  the unbanded census is still returned with its remaining columns. The reed bed extent
  lives in an included mapping and is reached from the census through an association
  implemented over the declared equality join, so the census walks to its bed and the bed
  walks back to its censuses over the same hop, while the bed label is assembled from the
  reached bed name and warden code. A bed that carries no census never surfaces. A mapping
  suite graph-fetches the timeline at a business date so every ladder arm lands on its own
  row, the sentinel row is asserted as serialized structure, and a census whose validity
  window closed before that date is out of range and absent. A data space publishes the
  binding through a local warden context and a published warehouse context.
