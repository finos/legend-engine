name: western-thistle
title: "Western Thistle — Curated Cycle Network Entry Points Over Two Relational Stores"
description: |
  A non-financial city cycle-network model that publishes parameterized single-execution
  services over two multi-table relational stores whose class bindings each name a primary
  key and a main-table alias. Two curated data spaces bind the compiled mappings, their
  local and warehouse runtimes and their featured service executables into consumable
  units carrying email support metadata, and every mapping and service is covered by
  projection test suites over text, numeric, boolean and date columns.

