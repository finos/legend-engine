name: ivory-ridge-2
title: "Ivory Ridge — Aliased Multi-Table Airtime Mapping, Windowed Endpoints & Governed Publication"
description: |
  A community-radio airtime schedule spread across four sibling tables in one schema: stations
  with their transmitter ratings, the programmes they carry, the rostered presenters and the
  aired slots. Each class mapping selects its own main table and declares an explicit composite
  primary key of mixed type - the slot key spans a code, an aired date and a sequence number,
  the programme key spans a code and the carrying station - while the station label is reached
  through a two-hop join path and one presenter and one station deliberately have no slot of
  their own. Three structurally distinct endpoints run over the mapping through the local
  runtime: a genre-filtered projection of mixed-type columns including the derived label,
  listener-minute and audience-band values, a grouped listener and airtime rollup per station,
  and a partitioned ranking whose partitions contain tied slots, a single slot and an unattached
  programme. A warehouse connection fixes the Snowflake dialect, datasource specification and
  public-key authentication strategy for the warehouse runtime, and a governed publication wires
  the mapping, both runtimes and the featured endpoints together.
