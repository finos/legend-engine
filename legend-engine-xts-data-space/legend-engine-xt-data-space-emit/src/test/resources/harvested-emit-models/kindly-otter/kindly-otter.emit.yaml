name: kindly-otter
title: "Kindly Otter — Wide Flat Branch Records Published Over Two Estates Reached By Identifier Rewriting"
description: |
  A public-library branch corpus of independent wide records — a twelve-column monthly lending
  series with its declared annual total, branch service profiles, shelved stock with its
  reservation queue, volunteer periods and an outreach register — all bound by a single relational
  mapping to one multi-table store with no join between any two relations. Validity is enforced
  unevenly: a minority of the classes carry constraints over their own properties while the rest
  are unconstrained. Two connections sit over that one store, each carrying a name-rewriting
  post-processing stage that moves every declared relation onto a different schema and table name,
  so the model's declared identifiers are logical only and two runtimes reach two physical estates
  without any change to the classes. A data space fixes the primary estate as the published default
  and lists the curated diagrams and featured endpoints, behind which four parameterless services
  project each record at full width.
