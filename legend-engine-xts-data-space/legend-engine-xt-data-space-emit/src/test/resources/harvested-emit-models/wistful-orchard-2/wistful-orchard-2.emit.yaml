name: wistful-orchard-2
title: "Wistful Orchard Graft Register — processing-milestoned graft runs, an eight-arm conditional scion band, a five-hop warden path and two inline views"
description: |
  An orchard graft register over two relational stores. A reference store owns
  the scion grade, grove plot, orchard house, warden and warden post relations
  plus the four joins that chain them; the register store includes it and adds
  the processing-milestoned graft run relation, the graft journal and tray load
  relations, an aggregating inline view over the tray loads and a second inline
  view that derives a journal tag, a season flag and a tended flag from nested
  conditional and string dyna functions, spread across three schemas. The
  register mapping derives a scion band from an eight-arm conditional chain of
  relational dyna functions ending in a null sentinel, nests conditional load
  and note labels three levels deep over the tray view and the note text,
  divides canopy span across the grafted scions, composes a ten-way band
  membership test, binds tray mass and tray tally to the aggregating view and
  the journal tag and season flag to the derived view, walks a two-hop plot
  path and a five-hop warden post path, and maps two enumerations whose source
  values leave one row deliberately unmapped. A second root mapped through a
  store filter keeps only the grafting journals. Three derived properties fold
  the conditional labels back into tended, grafted and compact predicates. Five
  services expose the register: a point-in-time roster taking a processing date
  and a canopy span floor, a plot span ranking over an unpartitioned window, a
  widest-run-per-plot ranking over a partitioned window, a relative day window
  over the journals and a deeply nested tended run audit. A data space packages
  the mapping against the register runtime.

