name: teal-glacier-3
title: "Teal Glacier 3 — Alpine Footbridge Register Behind A Catalogued Entry Point And A Keyed Endpoint"
description: |
  An alpine footbridge inspection register whose two extents are mapped onto one schema: the bridge
  extent reads its own aliased relation and reaches the district name across the single declared join
  rather than carrying it, while the district extent reads that same relation in its own right, so the
  relation is planned once as a join target and once as an extent. Each class mapping pins the columns
  that identify an instance and the alias its column reads are qualified against. A derived property
  computes the span label off the mapped code and span after the row is instantiated, so the projected
  column is resolved in post-processing rather than pushed into the statement. Two endpoints publish the
  register as explicit column contracts carrying no predicate of their own: the bridge endpoint declares
  an environment key so one query body is planned under a caller-selected binding, and the district
  endpoint is bound directly. A catalogued entry point binds the mapping and runtime pair, features both
  endpoints as executables, publishes the layout that draws the three declared classes, and lists the
  roster class the districts staff walk-outs from, which is published for discovery without a store
  binding of its own. A local in-process warehouse supplies the execution binding, and both the mapping
  suites and the endpoint suites assert a single keyed row.
