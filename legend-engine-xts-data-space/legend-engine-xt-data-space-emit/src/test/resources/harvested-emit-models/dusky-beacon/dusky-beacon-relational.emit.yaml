name: dusky-beacon-relational
title: "Dusky Beacon Observatory Roster — Association, Inner Join & Windowed Service"
description: |
  An observatory survey domain wiring two classes through a mandatory bidirectional
  association whose relational implementation rides a single inner join across two
  tables. A single-execution service filters recently commissioned telescopes with a
  date-arithmetic window and projects them back through the join, and a data space with
  an email support block publishes the mapping-runtime pair, both fed by a reusable
  relational data element.
