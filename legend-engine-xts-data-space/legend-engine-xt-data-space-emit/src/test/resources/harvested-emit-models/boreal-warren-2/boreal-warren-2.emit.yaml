name: boreal-warren-2
title: "Boreal Warren — Cave Ripening Register with View-Backed Turn Totals"
description: |
  A cheese-cave ripening model whose wheel-batch class carries two constraints
  and reaches its owning ripening cave through an association. The batch
  mapping includes a second mapping for the cave, addresses every column
  through a main-table alias, bands the rind through a nested eight-arm
  conditional that falls through to a null band for unmatched and absent
  codes, falls back to a placeholder note, and doubles a measured weight. Two
  properties are backed by a filtered, grouped inline view reached through an
  inner join, and the awarded grade is reached through an optional relation so
  ungraded batches keep an absent grade. Three single-execution services read
  the register: one lists every band of one cave with an age in days against a
  supplied anchor date, one groups weight and counts per cave on a joined
  grouping key, and one joins a batch projection to a cave projection to
  report the humidity each batch ripens at. A data space exposes the working
  cellar tier and a warehouse tier over the same mapping.
