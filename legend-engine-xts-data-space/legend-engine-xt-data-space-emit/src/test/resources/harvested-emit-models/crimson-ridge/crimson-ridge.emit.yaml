name: crimson-ridge
title: "City Greening Catalogue — Data Space over Associated Domain, Two Mappings and Seven Endpoints"
description: |
  An urban-planning green-space catalogue whose six associated classes are bound
  to a six-table relational store through two mappings, the composing one
  including the neighborhood mapping and rewiring its class bindings, and whose
  associations are implemented end-by-end over the declared inner joins. Seven
  single-execution endpoints project through those joins at up to three hops and
  narrow their extent with conjunctions over navigated, numeric, boolean and
  enumeration comparisons. A curated data space groups the mapping, the
  in-process and warehouse runtimes, an overview layout element and the featured
  endpoints into one consumable unit with a support address.
