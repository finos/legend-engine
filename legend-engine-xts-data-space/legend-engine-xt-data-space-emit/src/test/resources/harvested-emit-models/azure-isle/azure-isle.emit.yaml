name: azure-isle
title: "Azure Isle — Island Seabird Nest Counts With Processing Milestoning, Conditional Classifications, Four-Hop Joins And Grouped And Distinct Views"
description: |
  Nest counts of island seabird colonies are delivered in processing batches and read as of a supplied
  processing day. The count mapping classifies the raw weather, method, chick and size codes with nested
  conditional transforms and resolves the plot, colony, island, reserve and species of every count through
  join chains of up to four hops. A grouped view keeps the latest completed census visit of each colony
  behind a named disjunctive filter, and a distinct view collapses repeated roster rows behind an inequality
  filter; both back their own classes. Five services filter, project, sort and group the counts, visits and
  roster, are featured by one of four data spaces together with a diagram, and run on two OAuth Snowflake
  connections whose mapper post-processors rewrite the schemas.
