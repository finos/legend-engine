name: coral-warren-9
title: "Coral Warren 9 — a community seed library register read through views and published as data space executables"
description: |
  The register of a community seed library. One cloud warehouse database spans three schemas -
  the variety catalogue, the lending branches with their shelved packets, and the donating
  gardeners - and every class mapping reads a view laid over a base table rather than the table
  itself, one view composing a branch tag from a literal prefix. Four equality joins between the
  views back the four associations, so variety labels, family labels, branch tags and donor names
  are reached through one hop. Five single-execution services under deployment-identifier
  ownership share the mapping and a public-key authenticated warehouse runtime: they retrieve all
  instances and project, some first filtering on an equality against a parameter, a literal
  membership set, or both combined. A data space lists a curated subset of the services as titled
  executables beside two diagrams of the classes and associations.
