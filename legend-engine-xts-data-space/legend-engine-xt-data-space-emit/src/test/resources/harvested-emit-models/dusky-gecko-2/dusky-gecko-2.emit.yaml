name: dusky-gecko-2
title: "Dusky Gecko - a diagrammed cross-schema husbandry binding behind a two-tier data space"
description: |
  A reptile house husbandry model. A single database carries a husbandry schema
  of enclosures and keeper shifts beside a taxonomy schema of species profiles,
  each class bound to its own aliased main table through an explicit primary
  key with no join path between them. A diagram lays the three classes out, and
  a data space pairs the in-process house tier with a vault-authenticated
  warehouse tier whose service is compiled and plan-generated only.
