name: scarlet-willow
title: "Scarlet Willow - Municipal Tree Inventory (multi-execution services, cross-schema nested joins)"
description: |
  An advanced relational model over a municipal tree inventory. A cross-schema
  store spreads driver, site, reference and hierarchy tables across three
  schemas linked by a dozen joins, including literal-discriminated ones and an
  inline view whose soft-delete indicator is a null-defaulting conditional.
  Bidirectional associations chain trees through sites, districts and regions,
  and the relational mapping binds navigation properties to nested join paths
  four hops deep. Environment-keyed multi-execution services and a data space
  expose parameterized queries that combine deeply nested membership and
  date-derived filters with grouped aggregation and column projection.
