name: western-orchard
title: "Orchard Estate Register — A Curated Entry Point Over An Anchored Multi-Table Binding, Its Layout Element And Two Featured Projection Endpoints"
description: |
  A fruit-orchard estate model whose four domain classes are each anchored to their own main
  table with an explicit identity column set, and whose three associations are resolved through
  declared joins so a projection can reach the planted variety and the rostered picking crew
  from a harvest lot. A layout element positions the classes and their relationship views, and a
  curated entry point binds the mapping, the warehouse runtime, that layout and two featured
  single-execution projection endpoints into one consumable unit with support metadata.
