name: verdant-fossil
title: "Quarry Dig Register — Data Space over a Multi-Table Relational Model"
description: |
  A palaeontology quarry register whose seven domain classes are each anchored on
  their own main table alias and primary key over one relational store, with
  column values reached through five named equality joins including a two-hop path
  from a find to its site. Six single-execution services project labelled column
  lists over the model, one of them walking the site-to-trench association, and a
  data space groups the mapping, runtime and two featured endpoints behind an
  email support contact.
