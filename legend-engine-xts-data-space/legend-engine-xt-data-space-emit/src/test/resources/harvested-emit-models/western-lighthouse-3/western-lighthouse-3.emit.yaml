name: western-lighthouse-3
title: "Harbour Navigation Lights — Processing-Temporal Store, Association Implementations, Diagrams and a Data Space"
description: |
  A harbour navigation-light maintenance model whose processing-temporal light class
  is mapped over a multi-table relational store with a main-table alias, an explicit
  primary key and two association implementations resolved through inner joins.
  Two single-execution services project the join-reached station and lamp detail of a
  processing slice under date-arithmetic filters, and a data space binds the mappings,
  runtimes, diagrams and services into one curated entry point.
