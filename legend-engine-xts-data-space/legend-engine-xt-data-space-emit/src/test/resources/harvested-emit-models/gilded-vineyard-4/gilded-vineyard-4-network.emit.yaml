name: gilded-vineyard-4-network
title: "Gilded Vineyard - processing-temporal estate store, included mapping set and shared derivations"
description: |
  The model half of a vineyard estate corpus: three processing-temporal classes -
  vine block, harvest pass and trellis section - related by two multiplicity-
  qualified associations, over a three-table relational store where every table
  carries its own primary key and its own processing-window block. The mapping set
  is assembled from two elements: a core mapping binding the section and block
  aliases, and an including mapping that adds the harvest pass, both association
  implementations and the mapping test suites, so compile-time resolution spans
  the include boundary. It also owns the warehouse connection, an estate runtime
  and an archive runtime, and the two shared derivations - a published block label
  and a sugar-reading floor - that the service artefacts delegate to.
modelSources:
