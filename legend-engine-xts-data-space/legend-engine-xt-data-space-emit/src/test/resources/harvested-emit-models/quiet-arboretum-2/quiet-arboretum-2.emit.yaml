name: quiet-arboretum-2
title: "Quiet Arboretum 2 — Processing-Milestoned Accession Register Behind A Governed Discovery Surface"
description: |
  A plant-collection accession register whose single mapped class is
  processing-temporal, so every surfaced instance is qualified by the window in
  which it was recorded and the window predicate is injected by the plan rather
  than written into the query body. One property mapping binds a constant
  instead of a column, so the surfaced register always carries an origin label.
  A profile supplies the stereotypes and tags the collection classes annotate
  themselves with, a data space packages the mapping-and-runtime pair consumers
  select instead of naming them directly, and two point-in-time services project
  and truncate the register - one at a fixed instant, one at a requested instant.
  Fixtures carry a superseded row that falls outside the requested window.
