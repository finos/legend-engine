name: western-cavern
title: "Cave Survey Register — Batch-Keyed Extents, Navigable Associations and an Eight-Armed Conditional Grade Band"
description: |
  A speleological survey register held in one relational store of six sibling
  tables, each keyed on a domain identifier plus a batch boundary so the same
  identifier recurs across batches. Six class mappings pin their main table
  alias explicitly and declare that composite key themselves rather than
  relying on the table key; five named equality joins are declared once in the
  store and reused by five association mappings, so every association end is a
  single join hop and traversal generates the join in either direction. The
  mapping layer exercises direct columns, a join-reached column on two extents,
  a literal-defaulted register name and an eight-armed conditional grade band
  guarded by a null sentinel, so a null grade returns SQL null rather than the
  final fallback. Five single-execution services read the register: one narrows
  the extent on a three-way conjunction including a negation and then narrows
  the tabular result again on a parameter, one projects and then filters on a
  four-way conjunction before sorting, two aggregate per station, and one
  projects the graded legs above a length floor. A data space packages the
  mapping and runtime pair as the default execution context.
