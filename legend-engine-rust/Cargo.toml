[workspace]
resolver = "2"
members = [
    "crates/ast",
    "crates/ast-derive",
    "crates/lexer",
    "crates/parser",
    "crates/protocol",
    "crates/api",
    "crates/dsl-authentication",
    "crates/dsl-connection",
    "crates/dsl-data",
    "crates/dsl-data-space",
    "crates/dsl-dataquality",
    "crates/dsl-deephaven",
    "crates/dsl-elasticsearch",
    "crates/dsl-external-format",
    "crates/dsl-graph",
    "crates/dsl-mapping",
    "crates/dsl-mongodb",
    "crates/dsl-persistence",
    "crates/dsl-persistence-cloud",
    "crates/dsl-persistence-relational",
    "crates/dsl-relational",
    "crates/dsl-relational-snowflake",
    "crates/dsl-runtime",
    "crates/dsl-service",
    "crates/dsl-service-store",
    "crates/dsl-store",
    "crates/dsl-sql",
    "crates/dsl-tds",
    "crates/jni",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/finos/legend-engine"

[workspace.dependencies]
# Core
smol_str = "0.3"
thiserror = "2"
legend-pure-parser-ast-derive = { path = "crates/ast-derive" }

# Tracing
tracing = "0.1"

# Parallelism (multi-file parsing)
rayon = "1"

# Serialization (protocol + island protocol modules)
serde = { version = "1", features = ["derive"] }
# `arbitrary_precision`: numbers keep their text (decimals their scale, as the
# engine's `BigDecimal`) through `serde_json::Value`.
serde_json = { version = "1", features = ["arbitrary_precision"] }

# Plugins (island / section parser registration)
linkme = "0.3"

# JNI bridge
jni = "0.21"

# Testing
insta = { version = "1", features = ["json"] }

# Proc-macro (ast-derive)
syn = "2"
quote = "1"
proc-macro2 = "1"

[profile.dev]
# macOS: keep .dSYM out of the linker hot path (cuts incremental link time).
split-debuginfo = "unpacked"
# Line-table-only debug info — backtraces still work, ~50% smaller artifacts.
debug = "line-tables-only"

[profile.test]
inherits = "dev"

# Heavy frontend deps that every crate transitively waits on. Compiling
# them unoptimized stretches the proc-macro expansion and serialization
# critical path; opt-3 once, reuse everywhere.
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.serde_derive]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.dev.package.quote]
opt-level = 3
