[package]
name = "legend-pure-parser-api"
description = "Engine-facing API: parse a Legend grammar section into Protocol v1 JSON"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
legend-pure-parser-ast = { workspace = true }
legend-pure-parser-parser = { workspace = true }
legend-pure-parser-protocol = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The island grammars register themselves when linked; api tests link them
# the way a production aggregator (the JNI cdylib) does.
legend-pure-dsl-connection = { path = "../dsl-connection" }
legend-pure-dsl-data = { path = "../dsl-data" }
legend-pure-dsl-graph = { path = "../dsl-graph" }
legend-pure-dsl-mapping = { path = "../dsl-mapping" }
legend-pure-dsl-store = { path = "../dsl-store" }
legend-pure-dsl-runtime = { path = "../dsl-runtime" }
legend-pure-dsl-sql = { path = "../dsl-sql" }
legend-pure-dsl-tds = { path = "../dsl-tds" }
