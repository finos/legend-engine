[package]
name = "legend-pure-parser-jni"
description = "JNI bridge: Java NativeGrammarParser -> Rust grammar parser -> Protocol v1 JSON"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The engine's jar carries this library (legend-engine-language-pure-grammar-rust); it is not a crate to depend on.
publish = false

[lib]
# Loaded by org.finos.legend.pure.rust.parser.NativeGrammarParser as
# `legend_pure_rust_parser`. The rlib lets a downstream aggregator cdylib
# (e.g. Legend Engine's, with its own grammar crates) re-export the same
# JNI symbols.
name = "legend_pure_rust_parser"
crate-type = ["rlib", "cdylib"]

[dependencies]
legend-pure-parser-api = { workspace = true }
# Grammar plug-ins linked into this library (they self-register).
legend-pure-dsl-connection = { workspace = true }
legend-pure-dsl-data = { workspace = true }
legend-pure-dsl-graph = { workspace = true }
legend-pure-dsl-mapping = { workspace = true }
legend-pure-dsl-store = { workspace = true }
legend-pure-dsl-runtime = { workspace = true }
legend-pure-dsl-sql = { workspace = true }
legend-pure-dsl-tds = { workspace = true }
jni = { workspace = true }
