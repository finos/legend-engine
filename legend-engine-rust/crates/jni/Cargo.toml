[package]
name = "legend-pure-parser-jni"
description = "JNI bridge: Java NativeGrammarParser -> Rust grammar parser -> Protocol v1 JSON"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Loaded by org.finos.legend.pure.rust.parser.NativeGrammarParser as
# `legend_pure_rust_parser`. The rlib lets a downstream aggregator cdylib
# (e.g. Legend Engine's, with its own grammar crates) re-export the same
# JNI symbols.
name = "legend_pure_rust_parser"
crate-type = ["rlib", "cdylib"]

[dependencies]
legend-pure-parser-api = { path = "../api" }
# Grammar plug-ins linked into this library (they self-register).
legend-pure-dsl-authentication = { path = "../dsl-authentication" }
legend-pure-dsl-connection = { path = "../dsl-connection" }
legend-pure-dsl-data = { path = "../dsl-data" }
legend-pure-dsl-data-space = { path = "../dsl-data-space" }
legend-pure-dsl-dataquality = { path = "../dsl-dataquality" }
legend-pure-dsl-deephaven = { path = "../dsl-deephaven" }
legend-pure-dsl-elasticsearch = { path = "../dsl-elasticsearch" }
legend-pure-dsl-graph = { path = "../dsl-graph" }
legend-pure-dsl-mapping = { path = "../dsl-mapping" }
legend-pure-dsl-mongodb = { path = "../dsl-mongodb" }
legend-pure-dsl-persistence = { path = "../dsl-persistence" }
legend-pure-dsl-persistence-cloud = { path = "../dsl-persistence-cloud" }
legend-pure-dsl-persistence-relational = { path = "../dsl-persistence-relational" }
legend-pure-dsl-store = { path = "../dsl-store" }
legend-pure-dsl-relational = { path = "../dsl-relational" }
legend-pure-dsl-relational-snowflake = { path = "../dsl-relational-snowflake" }
legend-pure-dsl-runtime = { path = "../dsl-runtime" }
legend-pure-dsl-service = { path = "../dsl-service" }
legend-pure-dsl-service-store = { path = "../dsl-service-store" }
legend-pure-dsl-sql = { path = "../dsl-sql" }
legend-pure-dsl-tds = { path = "../dsl-tds" }
jni = { workspace = true }
