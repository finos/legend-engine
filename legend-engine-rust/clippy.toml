# Protocol JSON is built from typed `#[derive(Serialize)]` structs, never
# with `serde_json::json!` (CLAUDE.md, "Protocol JSON"; docs/protocol-json.md).
# `cargo lint-lib` denies the macro in library code; tests keep it for the
# JSON they expect.
disallowed-macros = [
    { path = "serde_json::json", reason = "build protocol JSON from a typed #[derive(Serialize)] struct (docs/protocol-json.md)" },
]
