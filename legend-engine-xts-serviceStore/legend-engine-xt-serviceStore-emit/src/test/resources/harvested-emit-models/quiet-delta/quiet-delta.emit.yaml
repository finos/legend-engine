name: quiet-delta
title: "Quiet Delta — Kelp-Forest Reef Survey with Join-Reached Zones and a Remote Tide Feed"
description: |
  A kelp-forest monitoring corpus whose relational store holds reefs, transect
  swims and holdfast quadrats joined by two inner-join shapes, so a quadrat
  reaches its coastal zone over a two-hop join path while a transect reaches
  its reef label over a single hop. Three single-execution services filter and
  project the swims: one computes a rolling window bound by date arithmetic on
  whole weeks, one rolls two requested zones into one collection filter, and
  one reports the day distance between each swim and the requested day. A
  Snowflake warehouse connection, a local H2 connection and an engine runtime
  bind the same mapping, and a remote tide-bulletin service store returns its
  payload through a JSON external-format binding.
modelSources:
