name: frosted-quokka
title: Frosted Quokka - Remote Sighting API with Parameterised Request Binding
description: >
  A remote reserve-tracking API is declared as a service store with one parameterless
  read and one whose path template carries four typed path parameters, both decoding
  their response into a wide optional-property class through a JSON binding. Two
  service-store class mappings bind the same class to the two operations, the
  parameterised one building its request from expressions over the mapped class's own
  properties. A zone-keyed multi-execution service filters the extent on four equalities,
  coerces to a single instance and serialises a three-property graph-fetch tree. A deployment-owned feed service refines the same documents into nested field cards through a model-to-model mapping, its two suites replaying JSON source documents of different shapes against JSON expectations.
