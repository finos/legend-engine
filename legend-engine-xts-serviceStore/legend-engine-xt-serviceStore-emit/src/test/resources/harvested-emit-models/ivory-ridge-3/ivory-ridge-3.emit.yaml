name: ivory-ridge-3
title: "Delimited buoy-telemetry sheets bound by a flat-data schema set and republished as engine-shaped drift profiles"
description: |
  A moored-buoy telemetry model whose only source is a remote service store. Its drift
  sheet endpoint returns a delimited document typed by a standalone flat-data schema
  set that a binding pins by schema id, so the wire rows are deserialised out of a
  headed CSV body rather than a JSON tree. A fetch mapping supplies the dataset and
  window request constants itself and holds the wire rows, and a model-to-model layer
  chained onto it republishes them as drift profiles: the station prefix folded out of
  the upper-cased station code, the keeper label upper-cased, the metres adrift rated
  per hour at the published precision, and the swell measured through a five-arm band.
  Five single-execution services sit over that model — the primary and standby arrays
  over the same fetch tree, a narrow band index and a rate board, and a station roll
  that leaves the remote side entirely to project the tended moorings of a shore-side
  registry database as a tabular result. The primary feed carries a test suite whose
  stub endpoint answers with a delimited body, so the flat-data path is executed rather
  than merely compiled. The transform layer additionally carries its own mapping test
  over seeded wire rows covering the calm, slight and rough band arms.
