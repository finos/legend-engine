      - test/verdantridge/mapping/ShelfSummaryMapping.pure
      - test/verdantridge/runtime/CatalogueRuntimes.pure
      - test/verdantridge/service/HoldingLookupRidgeService.pure
      - test/verdantridge/service/HoldingLookupService.pure
      - test/verdantridge/store/HoldingsApi.pure
