name: hazel-cove
title: "Hazel Cove - Remote Colony Census (service store, external-format bindings, keyed multi-execution)"
description: |
  A seabird-colony census sourced from two remote endpoints of one service store, one
  publishing JSON records and one a delimited roster sheet typed by a flat-data schema
  set and binding. Model-to-model set implementations republish the wire payloads as
  governed profiles through an eight-arm density conditional that falls through to no
  value at all when a tally is absent, and a rounding transform at the published
  precision. Both published classes are served by keyed multi-execution services whose
  environments differ only in the service-store connection, with the roster endpoint's
  request constants supplied by the mapping itself.

modelSources:
