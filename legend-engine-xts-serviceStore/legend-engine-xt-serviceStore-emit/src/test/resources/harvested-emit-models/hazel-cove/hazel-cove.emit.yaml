      - test/hazelcove/external/CensusSchemas.pure
      - test/hazelcove/mapping/CensusApiMapping.pure
      - test/hazelcove/mapping/CensusRosterMapping.pure
      - test/hazelcove/runtime/CensusRuntimes.pure
      - test/hazelcove/service/ColonyProfileFeed.pure
      - test/hazelcove/service/ColonyRosterFeed.pure
      - test/hazelcove/store/CensusApi.pure

