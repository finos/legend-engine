name: frosted-glacier
title: "Frosted Glacier — Remote Cryosphere Feed (service store, external-format binding, conditional model-to-model transforms)"
description: |
  A tall glacier-monitoring taxonomy with profiles, enumerations and a three-level
  inheritance chain, sourced from a service-store endpoint whose complex response is
  typed by an external-format binding over a model unit. Three model-to-model set
  implementations build the domain instances from the deserialised feed, one of them
  through a nine-arm conditional that classifies the balance regime and falls through
  to no value at all when neither a code nor a remark is supplied. A single relational
  set implementation routes a stored morphology code through an enumeration mapping so
  the project keeps one store-backed execution path alongside the in-memory one.

