name: ivory-vineyard-2
title: "Ivory Vineyard 2 - bitemporal parcel grading, polymorphic press rollups and a bound endpoint surface behind three services"
description: |
  A vineyard pressing model over one multi-table relational store and one
  request-response endpoint store. The parcel extent is business-temporal while the
  grade awarded to a parcel is bitemporal, so a survey service resolves the grade
  and its tasting panel through a milestoned qualified property at a processing date
  and a business date, narrows the result on a projected column, de-duplicates it
  and drops the parcel whose planting window closed before the requested date. The
  press-run extent is polymorphic: an inheritance operation routes the basket and
  bladder sets, a rollup service groups pressed litres and run counts per region
  behind a membership test and a caller-supplied floor, and a register service casts
  the extent down to the basket subtype to project a subtype-only label. Harvest lots
  are a union of two region-filtered sets that stamp their own prefixes. Two external
  format bindings carry press and panel documents for every operation of the endpoint
  store, and a model-to-model mapping refines those documents into digests that total
  pressed litres, order deduplicated batch codes and band the measured sugar readings.
