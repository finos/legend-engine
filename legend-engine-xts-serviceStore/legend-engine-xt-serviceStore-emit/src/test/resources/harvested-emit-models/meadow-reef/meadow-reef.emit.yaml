name: meadow-reef
title: "Meadow Reef - A Cross-Store Snorkel-Trail Register With Endpoint-Backed Documents And A Unioned Listing"
description: |
  A snorkel-trail sighting register whose stored species side is a multi-table relational store read
  through equality joins, folding the recorded standing of each alternate name out of a join-reached
  reference row and carrying the register label over the same hop. Submitted sighting documents are
  unpacked in memory by a model-to-model layer that splits packed tags, folds an absent observer into
  a placeholder label and holds the unpacked zone as a mapping-local property, and a cross-store
  association binds those unpacked sightings to the stored species. A second, endpoint-backed pair of
  stores serves species and register documents over typed query parameters and document contracts,
  with the live and archived listings unioned behind one operation-mapped root so the graph-fetch
  services can isolate the stored, cross-store and endpoint-backed reads separately.
