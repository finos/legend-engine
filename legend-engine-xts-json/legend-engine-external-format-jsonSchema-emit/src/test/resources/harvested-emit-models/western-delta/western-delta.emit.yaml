name: western-delta
title: "Western Delta - milestoned lineage reporting with fallback reasons and a keyed export"
description: |
  A delta bird-ringing exception register whose records and their whole observer-to-region
  lineage are business-temporal, so one business-date parameter pins five independent
  milestoning resolutions in a single expression. The register endpoint resolves the reported
  reason through a three-way fallback over an optional sub-reason, truncates instants to their
  date component and appends a right-nested audit column; a governance endpoint aggregates the
  same extent over a seven-key lineage with typed and untyped views of the sighting link; and an
  environment-keyed export serialises the fetched links through an external-format binding.
