name: solar-cove-3
title: "Bike-Share Dock Roster — Store-less Multi-Execution Services over an External JSON Binding"
description: |
  A store-less bike-share dock roster rebuilt in memory from an inbound
  street-cabinet reading through a model-to-model mapping over a JSON model
  connection. Two single-execution services — one filtering the roster by a
  parameterised status membership set, one returning it whole — are fed by
  shared JSON data elements and asserted against expected payloads, while two
  multi-execution services keyed by deployment tier and operator region prove
  the multi-execution feature through plan generation. A JSON external-format
  binding over the station cards and a tabular projection function exercise the
  external-format, collection, filter and project capabilities off a second
  in-memory graph.
