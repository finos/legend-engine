name: noble-warren-2-m2m
title: "Noble Warren 2 — Checked and Plain Graph Fetch Over One Store-less Card Transform"
description: |
  A store-less warren survey model in which a single model-to-model transform
  derives a printed card name by concatenation and pins a second card property
  to a constant. Two single-execution services share that transform, contrasting
  a plain graph fetch served through a referenced runtime with a defect-checking
  graph fetch served through a runtime embedded in the execution, and delimited
  text bindings describe the physical shape of the two source classes.
modelSources:
  model:
    root: noble-warren-2-m2m
    files:
      - test/noblewarren2/connection/WarrenConnections.pure
      - test/noblewarren2/doc/WarrenNotes.pure
      - test/noblewarren2/domain/SurveyorCard.pure
      - test/noblewarren2/external/WarrenBindings.pure
      - test/noblewarren2/mapping/SurveyorCardM2M.pure
      - test/noblewarren2/runtime/WarrenRuntimes.pure
