name: dusky-cove
title: "Dusky Cove — Layered Dune Planting Register With Deep Conditional, Enumerated And Multi-Hop Relational Transforms"
description: |
  A coastal dune restoration planting register whose single cross-schema store carries the planted
  and retired plot tables, a processing-milestoned plot survey table, the transect, sector and
  reserve hierarchy tables, three grouped or derived views and two named filters. Three chained
  mappings compile in order: a shared enumeration layer over four site vocabularies; a base layer
  that resolves the plot vigour label through eight case arms and an unrecorded fallback, folds
  missing names, notes and approaches onto sentinels or SQL nulls, translates two enumerations from
  computed source expressions, and binds view-backed properties one, two and four join hops out
  with the one-hop tally narrowed to an inner join; and a register layer that resolves the
  milestoned survey extent at a fixed instant five hops out and projects the retired plot extent
  of the same store through its own conditional arms. Above the mappings sit an eight-step
  conditional banding function, a day-count survey-age helper and a headline composer used by a
  qualified property, two JSON bindings over the published classes, a local H2 and a Snowflake
  OAuth connection, and two runtimes over the register mapping.
