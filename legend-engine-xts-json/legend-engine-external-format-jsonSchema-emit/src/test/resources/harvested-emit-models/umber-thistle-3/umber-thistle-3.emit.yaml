name: umber-thistle-3
title: "Kiln Booking Windows and Studio Rosters"
description: |
  A non-financial pottery studio model that maps kiln bookings and member
  details from one relational table. The model exposes filtered booking feeds,
  a bounded studio roster, a JSON binding, and a cross-store association
  between bookings and their member records.
modelSources:
  model:
    root: umber-thistle-3
