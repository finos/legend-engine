name: kindly-quarry
title: "Kindly Quarry - transit stop access register with an eight-arm banding conditional, a unioned corridor register and ranked patronage relations"
description: |
  A surface transit-network corpus whose cross-schema store carries boarding points and the operating
  corridor register in one schema and the planning register and counted boardings in another. An
  included base mapping resolves each counted boarding to its corridor across a two-hop path, while the
  main mapping bands every boarding point through an eight-arm conditional with a null fallback, tags
  two unioned corridor set implementations through string-function transforms, and is published by
  relation-grammar services that filter, roll up, rank with a window function and cap their results.
