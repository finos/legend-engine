name: cedar-prairie-4
title: "Cedar Prairie 4 - a prairie restoration register whose surveys carry their crew paperwork as a bound JSON document"
description: |
  A prairie restoration programme. Restoration plots are held in one landed
  table that nests inside itself: a plot may sit inside a wider parent plot, and
  the store declares a self-referential inner join over the parent key so the
  parent name is reached by traversal rather than duplication. The standing of a
  plot is a closed enumeration bound to its landed code through an enumeration
  mapping, and every mapped class is bound with a primary key over an explicitly
  aliased main table. Each walked survey carries its crew paperwork as a single
  nested JSON document column, and the mapping interprets that one column
  through a JSON binding so the reference, the crew name and the crew lead
  resolve as ordinary properties. Three services publish the register: the
  nested plots of either named region under a disjunctive predicate, a coverage
  rollup that groups the surveys by plot and averages the walked coverage, and a
  flat projection of the crew paperwork out of the bound document. All three
  services and the mapping carry test suites over seeded relational fixtures.
