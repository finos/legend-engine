name: quiet-delta-3
title: "Quiet Delta 3 — Orchid Greenhouse Bloom Log With JSON Bindings and a Three-Hop Site Join"
description: |
  An orchid greenhouse that logs blooms per bench and reaches each grow site's
  opening time over bench, glasshouse and site joins. The bloom mapping includes a
  shared mapping that carries the vigour enumeration mapping and the grow site
  class mapping, normalises stage codes with a string replace and decodes them
  through a six-arm nested conditional with a null fallback, and flags notes
  through a null test over a replaced string. Flat tally and exception classes are
  serialised through JSON bindings alongside the bloom and site classes. One cloud
  warehouse connection remaps the schema over OAuth and one mainframe connection
  uses a static datasource with delegated Kerberos; each runtime binds the mapping
  to one of them per environment. Mapping tests pin every stage arm, the null
  fallback, the three-hop join hit and the unplaced-bench miss.
