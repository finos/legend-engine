name: copper-willow-6
title: "Copper Willow 6 — Trail Stewardship Directives Across Snowflake and MemSQL Connections"
description: |
  Trail stewardship directives, volunteers, walking clubs, trail days and
  erosion measures published over three layered relational stores:

    * `StewardshipCoreDB` — directive and participant schemas; the lead
      volunteer join conjoins the key equality with the open-batch sentinel.
    * `StewardshipEventDB` — includes the core store and adds trail days and
      measures; its directive join also only reaches open-batch directives.
    * `StewardshipArchiveDB` — includes the event store and adds a closed
      directive history.

  Three relational mappings layer by mapping include. The steward label is a
  depth-five nested dyna-function transform (trim, substring, upper-case and
  two concatenations) and two properties are reached over one-hop joins.
  Four Snowflake connections authenticate with OAuth over a shared scope and
  rename schemas and tables through mapper post-processors; two MemSQL
  connections over the directive store use a static datasource with
  delegated Kerberos. Six engine runtimes each bind one mapping and store to
  one connection, and two JSON bindings include the directive and roster
  classes. Mapping tests assert the label, the open-batch join filtering and
  the cross-store include.
