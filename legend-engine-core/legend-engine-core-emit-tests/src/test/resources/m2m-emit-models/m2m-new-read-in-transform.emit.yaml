name: m2m-new-read-in-transform
title: "M2M reads a property of an instance constructed in the same transform"
description: |
  The transform constructs Box(ft=primary) and reads ft.id in the same
  expression. aDecoy has the same class as primary but a different id, so
  the service must return the id of primary.
