name: cobalt-arboretum
title: "Municipal Park Inventory — Wide Enumeration Vocabulary over a Mixed-Milestoning Type Graph"
description: |
  A municipal park-inventory domain whose interest is the combination of a
  wide closed-vocabulary layer with three coexisting milestoning strategies in
  one association graph. Fourteen enumerations type properties on milestoned
  classes rather than appearing only as query literals, an abstract inventory
  supertype is specialised by six fixture kinds, and the value-identity
  stereotype marks a property subset on every class so equality is decided by
  that subset. Navigation crosses a bi-temporal revision head into
  processing-temporal measures and history rows, so each hop must be supplied
  the right subset of temporal arguments.

modelSources:
