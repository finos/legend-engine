name: umber-beacon-5
title: "Urban Canopy Registry — Milestoned Association across a Mixed-Temporality Registry Hierarchy"
description: |
  A store-less urban tree-canopy registry whose interest is the interaction
  between milestoning and an inheritance hierarchy. An abstract registry entry
  carries the shared identity shape and a local profile's stereotype and tagged
  values, so the annotations stay visible through the subtype that extends it.
  Two of the four classes are business-temporal, and the single association
  connects exactly those two, making the association itself milestoned: a
  business date has to be agreed across both ends before either end resolves.
  A plain property from the versioned specimen to the unversioned plot lets one
  traversal cross from a milestoned grain into an unmilestoned one, and two
  enumerations type both mandatory and optional properties on either side of
  the temporal boundary.

modelSources:
