name: meadow-cove-2
title: "Kelp Survey Flattening — Enveloped Payload to Flat Record with a Validity Sentinel"
description: |
  A store-less model-to-model unit that flattens an enveloped kelp-survey payload
  onto a single-level record. Two parallel inheritance hierarchies supply the
  transport envelope and the registration/observation payload, so every payload
  binding is a two-hop read through the envelope content and inherited attributes
  are reached at the same depth as declared ones. An equality-key stereotype
  declares record identity on two of the flat target's properties, an absent
  validity bound is replaced by a far-future date-time sentinel, and optional
  measurements fall back to literal defaults so the flat record can take part in
  temporal comparisons without null handling.
