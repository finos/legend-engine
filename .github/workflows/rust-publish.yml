name: Publish Rust crates

# Publishes legend-engine-rust's crates to crates.io, apart from the engine's release: the crates keep their own
# version, set in a pull request before this runs (legend-engine-rust/docs/publishing.md).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to publish. Leave empty for the default branch."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Package and build every crate without uploading"
        required: false
        default: true
        type: boolean

concurrency:
  group: rust-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.repository == 'finos/legend-engine'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legend-engine-rust

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Publish (dry run)
        if: inputs.dry_run
        run: cargo publish --workspace --locked --dry-run

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
