name: Release (Large Runner)

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  DOCKER_USERNAME: finos
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  MAVEN_OPTS: -Xmx36g
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "New release version"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest-16-cores
    steps:
      # Fail fast on a duplicate version: Central is immutable, and without
      # this the collision only surfaces at the final upload step.
      - name: Check release version is unused
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
          TAG: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '$RELEASE_VERSION' is not of the form MAJOR.MINOR.PATCH"
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/$TAG" ; then
            echo "::error::Tag $TAG already exists -- version $RELEASE_VERSION has already been released (or a failed release was not cleaned up)"
            exit 1
          fi
          url="https://repo1.maven.org/maven2/org/finos/legend/engine/legend-engine/${RELEASE_VERSION}/legend-engine-${RELEASE_VERSION}.pom"
          http_status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          if [ "$http_status" = "200" ]; then
            echo "::error::Version $RELEASE_VERSION is already published on Maven Central: $url"
            exit 1
          elif [ "$http_status" != "404" ]; then
            echo "::warning::Unexpected HTTP $http_status from Maven Central while checking $url -- continuing"
          fi

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Set up Maven Central
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Compute next development version
        run: |
          releaseVersion=${{ github.event.inputs.releaseVersion }}
          n=${releaseVersion//[!0-9]/ }
          a=(${n//\./ })
          nextPatch=$((${a[2]} + 1))
          developmentVersion="${a[0]}.${a[1]}.${nextPatch}-SNAPSHOT"
          echo "DEVELOPMENT_VERSION=${developmentVersion}" >> $GITHUB_ENV

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      - name: Prepare release
        run: mvn -B -e release:prepare -Darguments='-B -e' -DpreparationGoals=clean -DreleaseVersion=${{ github.event.inputs.releaseVersion }} -DdevelopmentVersion=${{ env.DEVELOPMENT_VERSION }} -P release

      - name: Perform release
        run: mvn -B -e release:perform -Darguments='-B -e -T 4 -Dorg.slf4j.simpleLogger.showThreadName=true -DargLine="-Xmx6g"' -P release,docker,pct-cloud-test
