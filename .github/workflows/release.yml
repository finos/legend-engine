name: Release

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  CI_GPG_PASSPHRASE: ${{ secrets.CI_GPG_PASSPHRASE }}
  DOCKER_USERNAME: finos
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "New release version"
        required: true
      dryRun:
        description: "Upload and validate bundles, then drop them without publishing to Central"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Prepare Release Artifacts
    runs-on: ubuntu-latest-16-cores
    outputs:
      testMatrix: ${{ steps.testMatrix.outputs.testMatrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Set up Maven Central
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 17
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
          gpg-private-key: ${{ secrets.CI_GPG_PRIVATE_KEY }}
          gpg-passphrase: CI_GPG_PASSPHRASE

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      - name: Compute next development version
        run: |
          releaseVersion=${{ github.event.inputs.releaseVersion }}
          n=${releaseVersion//[!0-9]/ }
          a=(${n//\./ })
          nextPatch=$((${a[2]} + 1))
          developmentVersion="${a[0]}.${a[1]}.${nextPatch}-SNAPSHOT"
          echo "DEVELOPMENT_VERSION=${developmentVersion}" >> $GITHUB_ENV

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          # Keep the restore-keys list narrow on purpose.
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Download deps and plugins
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies

      - name: Prepare release
        run: mvn -B -e release:prepare -Darguments='-B -e' -DpreparationGoals=clean -DreleaseVersion=${{ github.event.inputs.releaseVersion }} -DdevelopmentVersion=${{ env.DEVELOPMENT_VERSION }} -P release

      - name: Checkout Release Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Purge stale legend-engine artifacts from local Maven repo
        run: rm -rf ~/.m2/repository/org/finos/legend/engine

      - name: Build Release Tag
        run: mvn -B -e -T3 -DskipTests -Dorg.slf4j.simpleLogger.showThreadName=true install -P release,docker,pct-cloud-test
        env:
          MAVEN_OPTS: -Xmx36g

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          # Upload per-module target/ directories produced by the release-tag
          # build. Test jobs re-checkout the release tag from git.
          path: |
            ~/**/target/
            !~/**/target/*.jar
          retention-days: 1
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload m2 repository
        uses: actions/upload-artifact@v7
        with:
          name: m2-repo
          path: ~/.m2/repository/org/finos/legend/engine/
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Purge engine artifacts before cache save
        # actions/cache's post-job save snapshots ~/.m2/repository at the
        # end of the job. We don't want the just-built engine jars in that
        # snapshot.
        if: always()
        run: rm -rf ~/.m2/repository/org/finos/legend/engine

      - name: Set Test Matrix
        id: testMatrix
        run: echo "testMatrix=$(jq -c . < .github/workflows/resources/modulesToTest.json)" >> $GITHUB_OUTPUT

      - name: Upload CI Event
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
          fetch-depth: 1
          persist-credentials: false

      - name: Before Test
        uses: ./.github/workflows/actions/before-test

      - name: Excluded Modules
        id: modulesToExclude
        run: echo EXCLUSION_MODULES=`jq -c '.include | map(.modules) | flatten | map("!org.finos.legend.engine:" + .) | join(",")' ./.github/workflows/resources/modulesToTest.json` >> $GITHUB_OUTPUT

      - name: Test
        env:
          MAVEN_OPTS: "-Xmx1g"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JDK_JAVA_OPTIONS: "--add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED"
        run: |
          mvn -B -e surefire:test -pl ${{ steps.modulesToExclude.outputs.EXCLUSION_MODULES }} -P release,docker,pct-cloud-test -T2 -DargLine="-Xmx6g" -Dsurefire.reports.directory=${GITHUB_WORKSPACE}/surefire-reports-aggregate

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ github.workspace }}/surefire-reports-aggregate/*.xml

  test-modules:
    name: Test Module - ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs:
      - build

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.build.outputs.testMatrix)}}

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
          fetch-depth: 1
          persist-credentials: false

      - name: Before Test
        uses: ./.github/workflows/actions/before-test

      - name: Included Modules
        id: modulesToInclude
        env:
          MODULES: ${{ toJSON(matrix.modules) }}
        run: |
          echo INCLUSION_MODULES=`jq -c 'map("org.finos.legend.engine:" + .) | join(",")' <<< $MODULES` >> $GITHUB_OUTPUT

      - name: Test
        env:
          MAVEN_OPTS: "-Xmx1g"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          JDK_JAVA_OPTIONS: "--add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED"
        run: |
          mvn -B -e surefire:test -pl ${{ steps.modulesToInclude.outputs.INCLUSION_MODULES }} -P release,docker,pct-cloud-test -T2 -DargLine="-Xmx6g" -Dsurefire.reports.directory=${GITHUB_WORKSPACE}/surefire-reports-aggregate

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ github.workspace }}/surefire-reports-aggregate/*.xml

  release:
    name: Create and Publish Release Bundle
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - test-modules
    steps:

      - name: Checkout Release Tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.name }}-${{ github.event.inputs.releaseVersion }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download m2 repository for publishing
        uses: actions/download-artifact@v8
        with:
          name: m2-repo
          path: ~/.m2/repository/org/finos/legend/engine

      # The full artifact set is over 1.7GB, well past the Portal's 1GiB
      # per-bundle cap, which nginx rejects with a bare "413 Payload Too Large"
      # before the API sees it. Split it, never separating a jar from its pom,
      # signature and checksums.
      - name: Stage and split bundles
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          .github/scripts/stage-and-split.sh \
            ~/.m2/repository/org/finos/legend/engine "$RELEASE_VERSION" "$PWD"
          cat central-publishing/bundle-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundles to Central
        env:
          RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}
        run: |
          : > deployment-ids.txt
          : > bundle-deployments.tsv
          {
            echo
            echo "### Central deployments"
            echo
            echo "| Bundle | Upload size | Deployment ID |"
            echo "|---|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for bundle in central-publishing/central-bundle-*.zip; do
            suffix=$(basename "$bundle" .zip | sed 's/^central-bundle-//')
            bytes=$(stat -c%s "$bundle")
            echo "uploading $bundle ($bytes bytes)"
            id=$(.github/scripts/central-publish.sh upload "$bundle" \
                   "legend-engine-${RELEASE_VERSION}-central-bundle-${suffix}")
            echo "$id" >> deployment-ids.txt
            printf '%s\t%s\t%s\n' "$(basename "$bundle")" "$bytes" "$id" >> bundle-deployments.tsv
            echo "uploaded $bundle as deployment $id"
            printf '| %s | %s MB | `%s` |\n' \
              "$(basename "$bundle")" "$((bytes / 1000000))" "$id" >> "$GITHUB_STEP_SUMMARY"
          done

      # Kept even when the release fails: the sizes and the bundle-to-deployment
      # mapping are exactly what a post-mortem needs, and the runner is gone.
      - name: Upload bundle size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle-report
          path: |
            central-publishing/bundle-report.md
            central-publishing/*.tsv
            bundle-deployments.tsv
          retention-days: 30
          if-no-files-found: warn

      # Every bundle must validate before any of them is published. Publishing
      # bundle 1 and then discovering bundle 5 is invalid leaves a partial
      # release on Central, and Central is immutable.
      - name: Wait for all bundles to validate
        run: |
          while read -r id; do
            .github/scripts/central-publish.sh await "$id" VALIDATED < /dev/null
          done < deployment-ids.txt

      - name: Publish all bundles
        if: ${{ github.event.inputs.dryRun != 'true' }}
        run: |
          while read -r id; do
            .github/scripts/central-publish.sh publish "$id" < /dev/null
          done < deployment-ids.txt
          while read -r id; do
            .github/scripts/central-publish.sh await "$id" PUBLISHED < /dev/null
          done < deployment-ids.txt

      - name: Drop unpublished deployments
        if: ${{ always() && (failure() || cancelled() || github.event.inputs.dryRun == 'true') }}
        run: |
          [ -f deployment-ids.txt ] || exit 0
          while read -r id; do
            state=$(.github/scripts/central-publish.sh state "$id" < /dev/null)
            case "$state" in
              VALIDATED|PENDING|VALIDATING)
                .github/scripts/central-publish.sh drop "$id" < /dev/null
                ;;
              *)
                # FAILED deployments are left in place on purpose: Sonatype
                # support needs their files to diagnose the failure.
                echo "leaving deployment $id in state $state"
                ;;
            esac
          done < deployment-ids.txt
