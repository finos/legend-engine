name: silver-gecko-2
title: "Silver Gecko 2 — Vivarium Resident Register"
description: |
  A non-financial reptile-house register. One relational store holds fifteen
  relations for habitat zones, enclosures, substrates, heat lamps, species,
  shift teams, keepers, residents, feed logs, health checks, moult records,
  weight readings, feed stock and suppliers, connected by fourteen named
  equality joins. Two relational mappings anchor each class on a main relation
  under an alias, declare the identifying columns, bind a closed diet value set
  through an enumeration mapping, fix one register label by literal and build a
  display label with text concatenation. Four register classes inherit a shared
  dated-record supertype. Three JSON schema generations are ordered by one
  generation specification. Two services filter and project the mapped
  instances, with assertions covering the joined rows and the rows an inner
  join drops when its counterpart is absent.
