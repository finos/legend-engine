name: cedar-quarry-2
title: "Museum Ceramics Catalogue With Three Milestoning Flavours"
description: |
  A ceramics collection catalogue whose entry hierarchy carries constrained
  measurements, three enumerations, a governance profile and a display
  association, alongside three registers milestoned three different ways —
  business time for kiln firings, processing time for catalogue revisions and
  both for outward display placements. Two JSON schema generations, gathered in one
  generation specification, publish the catalogue and register shapes; the
  mapping suites hold each register at a date so the rows outside their windows
  drop out.
