name: meadow-ridge-2
title: "Meadow Ridgeway Waymark Posts — Joined Parent/Leaf Document Service with Schema Generation"
description: |
  A two-table relational store — one path table with two maximum-width character
  columns and one waymark-post table with two short bounded character columns —
  wired together by a single named inner join. Two classes sit on top: the leaf
  post carrying two mandatory text properties and a mandatory floating-point
  identifier that doubles as the mapped key column, and the parent path carrying
  two mandatory text properties plus a zero-or-more post collection resolved
  through the store join with an explicit target-set qualifier. Both class
  mappings pin an explicit store-qualified main-table alias and a single-column
  floating-point primary key. The runtime declares its H2 connection inline and
  self-seeds the two tables, so the legacy mapping test over the nested
  parent/leaf graph fetch and the service tests read the same fixture shape.
  One service exposes the leaf as a three-property graph-fetched and serialised
  document behind a floating-point path parameter, carries a platform
  specification-generation stereotype and tagged value, and keeps its filter as
  a redundant explicit conjunction around the identifier equality. A schema
  generation element scoped at the domain package emits a plain-YAML
  specification flavour with constraint-function schemas and a schema collection,
  and a generation specification wraps that single element.
