name: sable-canyon-4
title: "Sable Canyon — Tier-Keyed Trail Condition Board with Banded Washout Readings"
description: |
  A canyon trail-maintenance model whose stereotyped and tagged segment class is
  mapped onto a single relational table with an enumerated walking surface, and
  published through one multi-execution endpoint keyed by publication tier. The
  endpoint bands each segment by its washout reading through nested conditional
  arms — impassable, note-derived restricted, caution, clear — and yields no band
  at all when the reading is absent. A JSON-schema file generation sequenced by a
  generation specification emits the digest contract, and two local H2 runtimes
  stand in for the field and archive tiers.

