name: eastern-cove
title: "Coastal Cove Harbour — Bi-Temporal Moorings, Cross-Store Vessels and Keyed Berth Boards"
description: |
  A coastal ferry harbour whose mooring allocations are milestoned on both a
  processing and a business axis and read back at explicit instants, while berths
  and sailings are joined through an association and a qualified property that
  narrows a berth's sailings by passenger load. A document source is catalogued
  into vessel records by a model-to-model mapping, tied to the stored berths by a
  cross-store association, and published as nested documents; tabular endpoints
  add grouped totals, capped orderings and an environment-keyed pair of executions,
  with a diagram and a json-schema generation sequenced by a generation specification.
