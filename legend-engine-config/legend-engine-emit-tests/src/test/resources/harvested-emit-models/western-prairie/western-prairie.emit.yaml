name: western-prairie
title: "Prairie Trail Registry — Relational Service, Unitemporal Persistence and File Generation"
description: |
  A prairie-preserve trail corpus. A relational store joins trails to their
  conservation regions through a named inner join, and a relational mapping
  anchored on a primary-table alias with a declared primary key binds the trail
  and region classes. A single-execution service projects the joined trails as
  a tabular result and is asserted through a service testSuite over an
  in-process H2 connection. A batch persistence materializes that service output
  into a unitemporal relational target milestoned on processing batch id under a
  manual trigger, asserted across two snapshot batches. An Avro file-generation
  specification and a generation specification emit a data-lake schema artifact
  from the domain classes.
