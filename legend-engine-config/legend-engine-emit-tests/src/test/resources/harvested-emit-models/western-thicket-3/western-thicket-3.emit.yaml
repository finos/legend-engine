name: western-thicket-3
title: "Western Thicket 3 — a milestoned coppice cutting register ranked over a window and folded against grove tallies"
description: |
  A coppice wood held in one relational store split across a working schema, a reference schema and an
  audit schema, so the register reaches its stand book across one schema boundary and its checker note
  across another. The reference schema also carries a grouped view that tallies the stands of each grove,
  and the register reaches that tally three hops out through chained joins.
  The register relation is milestoned by a business window, so one read at a business date drops both the
  survey whose window closed two years earlier and the survey whose window opens the year after, while a
  second read at a date inside the closed window returns exactly that survey — the explicit date, not the
  extent, is doing the scoping.
  A conditional walks eight arms over the regrowth code, two of them narrowed by a numeric comparison, and
  falls through to a spare label the fixture leaves blank so the ninth outcome is empty. Three enumerations
  are mapped, one from a plain column and two from computed expressions, and a tier label is mapped as a
  literal rather than a column. A polymorphic warden is resolved through two filtered subtype sets extending
  one root set, so a query needing the rota of a grove warden narrows to the subtype while a survey walked
  by a contractor resolves the other set instead.
  Nine derived and qualified properties sit on the register, including a nine-arm band over the counted stems
  and the stool height and a day count over the open cutting cycle, and both are read back through the mapping
  tests. The row-shaped endpoints rank surveys inside each cut over a window and keep the two strongest, and
  fold the register by cut before placing each fold beside the grove tallies its surveys were cut under by
  joining it to a distinct projection of the same extent. The ranking endpoint is served by two keyed
  executions over two runtimes. A model-to-model mapping bands the raw tally sheet the wood writes down
  before anything is coded, walking four arms and substituting a fallback for each absent code. A data space
  pairs the curated mapping with the wood tier, the archive tier and a reference-only tier, and a generation
  specification drives a JSON schema over the published shapes.
