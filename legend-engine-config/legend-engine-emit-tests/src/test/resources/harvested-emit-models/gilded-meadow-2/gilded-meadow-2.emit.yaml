name: gilded-meadow-2
title: "Gilded Meadow 2 - a closed-window condition board with a JSON-schema intake binding, published through a data space"
description: |
  A public sculpture condition register whose model spans two worlds. One class is bound to a
  warehouse table through a single relational mapping that pins its primary key and reads
  through an aliased main table; two further classes carry no store at all and take their
  shape from a published JSON schema set, reached through an external format binding that
  declares the content type and the schema the intake records must satisfy. A single
  execution service carries the only query: a closed date window over the recorded surveys,
  written in relation grammar, whose tests pin that both boundary days are inclusive, that a
  one-day window keeps exactly that day, and that a window closing before the first survey
  reports nothing. The fixture rows are held as a reusable data element rather than inline,
  the store is reached over a Snowflake datasource under OAuth, and the endpoint is offered to
  consumers as the featured executable of a data space with a combined support contact.
