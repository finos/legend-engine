name: wistful-estuary
title: "Wistful Estuary - A Remote Parcel Registry Refined Through A Model Chain Behind A Governed Data Space"
description: |
  An estuary reserve registry whose request-shaped store exposes a flat document feed and a
  two-parameter lookup, both returning parcel envelopes bound through a schema-less JSON binding.
  A model-chain connection lets a refinement layer consume those envelopes inside one runtime,
  tiering the published parcel kind across eight arms with an unknown-kind fallback, pinning the
  registry key to a constant and leaving four node properties unpopulated. A resolution layer of
  standalone functions returns literal profile collections and folds a catalogue tree name through
  nested conditionals, while a governed data space wires the mapping, runtime, diagram and featured
  node together and a second declared remote store stays bound by no runtime.
