name: ember-otter
title: "Ember Otter — Catalogued Riverbank Survey With Bound Digests and Parameterised Registers"
description: |
  A riverbank otter survey. Two independent tables in one schema back two query
  roots that share an inherited identity shape, and a relational mapping anchors
  each root on its own main table with an explicit key, so every root is queried
  alone and each plan is a single select. Three services publish the registers:
  a parameterised reach-bounded filter with a pup-presence escape arm, a
  collection-membership query whose empty operand widens the register to every
  row, and a second-root query with a chamber floor. Two JSON bindings fix which
  digest classes can be serialised and how their absent optional properties are
  represented, and a data space catalogues the classes, the three published
  queries and a support contact as one unit, so the mapping, runtime, classes and
  services must all resolve together. Both mapping suites carry their fixtures
  inline, including null-bearing rows, so branch and null coverage lives in the
  model itself.

