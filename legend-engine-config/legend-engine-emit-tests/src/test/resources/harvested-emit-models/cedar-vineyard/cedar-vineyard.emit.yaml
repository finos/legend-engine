name: cedar-vineyard
title: "Cedar Vineyard — Vineyard Block Canopy Monitoring (parameterised single-execution services over collection-op filters with JSON schema-set bindings and document-collection stores)"
description: |
  A vineyard canopy monitoring model whose parameterised single-execution
  services filter vine blocks by a normalised trellis kind against a surveyed
  block-code collection, and rank dense shaded canopy readings above a requested
  leaf-layer threshold before projecting a bounded relation. Two JSON
  schema-set bindings type the inbound block record and the canopy reading, and
  three document-collection stores describe the note, pruning and irrigation
  collections that accompany the relational canopy tables.

