name: apiary-control
title: "Maple Apiary 2 - environment-keyed apiary control reporting over a cross-schema semi-structured store"
description: |
  A hive-inspection control domain. A three-schema relational store keeps wide
  all-versions event tables with semi-structured document columns, work-item
  version and comment tables, and a presentation schema of keeper, team and
  region tables plus grouped maximum-version views used for latest-row
  selection. Named joins span all three schemas, add predicates to key
  equality, pair identifier with version, and extract a correlation value out
  of a document column inside the join condition.
  One shared mapping binds the report class over its main table with an explicit
  primary key, deserialises document properties through external-format
  bindings over semi-structured columns, reaches a region label through a
  four-hop join path, and computes a nine-arm care band and a brood tag as
  conditional transforms; an operation mapping unions a latest-version view
  branch with an all-versions branch, and a shared derived-fields class over the
  same main table carries guarded date-difference and link-building qualified
  properties. A parameterised date-range service and an environment-keyed
  multi-execution endpoint share that mapping while each environment supplies
  its own warehouse binding, whose post-processor rewrites every schema and
  table name to its environment-specific physical equivalent, and a data space
  exposes both contexts. Four further complex-typed report properties are
  binding-backed over sub-documents extracted by path from the inspection
  payload column, so each one parses only its own nested object.
