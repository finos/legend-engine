name: solar-beacon-relational
title: "Solar Beacon — Data Space over Multi-Execution, Operation-Union & Bi-Temporal Relational Model"
description: |
  A non-financial solar-monitoring model presented as a governed data space.
  A base `Observatory` class is extended by `SolarStation`, which is assembled
  by an `Operation` union over two regional station tables. A `Region` class
  carries a panel count derived from an inline `View` reached across a named
  inner `Join`. A business-temporal `Reading` class is served as-of a business
  date by a single-execution `Service` carrying an executed test suite, while a
  multi-execution `Service` routes the station projection per grid key to
  east/west runtimes. A JSON `Binding`/`SchemaSet` binds the `Region` class to
  an external format, and a `DataSpace` packages the model with an execution
  context and an executable as a discoverable entrypoint. All connections use a
  Snowflake OAuth `RelationalDatabaseConnection` over the `SolarDB` store.

