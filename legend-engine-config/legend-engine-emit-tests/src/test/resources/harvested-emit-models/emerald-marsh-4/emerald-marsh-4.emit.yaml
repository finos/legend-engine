name: emerald-marsh-4
title: "Emerald Marsh 4 - two-stage nest register over a chained document feed"
description: |
  A marsh nest register. Nest reports arrive as nested documents through an
  inline document connection. A first model-to-model stage standardises each
  report: a depth function walks an eight-arm conditional ladder with a null
  fallback, kind and egg-stage codes are computed through nested conditionals
  before enumeration lookups so unlisted codes fold onto sentinels, and the
  lead and backup observers are split through an operation union bound by an
  association. A second stage, reached through an inline chaining connection,
  qualifies each standardised nest with boolean helper functions that drive a
  further enumeration lookup. A parameterised service delegates to a single
  entry function, and its tests read inline and reusable data elements and
  compare results in the plain serialisation format.
