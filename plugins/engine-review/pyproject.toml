[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-review"
version = "1.0.0"
description = "engine-review: EMIT-corpus impact comparison (SQL, plans, protocol JSON) of two legend-engine revisions"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
engine-review = "engine_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
test = ["pytest>=7"]
