name: lunar-lagoon-3
title: "Tidewatch Gauges — Folded Date Windows, Collection Tests And District Digests"
description: |
  A watched lagoon whose tide gauges stand district by district and whose water readings are kept in
  their own extent, so a reading reaches its gauge name and its district over one declared join.
  Three single-execution boards sit above the mapping: a level board that folds a week long window
  computed from the caller supplied day around a set membership test and a level floor, a district
  digest that counts the gauges carrying both an accepted reading from a working sensor and a reading
  inside the same window before aggregating on the district, and a sensor roster that keeps either an
  accepted reading away from the retired gauge or a still held reading and then removes duplicates.
  The upstream and archive extents are reached through statically addressed connections with
  delegated ticket authentication.
