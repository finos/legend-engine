name: dusky-tundra
title: "Dusky Tundra — Lichen Grazing Plot Roster (environment-keyed multi-execution over a branch-covered compound predicate)"
description: |
  A tundra lichen grazing survey whose roster query allocates a normalised range
  anchor and then filters plots through a compound predicate that switches
  between an unrestricted plot-code path and a caller-supplied membership path
  before bounding the lichen cover and projecting a de-duplicated tabular
  result. One multi-execution service keyed by environment binds that body to
  two runtimes, and its single-execution counterpart carries fixtures that cover
  both arms of the predicate.

