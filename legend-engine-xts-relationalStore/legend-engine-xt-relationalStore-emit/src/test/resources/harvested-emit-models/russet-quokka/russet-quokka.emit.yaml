name: russet-quokka
title: "Coastal Reserve Colony Counts — Bitemporal Point-in-Time Projection Across Association Chains"
description: |
  A coastal-reserve wildlife corpus whose burrow headcounts are versioned on both
  a recording and an observation timeline. A single-execution service takes the two
  instants positionally into the bitemporal extent so they scope which version of
  each headcount survives, then projects five flat columns whose sources range from
  a local scalar to a three-hop chain of to-one associations. A mapping testSuite
  and a service testSuite assert in-window, superseded and out-of-window versions
  alongside a chain that stops short of the stewardship zone.
modelSources:
