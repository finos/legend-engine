name: russet-arboretum-2
title: "Russet Arboretum 2 — a business-temporal trail inspection register read through a four-hop stewardship path, derived bands and a two-arm priority conditional"
description: |
  An upland trail maintenance register whose inspections are versioned along a business
  timeline, so a query asking for one day sees only the versions open on that day and
  never the version closed before it. Each inspection reads a terrain classification from
  a stored two-letter code, composes an erosion index arithmetically from its severity and
  wash counts, resolves a repair priority through a two-arm conditional whose fall-through
  leaves the priority unrecorded, names the calendar year of the day it was logged, carries
  a fixed register tag and reaches the publishing region by walking segment, steward,
  district and region. Segments and stewards live in an included reference mapping and are
  navigable in both directions through a stewardship association, while stewards and
  segments both inherit their shared identity and label properties from supertypes.
  Derived bands over severity, erosion and the possibly-unrecorded priority are computed by
  expression rather than stored, and a second query narrows the same timeline by day
  arithmetic against the queried day.
