name: zephyr-harbor-relational
title: "Harbour Kelp Monitoring — Relational Mapping Layer with a Cover-Band Ladder and a Union Across Schemas"
description: |
  A harbour kelp-monitoring model whose whole behaviour sits in the mapping layer: a
  relational base mapping derives every buoy station's cover band from a nine-arm
  conditional ladder over a joined survey column, reads its crew name across a
  three-hop join path, takes its survey tally from an inline view and carries an
  inline mooring block that falls back to a standalone crew set when the embedded
  keys are absent. A second relational mapping unions the same class from two
  schemas behind an operation set implementation, and an instance-to-instance
  mapping folds a text-only inbound feed onto a digest through a six-arm readiness
  ladder.

