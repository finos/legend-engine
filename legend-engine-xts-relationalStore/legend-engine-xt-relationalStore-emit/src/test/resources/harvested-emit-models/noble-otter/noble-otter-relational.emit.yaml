name: noble-otter-relational
title: Layered trial-plot staging estate with operation-composed mappings
description: A field-trial staging estate whose source store carries pivoting grouped views,
  a view over a view and a distinct join-derived view, while a leaf mapping assembles upstream
  mappings through store-substituting includes. Plot observations resolve through two-hop join
  paths and a deep banding conditional over the aggregated readings, and operation mappings serve
  the same classes either polymorphically over subtype implementations or as a union of two
  reporting forms.
