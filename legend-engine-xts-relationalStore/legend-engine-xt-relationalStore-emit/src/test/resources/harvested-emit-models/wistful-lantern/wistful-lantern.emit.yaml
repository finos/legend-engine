name: wistful-lantern
title: "Coastal Light Station Timeline — Business-Temporal Class over a Profiled Domain with an Association Mapping"
description: |
  A coastal navigation-aid corpus whose light-station class lives on a business
  timeline while the sector, optic, vessel and visit sets around it are static.
  A locally declared profile carries the stereotypes and tagged values applied
  to the milestoned class, the decommissioned fog signal and the rotating optic
  subtype, and an association binds maintenance visits to their tender vessel
  through a named inner join. A mapping test suite seeds every table and asserts
  the relation projected as of a fixed business date, so the superseded version
  and the version whose validity window has not opened are both absent.
modelSources:
  model:
    root: wistful-lantern
    files:
      - test/wistfullantern/domain/LanternDomain.pure
      - test/wistfullantern/mapping/LanternMapping.pure
      - test/wistfullantern/store/LanternDB.pure
