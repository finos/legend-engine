name: meadow-fjord-8
title: "Alpine Meadow Survey Plots — Three Filtered Register Feeds Over A Kerberos-Delegated Warehouse"
description: |
  An alpine meadow survey estate whose walked plots, flowering counts and crew visits are held in
  three tables of one relational extent, each mapped root-first with a declared primary key and a
  main table alias. Three single-execution feeds sit above the mapping: a plot register pinned to a
  slope floor the caller names, a bloom board narrowed to one species and to the counts that
  cleared a threshold with the ground cover rounded to whole points, and a visit log from one day
  onwards that pastes the crew onto the plot it walked. The extent is reached through a
  Kerberos-delegated warehouse, and the mapping carries its own suite in which a slope test and an
  aspect test sit under one filter.
