name: quiet-ridge-2
title: "Quiet Ridge 2 - Keyed Mast Check Register"
description: |
  A ridge-line radio repeater register that publishes active mast artifacts and their
  passing inspection counts through two keyed service environments. Relational
  filters retain active artifacts and dish masts, inherited mapping resolves the
  ridge artifact hierarchy, an association joins each mast to its checks, and the
  service projects a sorted five-column TDS register with an optional artifact-kind
  filter and a caller-supplied review floor. Assertion-backed coverage includes
  active and retired artifacts, dish and panel subtype filtering, string transforms,
  passing and ungraded checks, multi-execution routing, and an empty archive result.
