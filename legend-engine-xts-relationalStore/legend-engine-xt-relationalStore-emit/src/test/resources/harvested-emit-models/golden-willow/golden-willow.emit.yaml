name: golden-willow
title: "Golden Willow - Keyed Garden Plantings Services with Cross-Schema Join"
description: |
  A botanical garden register served over a cross-schema relational store whose
  plant catalogue joins to a layout schema of planting beds. A keyed
  multi-execution service and its single-execution tested counterpart return
  currently-standing plantings for a requested zone through a deep boolean
  predicate that combines a date-arithmetic recency test, a status membership
  test, a far-future retirement sentinel and an adjacent-zone membership set,
  while an unfiltered directory service gives the trivial projection. The
  mapping walks the cross-schema inner join for its bed zone and carries its own
  tabular-data-set test suite alongside the service suites.
modelSources:
  model:
    root: golden-willow
    files:
      - test/goldenwillow/connection/GardenConnections.pure
      - test/goldenwillow/domain/Domain.pure
      - test/goldenwillow/mapping/GardenMapping.pure
      - test/goldenwillow/runtime/GardenRuntimes.pure
      - test/goldenwillow/service/ActivePlantings.pure
      - test/goldenwillow/service/ActivePlantingsAsOf.pure
      - test/goldenwillow/service/PlantDirectory.pure
      - test/goldenwillow/store/GardenDatabase.pure
