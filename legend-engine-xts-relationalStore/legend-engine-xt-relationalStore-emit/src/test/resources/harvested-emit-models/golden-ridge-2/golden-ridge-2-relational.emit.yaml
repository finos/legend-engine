name: golden-ridge-2-relational
title: "Herbarium Ridge Reconciliation — Duplicate-Detection Views, Cross-Store Findings and a Keyed Service"
description: |
  An advanced relational corpus reconciling herbarium sheets against their
  intake rollup. Two stores spread relations over three schemas; grouped
  inline views expose a synthetic duplicate key that set implementations map
  onto with distinct and group-by modifiers, a null-tolerant store filter
  trims sheets whose validity window never opened, and an eight-arm vigour
  conditional falls through to a SQL null sentinel. Findings reach the field
  station store through cross-store associations, and single- and
  multi-execution services project the verdicts for a requested voucher
  collection.
