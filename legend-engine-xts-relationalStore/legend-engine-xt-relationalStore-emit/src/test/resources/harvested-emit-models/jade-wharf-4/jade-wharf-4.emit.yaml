name: jade-wharf-4
title: "Canal Lock Flight Board — Parameterised Relational Service With In-Query Runtime Binding And A Relation Column Select"
description: |
  A canal lock register served as a lock-flight board. One parameterised service,
  owned by a deployment identifier, filters the lock chambers of the requested
  canal, projects an upper-cased board name, a canal-qualified tag and the rise in
  metres, keeps only the board columns with a relation select and binds the query
  to its mapping and runtime with an explicit from() inside the lambda. The service
  suite proves both a populated canal and a canal with no locks.
