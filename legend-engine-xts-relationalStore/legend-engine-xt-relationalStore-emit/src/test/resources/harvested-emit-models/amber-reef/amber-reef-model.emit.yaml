      - test/amberreef/domain/ReefProfile.pure
      - test/amberreef/domain/SurveyMethod.pure
      - test/amberreef/domain/SurveyRecord.pure
      - test/amberreef/mapping/ReefMapping.pure
      - test/amberreef/store/ReefDB.pure

