name: amber-reef-model
title: "Amber Reef — Business-Temporal Survey Lattice with Selectors, Constraints and a Banded Conditional"
description: |
  A reef-monitoring domain whose business-temporal survey root carries a
  bounded-coverage constraint, parameterised selector properties over its
  observations, collection-operation derived properties and a coalescing
  label, all inherited by a two-level subtype chain and widened by three
  associations. A relational survey table maps the root and derives a
  condition band through a nested conditional whose arms and absent-index
  fallback are covered by a point-in-time mapping test.

modelSources:
  model:
    root: amber-reef-model
    files:
