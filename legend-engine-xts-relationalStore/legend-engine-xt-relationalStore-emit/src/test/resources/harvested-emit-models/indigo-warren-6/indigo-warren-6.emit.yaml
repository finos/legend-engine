name: indigo-warren-6
title: "Windmill Millstone Dressing Register Read at a Business Point in Time"
description: |
  A windmill millstone register whose stones are business temporal, so every query
  names a business date and the stone retired at the end of the previous year
  surfaces no row. Each stone decides its grit label and its dressing note through
  nested conditionals over the dressing grit and the furrow count, reaches its site
  through one inner join and its county through a second hop onto the parish
  relation, and totals its grinding load through an inline view that groups the runs
  and admits only the dry ones. The site relation is restricted by a filter whose
  sail kinds are a literal list, so the derelict mill is never read.
