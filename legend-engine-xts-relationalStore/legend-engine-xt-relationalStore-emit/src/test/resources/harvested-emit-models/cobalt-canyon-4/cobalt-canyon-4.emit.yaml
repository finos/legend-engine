name: cobalt-canyon-4
title: "Cobalt Canyon - ranger patrol services over processing-temporal reports with as-of trail closures"
description: |
  A canyon ranger patrol register. Patrol reports are versioned over
  processing time and point to a business-temporal trail segment, a numbered
  sector and a set of hazard notes. Four single-execution services, split into
  a live and an archive environment bound to their own mapping and runtime,
  open with two let-bound timestamps from now() and read the report extent as
  of the processing date or a far-future literal. Each filters on a nested
  conjunction of a day-granular lower-bound date test against a fixed date,
  a rolling window of one week or one month before today, a negated membership
  exclusion of sector numbers reached through a navigation and a negated
  emptiness test on the hazard notes; projects direct properties, one-hop
  paths, constant columns, a milestoned property call on the trail segment
  and a conditional ranger-tag column driven by a regular-expression match;
  then filters projected rows on a boolean column not being true (and, in the
  monthly review, a non-empty tag) and applies distinct. Services declare a
  user-list ownership and auto-activate updates. Service tests cover a
  superseded processing version, a trail segment version not yet in force,
  rows inside and outside each window, excluded sectors, missing hazards,
  true, false and empty flags and duplicate rows collapsed by distinct.
