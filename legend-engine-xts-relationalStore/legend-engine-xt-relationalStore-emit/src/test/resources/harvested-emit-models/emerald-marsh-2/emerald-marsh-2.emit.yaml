name: emerald-marsh-2
title: "Emerald Marsh 2 - Point-In-Time Reed Stand Boards With Environment-Keyed Multi Execution"
description: |
  A wetland reed-stand monitor whose business-temporal class is resolved at an
  instant pinned far in the future, so only the version whose validity window
  contains that instant survives. Two single-execution services publish the
  resolved board: one gating on a height floor, a cover floor and a recording
  date that is not in the future, the other testing membership of a
  multi-valued sector parameter with an existential quantifier. Each has an
  environment-keyed multi-execution twin whose key selects a whole
  mapping/runtime binding. Both tested services carry deterministic relational
  fixtures including a version that closed on the business timeline before the
  pinned instant.
modelSources:
