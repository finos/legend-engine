name: cedar-beacon-network
title: "Civic Transit Network — Business-Temporal Hierarchy over Two Relational Stores"
description: |
  A municipal transit register whose district, zone and stop levels are all
  business-temporal, so every read is an as-of query and each level must be
  open at the pinned date for the hierarchy to resolve. Two relational stores
  bind five annotated classes through aliased main tables and explicit primary
  keys, reaching the zone name one inner-join hop away and the district name two
  hops away, while a separate shelter register reaches its corridor name through
  a single hop. The mapping test suites pin the business date on either side of
  a closed zone window and include a hop with no matching register row.
modelSources:
