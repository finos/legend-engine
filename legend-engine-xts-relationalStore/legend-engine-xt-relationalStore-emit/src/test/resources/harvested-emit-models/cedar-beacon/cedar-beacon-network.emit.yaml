      - test/cedarbeacon/mapping/NetworkMapping.pure
      - test/cedarbeacon/mapping/ShelterMapping.pure
      - test/cedarbeacon/store/CivicNetworkDb.pure
      - test/cedarbeacon/store/ShelterRegisterDb.pure
