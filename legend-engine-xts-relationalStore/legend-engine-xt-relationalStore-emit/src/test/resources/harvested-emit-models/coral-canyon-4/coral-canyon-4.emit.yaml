name: coral-canyon-4
title: "Coral Canyon 4 — A Canyon Core-Sample Register With An Eight-Armed Stratum Cascade, Three Expression Enumerations And A Two-Hop Ridge Reach"
description: |
  A canyon geology survey registering the sediment cores it draws from the canyon walls. The core
  store includes a separate reference store of outcrops and ridges and defines a grouped view
  keeping the latest visit number and visit time per sample by maximum. An active-sample filter
  keeps cores never retired or retiring after today and drops voided cores. One relational class
  mapping applies that filter, bands the core depth through an eight-armed stratum cascade falling
  through to an explicit null, translates an upper-cased grain code, a three-armed weathering band
  and a two-armed hazard flag onto closed enumerations through computed source expressions,
  extracts the logged year, concatenates an outcrop-and-sample key, reaches the outcrop one hop
  out, the ridge two hops out and the latest visit through a join onto the grouped view. A
  model-to-model mapping digests nested reading bundles, counting filtered gamma readings and
  grading how completely each bundle is dated. A static in-memory database connection with
  delegated Kerberos is bound by an engine runtime.
