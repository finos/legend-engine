name: gilded-thicket
title: "Gilded Thicket Greenway Canopy Survey — Deep Join Chains, Computed Enumerations and a Unioned Register"
description: |
  A municipal greenway canopy survey whose inspection records reach an
  administrative borough across a five-hop cross-schema join chain and read a
  ward name back out of a derived view. Four enumerations are sourced from
  computed case expressions, an eight-arm condition band falls back to a null
  sentinel, the survey location is folded in as an embedded mapping, and an
  operation root unions the live register with the retired archive.
modelSources:
  model:
    root: gilded-thicket
    files:
      - test/gildedthicket/domain/CanopyDomain.pure
      - test/gildedthicket/mapping/CanopyEnumMappings.pure
      - test/gildedthicket/mapping/CanopyMapping.pure
      - test/gildedthicket/mapping/GreenwayBaseMapping.pure
      - test/gildedthicket/store/CanopyStore.pure
      - test/gildedthicket/store/GreenwayStore.pure

