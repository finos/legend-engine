name: sable-lighthouse-2
title: "Sable Lighthouse 2 - Museum Conservation Cases Split by Store Filters and Chained Joins"
description: |
  A museum conservation workshop whose case table holds treatment and survey rows
  together. Store filters split it into two classes, one excluding cancelled cases and
  the other requiring a minimum priority. The workshop store includes a separate
  conservator store and joins across it, so a treatment case reaches its conservator by a
  cross-store join and a workshop note reaches the same conservator by chaining a
  note-to-case join, which also rejects voided notes by a literal condition, with the
  case-to-conservator join. Mapping tests cover filtered splits, unmatched keys and both
  complete and broken join chains.
modelSources:
