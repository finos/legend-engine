name: fabled-vineyard-5-estate
title: "Fabled Vineyard 5 - business-temporal vine block model with two keyed estate runtimes"
description: >
  The model half of a trellised vineyard corpus: a business-temporal vine block mapped onto a
  milestoned block table, with the store, mapping and the two connections and runtimes that the
  keyed multi-execution services resolve through but do not define.
