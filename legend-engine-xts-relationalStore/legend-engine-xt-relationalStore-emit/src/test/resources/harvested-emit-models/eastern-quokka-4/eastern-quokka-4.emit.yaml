name: eastern-quokka-4
title: "Eastern Quokka 4 — District Shuttle Roster"
description: >-
  A school-district shuttle roster with processing-temporal route assignments, a relational
  source mapping, a flattened model-to-model roster, reusable route derivations, and a
  single-execution service for the active assignment window.
