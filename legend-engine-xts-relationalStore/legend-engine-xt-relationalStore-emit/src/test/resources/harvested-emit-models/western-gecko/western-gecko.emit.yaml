name: western-gecko
title: "Western Gecko - One Point-in-Time Search Query: Predicate, Projection, Post-Projection Restriction and De-Duplication"
description: |
  A gecko monitoring register whose whole surface is a single search endpoint.
  The query pins the business-temporal sighting class to a survey day returned by
  a helper function, narrows it with a four-way conjunction mixing a text test on
  a navigated habitat, a boolean test on a navigated protection flag, membership
  in an enumerated habit group, a negated tail condition and a disjunction of two
  containment tests, and requires a matching observation tag through an existence
  test over a to-many relationship. The two labelled site columns it projects are
  then restricted again by the caller's search term against their concatenation
  and de-duplicated, so distinct site combinations rather than matched sightings
  decide the output cardinality.

