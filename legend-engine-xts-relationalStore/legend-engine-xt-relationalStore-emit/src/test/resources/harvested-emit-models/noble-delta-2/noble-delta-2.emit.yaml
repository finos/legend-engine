name: noble-delta-2
title: "Noble Delta 2 — Cycleway Counting Windows Classified by an Eight-Arm Conditional over a Three-Hop Join Chain"
description: |
  A cycleway counting corpus whose survey codes are classified in the mapping
  rather than the query: an eight-arm nested conditional turns the raw weather
  code into a band and falls through to a null sentinel for an unrecognised
  code, while two further conditionals derive a crowd tier from a numeric
  comparison and a surface state from a literal set membership test. String
  functions normalise the free-text note, a literal stamps the survey
  programme, and each window resolves its unit one hop away, its segment two
  hops away and its planning district three hops away, with the recording unit
  also reached through an association implementation. Two store filters on
  different tables and a shared data element back the mapping test suites.
