name: emerald-lagoon
title: "Emerald Lagoon Registers — Two Single-Execution Services Over A Windowed Four-Operand Predicate"
description: |
  A lagoon monitoring model exposing two single-execution services over one relational store,
  each restricting its own relation with the same four-operand predicate: an equality on the
  zone requested by the caller, an equality on the recorded status, a lower bound derived by
  offsetting the requested date back by a fixed number of days, and an upper bound taken from
  the day the register is read, so a row recorded ahead of that day never qualifies. Each
  service projects a derived column computed from measured columns alongside the raw ones and
  the age of the record counted from the requested date, then de-duplicates and orders the
  result. Both services carry test suites pinning a call that returns exactly one row and a
  call whose zone qualifies nothing, so the empty result is asserted rather than assumed.
