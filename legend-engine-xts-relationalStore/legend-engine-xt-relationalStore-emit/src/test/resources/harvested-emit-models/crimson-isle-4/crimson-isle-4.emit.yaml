name: crimson-isle-4
title: "Crimson Isle 4 — island bird observatory"
description: |
  A relational bird-observatory ringing register for an island station. A
  profiled visit class is mapped to one ringing table and exposed through a
  station-selection function. Two DB2 delegated-Kerberos connections and two
  engine runtimes exercise the operational scaffolding, while a single
  service projects a v1 tabular response after filtering by wing span.
