name: teal-quokka-relational
title: "Field Station Sightings — Deep Conditional Transforms, Enumeration Mappings Over Expressions and Three-Hop Joins"
description: |
  A relational corpus over a wildlife field station. A single database holds
  sightings, animals, species and taxonomic families, and the relational
  mapping derives a condition band from an eight-arm conditional that falls
  through to a SQL null sentinel, builds a label from string functions, and
  resolves three enumerations from computed code expressions, including a
  stored code that is outside the enumeration mapping. Sighting attributes are
  reached over a three-hop join path, and a companion model-to-model mapping
  resolves the same enumerations from expressions over a staging class.
modelSources:
