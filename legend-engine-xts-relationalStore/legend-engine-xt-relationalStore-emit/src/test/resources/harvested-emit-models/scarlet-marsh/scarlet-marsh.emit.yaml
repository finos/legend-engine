name: scarlet-marsh
title: "Scarlet Marsh — Community-Orchard Graft Register Spanning Two Relational Stores, With Keeper Sets Borrowed Through A Store-Substituting Mapping Include And A Target-Bound Plot Self Join"
description: |
  A community orchard whose graft records, plots and varieties live in one
  relational store while its picking tickets are landed in a second, so the
  published register spans both. The keeper reference mapping is authored once
  against the keeper store and then borrowed twice: plainly into the cross
  mapping, and with a store substitution into the orchard mapping, which rebinds
  the borrowed keeper sets onto the locally declared table set without restating
  a single property. The orchard store declares three schemas, named inner joins
  onto the variety, plot and keeper tables, a join whose far side is bound to the
  join target so a plot resolves its own parent through the same reusable
  definition, and two named filters, one of which spans the graft and plot tables
  and therefore forces an extra join into the generated subselect. Keeper records
  are specialised into a rota subtype and a guild subtype selected by store
  filters, and the services narrow to the rota subtype before reading its
  subtype-only properties. Two single-execution services expose a parameterised
  register and a de-duplicated plot roster, each ordered and capped, and both are
  bound to the cross mapping and a runtime holding one connection per store.
  Mapping suites assert the borrowed keeper sets, the target-bound parent join and
  the cross-store pairing; service suites assert the optional collection guards
  including their unguarded arms.

