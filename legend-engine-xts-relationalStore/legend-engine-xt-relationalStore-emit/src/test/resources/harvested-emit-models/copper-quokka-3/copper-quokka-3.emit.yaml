name: copper-quokka-3
title: "Copper Quokka 3 - Season-Keyed Apiary Inspection Services With Rank Windows And Rollups"
description: |
  A bee-keeping cooperative records hive inspections across yards and queen
  lineages. Season-keyed multi-execution services and single-execution
  services, owned by user lists or deployment identifiers, filter on parameterised
  inclusive date windows, membership lists and name prefixes, project through one-
  and two-hop to-one paths, scale an optional honey weight only when present, group
  with sums, maxima and distinct counts, de-duplicate lineage pairs, and rank
  inspection dates per yard with a dense rank before keeping the busiest yard.

