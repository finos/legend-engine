name: western-tundra
title: "Western Tundra — An Alpine Vegetation Survey Hierarchy Reached Through Chained And View-Landing Joins"
description: >-
  An alpine tundra vegetation estate held in two relational stores. The live survey store spreads
  reserves, plots, quadrats, taxa and percent-cover readings across five tables and republishes three
  of them as inline views; the archive store keeps closed-season plots and readings alongside a digest
  view. Mapped properties reach sideways rather than downwards: a cover reading resolves its plot code
  through two hops that land on a view and its reserve name through three chained hops, so one row
  drives a nested join tree with a sub-select in it. Mapping suites assert both the chained hierarchy
  hit and the view-backed reads.
modelSources:
