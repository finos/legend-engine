name: lunar-ridge-5
title: "Lunar Ridge 5 — Ridge Trail Survey Over Two Schemas With Enumeration-Mapped Surfaces, A Chained Join Path And An In-Engine Digest Transform"
description: |
  A ridge trail-survey model whose registry schema holds the heads and regions
  and whose field schema holds the segments and their maintenance visits, so
  every property that names a head or a region is reached across a schema
  boundary. Segment standing is never stored: the surface is resolved by an
  enumeration mapping over a short source code, the grade is arithmetic over the
  recorded ascent and length, the condition band branches through eight arms of a
  nested cascade before falling through to a null sentinel, and the crew label is
  a conditional string concatenation that yields nothing for a retired survey. A
  surveyed specialisation extends the segment class mapping under the store's
  named active-survey filter, so a retired segment is present in the fixture yet
  absent from the result. The visit class walks three chained hops from the visit
  row through the segment and the head to the region, which is the deepest path
  in the mapping and is asserted rather than assumed. Alongside the relational
  side an in-engine mapping derives a digest entirely from expressions over a
  note type — a key built by string manipulation, a band cascade, two
  enumeration-valued properties resolved from computed codes and an arithmetic
  effort index — and carries its own mapping test suite over model-store data.
  Both governed endpoints are multi-execution: one query, two keyed mapping and
  runtime pairs, so plan generation happens per key. The same store also carries
  a warehouse and a standby connection with static datasource specifications and
  delegated Kerberos authentication.
