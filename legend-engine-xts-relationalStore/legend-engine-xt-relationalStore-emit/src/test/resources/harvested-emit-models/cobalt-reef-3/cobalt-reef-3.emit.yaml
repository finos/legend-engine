name: cobalt-reef-3
title: "Cobalt Reef - Processing-Temporal Reef Survey Digests Through Two-Hop Milestoned Navigation"
description: |
  A non-financial coral reef monitoring model. Five processing-temporal classes - reef sites,
  anchored probes, probe regions, survey dives and dive crews - are wired by four associations
  and mapped twice, over a live and a mirror register, each with its own runtime. Two
  DID-owned, auto-activating services share one parameterised query: the processing date
  arrives as a URL path parameter, drives the root retrieval and every date-qualified
  navigation, filters on two negated enumeration equalities (one on the site and one on its
  navigated probe), projects to-one and to-many paths up to two hops deep, collapses rows
  duplicated by the to-many dive fan-out with distinct and sorts the result.
