name: umber-fjord
title: "Umber Fjord - Multi-Hop Relational Mapping With Banded Flow Service"
description: |
  A fjord hydrology model whose flow readings resolve their owning basin through
  a three-hop station-catchment-basin join path and carry a conditional flow
  band derived from the recorded flow rate. A single service filters readings by
  threshold and region prefix, keeps the high and critical bands via a
  collection membership test, and projects the banded rows grouped by basin.
