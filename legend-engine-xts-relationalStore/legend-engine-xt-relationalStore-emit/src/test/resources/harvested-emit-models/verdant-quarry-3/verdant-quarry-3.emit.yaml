name: verdant-quarry-3
title: "Quarry Face Surveys — Four Single-Execution Services From A Windowed Predicate Down To An Unfiltered Wide Projection"
description: |
  A stone-quarry survey model whose consumer surface is four single-execution
  services over one relational store. The deepest service closes a survey date
  window with a three-operand predicate spanning two comparison kinds and a
  joined regional equality, then bands the bench height through a three-level
  nested conditional inside the projection. A second service narrows the core
  samples to one mineral code across a single inner hop, and two unfiltered
  services publish a counted site register and a seven-column sample manifest
  whose last two columns are resolved two hops away. Every service is exercised
  by its own test suite against in-process fixture rows.

