name: scarlet-prairie-4
title: "Scarlet Prairie 4 — Restoration Plot Register Through Case Bands, Self Joins, Three-Hop Species Paths and a Distinct Sighting View"
description: |
  A grassland restoration programme keeps plots, transects, species observations and a
  species reference list in one relational store. The plot mapping includes a shared
  enumeration mapping, applies a multi-term store filter, derives labels with string
  functions, areas with arithmetic, an eight-arm soil band with a null fallback, a
  substring-driven grazing tier, a zero-guarded stem density, a constant source tag, the
  parent plot through a self join and species names through a three-hop path whose last
  join carries a literal-state condition. A distinct view chains an inner species hop
  behind a composite transect join, and a model-to-model digest maps three enumerations
  from computed codes.
modelSources:
