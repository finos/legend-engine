name: meadow-summit
title: "Meadow Summit - Alpine trail upkeep register with a grouped view, an association and district-keyed execution"
description: |
  An alpine meadow trail-upkeep register whose segments, maintenance visits,
  crews and depots span two schemas and are navigated over inner joins, a
  two-hop crew-to-depot path and a bidirectional association between segments
  and their visits. A grouped view rolls visit counts and hours per segment,
  eight labelled surface arms fall back to a null sentinel, and the same
  projection is served both from a single execution and from a district-keyed
  multi-execution stack.
