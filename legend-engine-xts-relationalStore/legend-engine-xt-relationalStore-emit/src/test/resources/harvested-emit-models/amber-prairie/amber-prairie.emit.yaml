name: amber-prairie
title: "Amber Prairie — relational one-to-many EMIT model (join-bound collection implementation, graph-fetch mapping test & runtime-embedded seeded connection)"
description: |
  A non-financial prairie-restoration model in which one relational store holds a plot table
  and a seed-lot table keyed on floating-point identifiers and joined on the plot identifier,
  and one mapping binds both classes with explicit primary keys and main table aliases while
  resolving the many-valued collection property through the join qualified with the member
  implementation. Assertion-backed coverage: a graph-fetch mapping test fetches and serialises
  the same plot tree from an executable relational fixture, and a single-execution service
  filters seed lots by a floating-point path parameter and projects three spaced display
  aliases from delimited fixture rows.
