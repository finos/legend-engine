      - test/sunlitfossil4/mapping/QuarryMapping.pure
      - test/sunlitfossil4/runtime/QuarryRuntime.pure
      - test/sunlitfossil4/service/BedTallyService.pure
      - test/sunlitfossil4/store/QuarryDatabase.pure
