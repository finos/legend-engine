name: frosted-lagoon-3
title: "Frosted Lagoon 3 - a nested eight-arm shell-size conditional and three-hop join paths over an oyster-tray store, with two aggregating group-by class mappings"
description: |
  A tidal lagoon oyster-cultivation register. One relational mapping anchors the tray extent on an
  explicit main table with its own declared key, derives the size band through an eight-arm nested
  conditional that falls back to no band at all, resolves the grade enumeration from an expression
  over the source code column, and reaches the trestle, the bed and the lagoon zone through one,
  two and three chained join hops so that a miss at any hop leaves the remaining hops empty. Two
  further class mappings aggregate rather than describe: basket entries are grouped per tray into a
  tally, a heaviest basket and a summed weight, while the trays themselves are grouped per trestle
  into a tally and a longest shell. The enumeration mappings live in a separate mapping that the
  base mapping includes rather than restates.

