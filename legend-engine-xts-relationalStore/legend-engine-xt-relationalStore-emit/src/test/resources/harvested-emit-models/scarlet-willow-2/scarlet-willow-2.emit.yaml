name: scarlet-willow-2
title: "Scarlet Willow - A Very Wide Milestoned Conservation Dossier Read Beside An Algebraically Assembled Holding Chronicle"
description: >-
  A paper-conservation registry whose weight sits entirely in the mapping layer. One very wide
  business-versioned dossier relation carries a long run of scalar columns followed by repeated
  single-valued complex panels: three conservator panels, three measure panels each holding a
  further nested detail object, and two labels delegated to separately named set implementations
  rather than expanded in place. Every panel is read from the same wide row, so no traversal
  happens; the reference relations are reached instead through named store joins, one of which
  compares a numeric reference key against a text column that has to be parsed first, and another
  of which is declared once and consumed from both sides through an association. A parallel chronicle
  assembles one holding-line shape algebraically from two independent relations, so a line's
  classification is a constant that only its own relation assigns, and a supertype extent that is
  never mapped directly resolves instead to the three implementations beneath it. Codes translate
  to states through enumeration mappings, several of them over trimmed rather than raw columns,
  and two published columns have no physical source at all and are supplied as literals. Reference
  relations are pulled into two separate stores through mapping includes with the store rewritten
  on the way in. Reads are taken at an explicit business date, one of them before every validity
  window so that nothing is contributed, and one query publishes an explicit attribute subset as a
  serialised document rather than a tabular result.
