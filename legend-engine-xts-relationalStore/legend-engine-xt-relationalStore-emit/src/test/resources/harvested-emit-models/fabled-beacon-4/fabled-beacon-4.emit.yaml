name: fabled-beacon-4
title: "Fabled Beacon — Canopy Stewardship"
description: |
  A cross-schema canopy stewardship model joins temporal tree records to
  habitat zones and maps their association. A DB2-backed point-in-time service
  projects typed tree facts while excluding a record outside the requested
  business window.
