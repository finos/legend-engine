name: quiet-tundra-2
title: "Quiet Tundra 2 - Tundra Vegetation Plots through a Checked Model-to-Model Intake and a Relational Field Store"
description: |
  A tundra vegetation survey. Plot and crew submissions from field tablets arrive as JSON
  through model connections; a model-to-model mapping filters them, bands the cover
  reading through eight conditional arms with an empty fallback, cuts long names and bag
  tags after a length check, flattens the bag tags, translates habitat and bag kinds by
  enumeration mappings and nests the station and bags. Two services fetch plots and crews
  with constraint checking, so warnings about missing cover bands, overcounted quadrats,
  unknown stations and lone crews ride with the values. The same abstract-rooted model is
  also read from a field store that includes a reference store, with composite, cross-store,
  self, literal-condition and converted-key joins, a three-hop station-to-zone path, a
  grouped tally view, a distinct pairing view, an inner-joined zone view, an embedded site
  block and association mappings.
