name: russet-arboretum
title: "Russet Arboretum — business-temporal collection model (point-in-time service family with aggregation, subtype narrowing and de-duplicated wide projections)"
description: |
  A business-temporal living-collection model whose sites, beds, specimens and care operations
  are all milestoned, so every navigation hop carries an explicit anchor date. Three
  single-execution services over one mapping and one runtime span the shape range of the family:
  a de-duplicated, sorted wide projection built from multi-hop bed, site and self-referencing
  propagation navigation with a coerced-to-string column; an aggregation grouping on a two-hop
  navigation with an extremal date aggregate and a row count followed by a post-aggregation
  filter; and a parameterised endpoint that narrows the care-operation extent to one subtype
  behind an inheritance-routed class mapping and labels each row by concatenating navigated
  strings. Fixtures include a bed out of range at the anchor, a retired specimen, an operation
  of the other subtype and an operation just inside the shifted day boundary.
