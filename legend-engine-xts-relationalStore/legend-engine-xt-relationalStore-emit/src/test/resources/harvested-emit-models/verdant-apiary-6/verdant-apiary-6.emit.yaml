name: verdant-apiary-6
title: "Verdant Apiary 6 — One Point-In-Time Projection Planned Under Two Keyed Environments"
description: |
  An apiary hive-colony register kept as a business-temporal record, so every colony code carries a
  succession of effective versions rather than a single row. One business-temporal class is bound to
  one milestoned anchoring table, and the whole model is carried by a single service: a
  multi-execution endpoint whose one query body is planned under two keyed environments that differ
  only in the runtime and connection they route through. The body takes the effective date as a
  parameter, resolves the colonies as of that point in time, keeps the colonies of one named apiary
  and projects the colony code, the upper-cased apiary name, the frame count and the queen line into
  a tabular result through the explicit column-and-header projection form. Each keyed execution
  carries its own suite and fixture, and both fixtures hold versions whose effective range does not
  cover the requested date, so the out-of-range rows are proven to be dropped rather than silently
  projected.
