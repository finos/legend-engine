name: golden-meadow
title: "Golden Meadow - point-in-time patch stewardship across a milestoned association behind single and multi execution services"
description: |
  A meadow pollinator survey whose patches and steward crews are both business-temporal, so a
  query must name the instant it resolves them at. A single-execution service pins that instant
  from a service parameter, gates rows on membership of a patch-code list, on a recorded bloom
  and on a recognised flora code, then projects a seven-armed bloom-band cascade beside the crew
  name and depot reached across the milestoned stewardship association at the same instant. Its
  test suite covers the versions whose window contains the instant, a version that closed before
  it and a version that opens after it. An environment-keyed multi-execution twin serves the same
  shape over either the survey or the archive stack, and profile stereotypes and tagged values
  carry the stewardship metadata on both classes.
