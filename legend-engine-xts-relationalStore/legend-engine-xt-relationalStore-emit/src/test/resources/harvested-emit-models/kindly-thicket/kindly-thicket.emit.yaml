name: kindly-thicket
title: "Kindly Thicket - per-hop temporal resolution beneath an unfiltered eight-column projection"
description: |
  A civic street-tree inventory whose processing-temporal extent is opened at a caller-supplied
  processing date while the planting bed, the bed's district and three separately rostered crew
  roles are each resolved at a caller-supplied business date. With no predicate above the
  projection every path is always evaluated, so the join tree carries five parameterised
  traversals and a hop with no version effective on the business date contributes an absent
  value instead of dropping the tree.
