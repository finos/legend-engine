name: crimson-otter-3
title: "Riverbank Otter Holt Tally — One Keyed Multi-Execution Body Folding A Visit Collection, Banding On Computed Dates And Grouping Per Catchment"
description: |
  A riverbank otter survey held in a single-schema relational store: monitored
  river reaches, the bankside holts sitting on them and the field visits recorded
  on those holts. The holt catchment is reached through a join rather than
  stored, and an association carries the visit collection a survey predicate
  folds over. One multi-execution service keyed by environment hosts the whole
  body: it keeps the graded holts of a requested catchment whose visits are not
  all logged as abandoned, bands each kept holt by the days between its last
  visit and a requested survey instant through a called date function, then
  groups the projected rows on the catchment and counts and maxes within the
  group. Two keyed executions bind the same body to a field runtime and a
  mirrored runtime, and two service test suites — one per key — supply fixture
  rows and assert the grouped result, one of them proving the predicate empties
  the tally.
