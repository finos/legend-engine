name: amber-tundra-5
title: "Amber Tundra — Processing-Temporal Permafrost Readings with Banded Case Derivations, Inner Multi-Hop Joins, Grouped Views & Layered Store Includes"
description: |
  A non-financial permafrost monitoring model over two relational stores, the
  borehole store including the field-site store. Ground temperature readings are
  processing-temporal, so every fetch supplies a processing date and superseded
  readings outside the window disappear. Their mapping derives a thaw band
  through an eight-arm nested case expression with an explicit null fallback,
  cuts probe slots and depths out of the probe label with substring and index-of
  functions, adds and subtracts the cut depth and the sensor offset, builds a
  reference by string conversion and concatenation, assigns a literal source,
  embeds the probe placement from the same row, and reaches the site and region
  names through join chains with explicit inner join types. Joins conjoin
  several column equalities or add a literal depth condition, sub-sites point at
  their parent through a self join, a named store filter compares the retirement
  timestamp with the current time null-safely to keep only live boreholes, and a
  grouped view tallies bores per site for a view-backed class mapping. Three
  mappings layer on one another through mapping includes, and three mapping test
  suites assert every case arm, the null fallback, join misses, the
  out-of-window row, the filter and the grouping.
