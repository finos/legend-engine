name: crimson-lagoon-2
title: "Crimson Lagoon 2 — Processing-Temporal Wetland Readings As-Of Service"
description: |
  A wetland water-quality corpus over a processing-temporally milestoned H2
  store. `WaterReading` records turbidity samples versioned on the processing
  timeline, so a query resolves them at an explicit as-of processing date and
  superseded rows drop out of range. A single-execution service projects the
  station, turbidity, sample year and a rendered turbidity value with a
  distinct-and-sorted tabular result, driving EMIT test execution and
  execution-plan generation over the point-in-time query.
