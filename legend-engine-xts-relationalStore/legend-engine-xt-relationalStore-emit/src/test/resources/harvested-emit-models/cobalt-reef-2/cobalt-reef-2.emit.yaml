name: cobalt-reef-2
title: "Municipal Street-Tree Canopy Survey with Processing Windows and Deep Depot Joins"
description: |
  A municipal canopy survey combines processing-temporal plots and inspections with
  inner joins through crews, maintenance depots, and depot regions. Two tabular services
  filter and project the versioned survey rows with string predicates, duplicate removal,
  deterministic ordering, and a row limit.
