  - mapping:relational-string-function-transform
  - mapping:relational-table-alias-column
  - query:collection-op
  - query:date-arithmetic
  - query:filter
  - query:project
  - query:sort-limit
  - scaffolding:class
  - scaffolding:relational-connection
  - scaffolding:relational-mapping
