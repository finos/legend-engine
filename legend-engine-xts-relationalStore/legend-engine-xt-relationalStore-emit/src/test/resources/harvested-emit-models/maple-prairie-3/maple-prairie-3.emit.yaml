name: maple-prairie-3
title: "Maple Prairie 3 — alpine trail-hut patrol network"
description: |
  An alpine trail-hut network with mountain huts and trail segments in one
  schema, ranger stations and patrol visits in another, and a derived hut
  label view. The model exercises cross-schema joins, a two-hop patrol path,
  relational string transforms, date-window filtering, and TDS v1 services.
modelSources:
  model:
    root: maple-prairie-3
    files:
      - test/mapleprairie3/connection/TrailConnections.pure
      - test/mapleprairie3/domain/TrailDomain.pure
      - test/mapleprairie3/mapping/TrailMapping.pure
      - test/mapleprairie3/runtime/TrailRuntimes.pure
      - test/mapleprairie3/service/PatrolWindow.pure
      - test/mapleprairie3/service/SegmentDigest.pure
      - test/mapleprairie3/store/TrailDb.pure
features:
