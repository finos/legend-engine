name: scarlet-willow-3
title: "Scarlet Willow — Layered Wetland-Reserve Estate with Two Parallel Store Families, a Store-Substituted Mapping Composition, Enum-Of-Expression Translations and Environment-Keyed Multi-Executions"
description: |
  A non-financial wetland-reserve estate whose habitat patches and survey visits are
  versioned by when the survey office recorded them, so every read pins a processing
  instant and the association between them is milestoned. Two structurally identical
  relational families — a warehouse-resident one and a lake-resident one — declare the
  same schemas and tables, and one transformation-heavy leaf mapping serves both: a
  plain inclusion binds it to the warehouse family and a bracketed store substitution
  re-points the identical class bindings at the lake family. That leaf mapping carries
  the model's logic: conditional transforms falling through to a null sentinel, three
  enumeration translations computed from expressions rather than columns, string-built
  labels, a literal-bound scheme, a grouped-view-backed aggregate, a three-hop warden
  path and an attribute join whose condition carries a constant predicate. Above it a
  composing store adds a cross-schema view and join, a locally declared profile marks
  a class as excluded from distribution while duplicating its physical table name as a
  tag, and the service layer projects, groups, de-duplicates, orders and truncates the
  result — once per physical environment through an environment-keyed multi-execution
  whose unknown keys have no fallback.

