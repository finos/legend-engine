name: solar-ridge
title: "Allotment Harvest Rollup — Multi-Hop Grouping Keys, To-Many Reduction and Post-Grouping Deduplication"
description: |
  A community-allotment cultivation corpus whose single tabular service rolls up
  weighed crop lifts for one zone over an inclusive date window. The predicate
  mixes an equality test reached through a two-hop to-one chain with a two-sided
  date comparison and a membership exclusion, and the grouping resolves ten keys
  through chains of one to four hops, including a self-referencing parent-zone
  traversal, before reducing the to-many warden visits to their latest date and
  deduplicating the grouped table.

