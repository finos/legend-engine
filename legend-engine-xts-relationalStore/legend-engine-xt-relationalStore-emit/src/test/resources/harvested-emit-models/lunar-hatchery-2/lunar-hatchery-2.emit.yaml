name: lunar-hatchery-2
title: "Lunar Hatchery - A Thin Rostered Tank Read Refined In Memory Through A Model-Chained Digest Layer"
description: |
  A fish-hatchery tank roster whose physical surface is deliberately minimal: one store with a
  single table of a big-integer key, a bounded label and a single-bit aeration flag, bound by a
  relational mapping that names its main table alias, declares an explicit primary key and binds
  only two properties of one class. A model-to-model layer includes that relational mapping and
  refines the rostered tank into four digest views over five small classes joined by three
  associations, prefixing tags, stringifying the aeration flag through an unknown fallback and
  folding the label width outside the physical read. Two H2 connections and a model-chain
  connection over the roster mapping pair into four engine runtimes, so one execution can read
  the roster and then transform it in memory without a second call.
modelSources:
