name: sable-beacon-2
title: "Sable Beacon 2 - street-tree inventory with single-table subtyping, computed enumerations and a multi-hop steward chain behind a girth-filtered service"
description: |
  A municipal street-tree inventory spanning a cross-schema relational graph and an inline
  tally view. One mapping resolves the tree extent through a three-hop species-genus-steward
  join path, folds string and numeric column functions into scalar properties, resolves canopy
  health and paving surface through enumeration mappings and narrows a heritage subtype off the
  same table. A relational association binds trees to their planting site while a cross-store
  association reaches the crew extent, and a single-execution service projects the roster above
  a caller-supplied girth threshold.
