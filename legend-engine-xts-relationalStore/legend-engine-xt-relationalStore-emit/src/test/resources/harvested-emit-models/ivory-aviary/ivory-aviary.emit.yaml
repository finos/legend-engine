name: ivory-aviary
title: "Ivory Aviary - Processing-temporal shorebird ring roster with a compound case-normalised predicate"
description: |
  A shorebird ringing observatory whose ring register is processing-temporal, so
  every roster query pins the extent to a caller-supplied processing date and the
  generated statement carries the validity window on top of the user predicate.
  The service body mixes an upper-cased mode comparison with two set memberships
  under conjunction and disjunction, and projects an eight-way conditional age
  band, a remark sentinel and string-derived observer and ring measures.
