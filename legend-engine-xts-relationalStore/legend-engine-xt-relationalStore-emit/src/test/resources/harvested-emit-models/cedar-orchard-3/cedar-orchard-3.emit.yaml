name: cedar-orchard-3
title: "Curator Registry - Relational Mapping, Filter and Group-By Service"
description: |
  An intermediate relational model over a museum curation registry. A Gallery
  and an Exhibit class are mapped onto a two-table H2 store through explicit
  primary keys and main-table aliases, with the exhibit-to-gallery link mapped
  over an inner join. A mapping testSuite projects exhibit columns, and a
  parameterized service filters exhibits by gallery wing and groups the
  survivors by material into per-material counts, both executed against
  embedded relational fixtures.
modelSources:
  model:
    root: cedar-orchard-3
    files:
      - test/cedarorchard3/connection/CuratorConnection.pure
      - test/cedarorchard3/data/CuratorTestData.pure
      - test/cedarorchard3/domain/Domain.pure
      - test/cedarorchard3/mapping/CuratorMapping.pure
      - test/cedarorchard3/runtime/CuratorRuntime.pure
      - test/cedarorchard3/service/MaterialTallyService.pure
      - test/cedarorchard3/store/CuratorDatabase.pure
features:
