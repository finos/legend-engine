name: ember-marsh-2
title: "Ember Marsh Register — Conditional Wetland Stewardship Notes Over A Six-Schema Reserve Store"
description: |
  A wetland reserve register whose single relational store spreads its tables
  across six schemas, declares six named filters built from a spread of dynamic
  predicate functions and defines two grouped inline views over its survey and
  calibration tables. Three composed mappings resolve transitively through two
  inclusions, so the outermost mapping binds classes and enumerations it never
  declares itself. Unit properties are reached through join paths of one, two
  and three forced-inner hops, through columns of a grouped view, through an
  embedded extent block that shares the parent table alias and identity,
  through a constant register name and through string and conditional
  expressions pushed into the store, including an eight-arm stewardship
  conditional whose else arm is an explicit null sentinel. Five enumeration
  transforms are applied to computed expressions rather than bare columns, one
  of which yields a source value outside the mapped enumeration set, and four
  mapping test suites project the register, the association-walked visit trail,
  the view-backed equipment readings and the filtered survey window.
