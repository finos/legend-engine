name: hazel-prairie
title: "Hazel Prairie - parameterised wildflower bloom services keyed by survey season"
description: |
  A wildflower-meadow survey corpus whose executable surface is two
  multi-execution services, each keyed on a survey-season path segment that
  selects between two runtime bindings over the same mapping, and each owned by
  a deployment identifier. Both queries open the bloom-count extent, reach the
  meadow region through a two-step property path (count to plot to meadow) and
  combine a membership test over a caller-supplied region collection with
  equality predicates on scalar string and date parameters. The roster projects
  a trimmed, upper-cased species label beside the meadow name and de-duplicates
  the pairs before sorting; the tally groups by meadow and a three-letter
  upper-cased species stem, summing stems and counting records. Fixtures cover
  region members and non-members, colour, observer and survey-day misses,
  duplicate pairs collapsed by the distinct, and two species whose shared stem
  merges them into one group, asserted under both execution keys.
