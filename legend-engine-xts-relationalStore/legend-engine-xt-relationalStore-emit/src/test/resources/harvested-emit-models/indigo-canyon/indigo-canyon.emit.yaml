name: indigo-canyon
title: "Indigo Canyon — Sliding Sky-Watch Windows With Post-Projection Predicates"
description: |
  An astronomy model in which two single-execution services publish a sliding
  recent-activity window over curated canyon sky-watch entries. Both compute their
  half-open range bounds from the current instant with date adjustment instead of taking
  request parameters, project the windowed extent to a named column list, and then apply a
  second predicate to the projected columns — an equality in one service and a two-armed
  disjunction in the other. The bound class reads a literal programme code and a
  null-guarded quality note out of one primary keyed observatory log table.

modelSources:
