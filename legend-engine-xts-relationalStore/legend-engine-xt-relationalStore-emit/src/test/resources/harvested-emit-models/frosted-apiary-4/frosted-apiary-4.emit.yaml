name: frosted-apiary-4
title: "Apiary Hive Register - Processing-Temporal Services Resolved At A Pinned Instant"
description: |
  A processing-temporal hive register served by three single-execution services
  that all resolve the register at a pinned instant rather than at a stored
  business date. The first restricts the register to a five-member forage-zone
  literal set and projects a nested strength band, the second keeps only hives
  whose optional queen tag was actually recorded and reads an audit note that the
  mapping defaults to a literal when the source column is absent, and the third
  binds two caller parameters into a prefixed forage label and a threshold band.
  Every service carries a test suite whose fixture includes a version whose
  processing window closed in the past, so the milestoning exclusion is asserted
  as well as the projections.
