name: crimson-glacier-2
title: "Rainfall Gauge Network — Joined Reading Register Behind Single and Multi Execution Services"
description: |
  A rainfall observation corpus in which every reading hangs off a gauge through
  a bidirectional association, so each query has to cross a relational join
  before it can filter or group. A single-execution service registers the
  readings visible at a caller-supplied instant: an optional region collection
  narrows the joined gauge, a rolling window measured backwards from that
  instant bounds the reading date, an unreviewed reading falls out on its empty
  quality flag, and the projection carries a three-armed intensity grade, the
  branched altitude band of the joined gauge and the day count separating the
  reading from a fixed review cut-off. A network-keyed multi-execution twin
  groups the same joined set by region and derived intensity, totalling
  millimetres and counting readings, so one query function is planned against
  two keyed execution stacks. Both services carry test suites over a shared
  relational fixture whose rows cover every intensity arm, an out-of-window
  reading and a reading with no quality flag at all.

