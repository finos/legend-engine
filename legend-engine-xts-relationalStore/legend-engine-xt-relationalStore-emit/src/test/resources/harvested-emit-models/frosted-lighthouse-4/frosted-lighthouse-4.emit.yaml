name: frosted-lighthouse-4
title: "Frosted Lighthouse Nursery Lots — Deeply Nested Service Query Bodies Planned Over One Anchoring Table"
description: |
  A plant-nursery propagation register. One flat, primitive-typed lot class is
  bound to a single anchoring table, and every declared feature is carried by
  the service query bodies rather than by the store: a deeply nested boolean
  predicate composing equality, set membership, a null-tolerant numeric test
  and a code-prefix fallback; a collection existence traversal over a
  caller-supplied stage collection; a sowing window derived by date arithmetic
  on the supplied date with elapsed-day and month-start columns; a window
  function numbering the graded lots within each glasshouse partition; and an
  unfiltered projection whose ungraded lot returns a null timestamp. Each
  service carries its own test suite and fixture, so plan generation is
  exercised and the generated plan is executed against rows covering the null
  and non-null cases of every optional column.
