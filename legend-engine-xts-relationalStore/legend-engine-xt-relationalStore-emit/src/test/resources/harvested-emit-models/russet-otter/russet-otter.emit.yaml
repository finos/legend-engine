name: russet-otter
title: "Russet Otter — bi-temporal holt-survey register pinned at a processing and a business date"
description: |
  A river-habitat model whose otter-holt survey visits are corrected over
  processing time and effective over business time, so every read has to pin
  both extents. One single-execution service resolves the bi-temporal extent at
  a pair of reference dates, drops the visits that recorded no observer or no
  habitat note, composes a survey reference from the reach code and the visit
  id, upper-cases the observer and publishes the five-column register
  de-duplicated and ordered. Its embedded test suite seeds a visit whose
  business window has closed and a visit whose processing window has been
  superseded alongside the in-range visits, so the temporal predicate is
  asserted end to end rather than merely compiled.

