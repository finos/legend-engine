name: cedar-fossil
title: "Cedar Fossil — Processing-Temporal Specimen Catalogue over an Included Registry Store"
description: |
  A palaeontology specimen catalogue whose store includes a separate registry
  store, so the catalogue joins reach the dig-site and bed tables defined
  elsewhere. The specimen table is processing-temporal and the catalogue also
  carries a grouped inline view over the preparation log and a named filter that
  trims unfinished preparation entries. The catalogue mapping includes a
  reference mapping for the registry classes, maps two enumerations from their
  stored codes, addresses every column through a qualified main table, resolves
  the site over one hop and the bed period over a two-hop path, serves the
  effort column from the inline view, and implements the site-to-bed association
  over the registry join. Three mapping test suites cover the enumerated and
  join-reached projection at a processing instant where every version is open,
  the same projection at an earlier instant where a later processing window is
  out of range, the association traversal on its own, and the filtered
  preparation log. Two connections over the same store carry a delegated
  Kerberos and a vault-referenced middle-tier credential, each bound by its own
  runtime.
