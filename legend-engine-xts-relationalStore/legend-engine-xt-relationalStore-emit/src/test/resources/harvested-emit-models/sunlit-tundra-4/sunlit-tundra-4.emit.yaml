name: sunlit-tundra-4
title: "Sunlit Tundra 4 — Eight-Arm Exposure Grading, Computed Enumeration Decodes and a Two-Surface Scan Union over a Filtered Plate Archive"
description: |
  A photographic plate archive whose relational mapping grades an exposure through an eight-arm
  conditional cascade closed by a null sentinel, decodes the photometric band and the seeing grade
  through enumeration mappings driven by computed expressions, stamps a constant archive-surface
  literal, composes a deep-exposure note with a string function and reaches the dome and ridge names
  across a single-hop join, all behind a store filter that keeps only archived plates. A second
  mapping includes that base and gathers the plate and spectrum relations behind the shared scan
  record through a union operation, so the record is queried polymorphically across both surfaces
  and its specialisations. A model-to-model mapping reproduces the same enumerations from
  still-textual eyepiece notes through bracketed conditional source expressions, and the domain
  classes carry instance-level constraints on their codes, exposures and rulings.
