name: teal-warren-2-relational
title: "Teal Warren — business-temporal colony monitoring with concatenated relational transforms and keyed as-of services"
description: |
  A wildlife-monitoring model over rabbit warren colonies versioned on a business timeline. The
  colony class carries a parameterised qualified property and a derived density tier delegating to a
  standalone function, while the relational mapping binds an aliased main table and builds two of its
  properties with relational string-concatenation transforms. A single-execution service answers the
  as-of query with a burrow threshold and carries the executed test suite; a multi-execution
  counterpart exposes the same query under one execution key per monitoring region. The mapping test
  suite and the service test suite both seed a fixture whose retired colony lies outside the queried
  business window.
modelSources:
  model:
    root: teal-warren-2-relational
    files:
