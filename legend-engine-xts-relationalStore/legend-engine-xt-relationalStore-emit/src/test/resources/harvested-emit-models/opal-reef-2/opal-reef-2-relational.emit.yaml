name: opal-reef-2-relational
title: "Intertidal Rock-Pool Survey — Compound-Filter Group-By Services with a Sort-Limit and an Environment-Keyed Multi-Execution"
description: |
  An intertidal survey EMIT model in which three services share one query
  shape: a compound predicate combining a species membership test with four
  equality comparisons, an aggregation grouping counted observations by species
  and shore zone, and an ordering. One service adds a single-row limit on the
  ordered aggregate, and one is a multi-execution service that selects its
  mapping-and-runtime binding from an environment key while reusing the same
  query body. Both single-execution services carry assertion-backed tabular
  test suites over a seeded rock-pool dataset.
modelSources:
