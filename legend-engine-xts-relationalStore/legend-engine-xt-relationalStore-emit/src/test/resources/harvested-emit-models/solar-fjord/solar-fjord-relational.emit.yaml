name: solar-fjord-relational
title: "Solar Fjord — Unioned Harvest Channels Behind a Multi-Execution Board"
description: |
  A non-financial kelp-farming model over a single-schema relational store with
  two harvest channels. An operation mapping unions a filtered line-harvest set
  implementation and a shore-gather set implementation, each reaching its farm
  site over its own inner join and deriving a grade label from nested string
  dyna functions alongside a literal channel marker. A multi-execution service
  keyed by fjord arm filters and projects the unioned lots, and the physical
  targets are redirected by a relational mapper post-processor on the governed
  connection.

