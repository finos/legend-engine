name: quiet-cavern-4
title: "Quiet Cavern — Milestoned Cave Passage Survey Services"
description: |
  A cave survey model whose processing-temporal passage register is published through two
  parameterised single-execution services owned by a deployment identifier. Both take a
  processing date in the path and a list of passage codes as a query parameter, keep the
  requested passages by membership, project a legacy tabular result and collapse duplicate
  rows. The access sheet downcasts passages to their flooded and crawl subtypes to read the
  sealing level and gate of the nested access rule, flags marker presence with conditional
  columns and falls back from an optional approach trail to the chamber label. The visit
  roster traverses a bitemporal visit association at the processing and business dates and
  continues to the leading team's members. Fixtures include a superseded passage version
  and visits outside the processing or business window.
