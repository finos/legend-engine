name: jade-lighthouse
title: "Jade Lighthouse — A Layered Relational Mapping Stack over a Bi-Temporal Coastal Aid Register"
description: |
  A coastal navigation-aid register whose store carries base tables, four derived
  views and named filters, and whose five mappings are chained by includes so a
  shared enumeration layer, a structure layer, a detail layer, a rule layer and a
  free-text note layer compile in order. Enumeration translations are driven by
  computed expressions on both the relational and the model-to-model side, class
  mappings route across two backing populations through a union operation, and the
  bi-temporal inspection extent resolves at an independent processing and business
  instant for both the mapping tests and the read service.
