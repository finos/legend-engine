name: ivory-cove
title: "Street Tree Inventory — Cross-Schema Store, Nested Joins and Literal Defaults"
description: |
  A municipal street-tree inventory whose plot class binds direct scalar,
  temporal, boolean and enum-typed columns alongside literal defaults, a
  one-hop measurement lookup and a two-hop borough lookup across two schemas of
  the same relational store. A store-level dynamic function normalises the
  status column inside the mapping filter, and the district class reaches its
  plots back through the same join so the to-many end is covered as well.
modelSources:
  model:
    root: ivory-cove
    files:
      - test/ivorycove/data/CanopyData.pure
      - test/ivorycove/domain/Canopy.pure
      - test/ivorycove/mapping/CanopyMapping.pure
      - test/ivorycove/store/CanopyDatabase.pure
