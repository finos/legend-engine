name: boreal-thicket-4
title: "Boreal Thicket — Point-In-Time Snow-Course Register Over Included Reference Mappings"
description: |
  A non-financial boreal snow-course survey over a business-milestoned stake
  table and three reference tables. The stake mapping includes three reference
  mappings, so stand, species and crew class mappings are resolvable without
  redeclaration, and the stake reaches its stand, tier and species context
  across joins whose miss leaves the reference columns null. Two
  single-execution services thread a milestoning instant into the stake
  traversal: one groups the surviving readings by stand and sums and counts
  their depths, the other projects the readings of one canopy tier in stake
  order. A mapping test asserts the included-mapping hops at an instant where
  one stake window has already closed.
