name: teal-prairie
title: "Prairie Seed Accessions — Locally Bound Temporal Points over a Wide Milestoned Aggregate"
description: |
  A prairie seed-vault accession service that opens its body with two local
  bindings of the current date, used separately as a business point and a
  processing point, and then aggregates accessions inside a parameterised
  event-date window. The grouping combines calendar decompositions of the event
  date, a four-level classification hierarchy read level by level, four
  business-temporal lookups and one bi-temporal lookup whose returned structures
  are read a further hop deep, with a duplicate-suppressing collection operator
  applied on top of the already fully keyed aggregation.
