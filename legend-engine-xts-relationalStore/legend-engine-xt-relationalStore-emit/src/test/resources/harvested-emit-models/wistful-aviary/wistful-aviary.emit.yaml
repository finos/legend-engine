name: wistful-aviary
title: "Bird Ringing Network — Business-Temporal Rollups over Milestoned Associations"
description: |
  A bird-ringing observation network whose rings and field observations are
  business-temporal, associated to one another and to their ringing site through
  milestoned associations. Three single-execution services aggregate and project
  point-in-time tabular results with collection-membership filters, conditional
  grouping keys and a rolling date window, so every query drives execution-plan
  generation over the milestoned join chain.

