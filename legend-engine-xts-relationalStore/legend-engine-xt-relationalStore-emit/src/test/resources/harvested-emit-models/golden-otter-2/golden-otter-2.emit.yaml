name: golden-otter-2
title: "Golden Otter 2 — glasshouse plant register across a garden and a volunteer store"
description: |
  A botanic-garden glasshouse register split over two relational stores. The
  garden store holds bed and accession tables in one schema, glasshouse and
  watering-rota tables in a second schema and a label view whose column is built
  by a store dyna function; a store filter keeps retired beds out of every read.
  The volunteer store holds volunteers and the badges they hold. Two mappings
  bind five classes: bed properties are derived with string-function transforms,
  one property is a mapping literal, two are table-alias columns reached across
  the schema boundary and one walks an inner two-hop path onto the watering rota,
  while an association gives bed-to-accession navigation a relational
  implementation. Four services read the two runtimes: an accession register that
  filters on a requested taxon collection and reduces with distinct, a sorted and
  limited bed inventory, a single-glasshouse rota projection and a sorted
  volunteer roster. Mapping test suites cover both mappings.
