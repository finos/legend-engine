name: crimson-canyon-m2m
title: "Crimson Canyon — Strata Layer Transform Service (M2M, Operation, Enumeration, Function, Relational Scaffolding)"
description: |
  A non-financial canyon-geology model exercising a broad grammar surface
  around a single-execution transform service. A `RockUnit` supertype is
  extended by a `StrataLayer` subclass that carries a `LayerStatus`
  enumeration property and a derived thickness band computed by a standalone
  `thicknessBand` function. The service is backed by the `LayerM2M`
  model-to-model mapping over a `JsonModelConnection` and carries an embedded
  test suite asserting the serialized transform result; the mapping carries its
  own test suite too. Alongside, a `LayerRelational` mapping binds the layer
  classes to a `CanyonDB` `Database` over a DB2 static/Kerberos
  `RelationalDatabaseConnection`, decoding `status_code` through an
  `EnumerationMapping` and composing north/south set implementations with a
  `union` `Operation` mapping. A single `EngineRuntime` wires the transform.

