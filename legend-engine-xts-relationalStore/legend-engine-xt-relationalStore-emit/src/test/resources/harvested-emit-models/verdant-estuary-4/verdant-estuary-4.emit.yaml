name: verdant-estuary-4
title: "Verdant Estuary 4 - A Union Of Two Survey Waves With Banded State Codes And A Closed Salinity Set"
description: |
  A saltmarsh reed register whose plot extent is assembled algebraically rather than read from
  one relation. Two relational class mappings bind the same table under their own explicit main-table
  alias, declared primary key and wave filter, and an operation mapping unions them, so instances of
  the plot class come from both survey waves of the register and each wave stamps its own literal
  wave label.

  Each wave translates the plot state code through an eight-arm conditional chain that ends in a
  null sentinel, so a plot whose state code falls outside the declared codes keeps every other
  column and loses only its band. The salinity property is typed by a closed enumeration and read
  through an enumeration mapping over the raw code column, so a plot whose code is outside the
  mapped set arrives with no band at all, and plots with no note take a literal default instead of
  an empty string. One mapping test walks all eight arms, the unclassed plot and the defaulted
  notes in a single projection over the unioned extent.
