name: eastern-warren-5
title: "Eastern Warren 5 — Keyed Multi-Execution Gauge Services Over A Derived Flow-Band Cascade"
description: |
  A catchment hydrometry model whose weight sits in the execution layer rather than the
  schema. Nothing about a reading's standing is stored: its flow band is decided by an
  eight-arm cascade over the recorded stage and, in the last arm, the recorded rainfall,
  falling through to a null sentinel when the channel is both low and dry, while the
  advisory note branches on the review state and the turbidity before falling through to a
  second null sentinel. A governance profile annotates the reading, zone and station
  classes with stereotypes and tagged values. One multi-execution service serves a single
  windowed roll-up body under two keyed environments that differ only in the runtime and
  connection they bind, so the routing rather than the query is what varies; two
  single-execution services project the whole derived register and total rainfall inside a
  window derived from the anchor date by date arithmetic before ordering and capping the
  result. Every service carries its own fixtures and assertions, and the register suite
  covers each arm of both cascades including both null fall-throughs.
