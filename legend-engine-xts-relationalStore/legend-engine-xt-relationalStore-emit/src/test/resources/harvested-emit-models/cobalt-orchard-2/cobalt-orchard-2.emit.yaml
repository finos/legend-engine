name: cobalt-orchard-2
title: "Community Orchard Register — Clock-Derived Count Services Across Two Keyed Estates"
description: |
  A community-orchard register whose two parallel record families - tree
  inspections keyed by identifier and sequence, graft records keyed by
  identifier alone - sit side by side in one schema at the same grain. Each
  family is bound by its own single-class relational mapping that declares a
  main-table alias and an explicit primary key and reads every property
  straight off a column. Four keyed services pair the same query with the
  production and rehearsal estates: two count the extent above a cutoff
  derived from the evaluation date by date adjustment inside a standalone
  function, two bound the extent between the start of the evaluation date and
  the evaluation instant, and all four aggregate to a named count under two
  grouping keys. A production-pinned counterpart carries the service tests, and
  both mappings carry their own extent suites so the composite key, the absent
  optional payload and the rows outside every window are asserted without
  depending on the clock.

