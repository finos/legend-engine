name: quiet-lighthouse-2
title: "Quiet Lighthouse Lamp Register — Processing-Milestoned Beacons, Sentinel Joins And A Model-To-Model Lamp Sheet"
description: |
  A lighthouse lamp register whose processing-milestoned beacon, coast section
  and alias tables are joined through composite inner joins that conjoin the
  key equality with an out-column sentinel test. Relational class mappings
  apply named store filters, a lens subtype mapping extends the beacon mapping
  with its own filter, a lamp mapping reads a filtered view, and three
  association mappings connect beacons to sections, aliases and fitted lamps
  one hop away. A model-to-model lamp sheet derives an eight-arm beam class
  with a null fallback, marking flags from filtered collections, and three
  enumerations from computed source expressions, and the published class
  exposes a parameterised qualified property consumed by the graph fetch.

