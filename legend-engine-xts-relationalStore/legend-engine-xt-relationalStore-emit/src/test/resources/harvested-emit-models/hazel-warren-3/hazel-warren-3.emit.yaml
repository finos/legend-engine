name: hazel-warren-3
title: "Allotment Warren - a joins-only store composition over two leaf stores, a branch-selecting property mapping and two keyed environment tallies"
description: |
  A community allotment register split so that no single store describes the whole picture: one leaf
  store owns the plots and their tending rota, a second leaf store owns the site and crop reference
  tables, and a third store declares no table at all - it includes both leaves and contributes only
  the three joins that relate them, so every column and every join side resolves through the
  composition. One mapping binds a three-property plot class directly against its main table under an
  explicit primary key and includes a second mapping that supplies the site, crop and
  composite-keyed tending implementations, which is what makes the association's far end and the
  reference classes resolvable at all. A second class implementation is computed rather than read:
  its grade band selects among eight arms with a null fallback, and its keeper, district, season,
  effort, freshness, curation and display columns are guarded expressions, join-reached columns, a
  nested selection, a literal default, a concatenation and a comparison against the current date.
  Three mapping tests pin those branches, the association whose far end is only included and the
  composite-keyed included implementation. Two multi-execution services keyed by environment share
  one deeply nested tabular predicate - an eight-arm disjunction over recognised field names and two
  guards comparing the sowing date to the current date - and differ only in whether the retired plots
  are dropped before the projection, so the pair shows exactly what the pre-projection predicate
  removes from the grouped and de-duplicated count.
