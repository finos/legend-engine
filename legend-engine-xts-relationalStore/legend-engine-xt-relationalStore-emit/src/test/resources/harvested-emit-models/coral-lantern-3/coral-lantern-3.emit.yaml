name: coral-lantern-3
title: Coral Lantern 3 Reef Hall Lighting
description: >
  A relational model in which a business-temporal display-tank register is resolved at an
  explicit point in time supplied as a service parameter, rolled up to the hall that holds each
  tank, and then joined inside the query body to a narrowed projection of the unmilestoned
  lantern-fitting inventory, so the plan has to combine a grouped aggregate with a second read
  rather than a single row-level select. A second service publishes the resolved tank extent as
  a plain projection, and both suites carry a tank closed before the requested instant so the
  milestoning filter is exercised rather than assumed.
