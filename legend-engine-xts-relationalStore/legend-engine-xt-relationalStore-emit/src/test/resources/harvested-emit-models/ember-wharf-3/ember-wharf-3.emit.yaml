name: ember-wharf-3
title: "Ember Wharf — Business-Temporal Berth Register Resolved At A Caller-Supplied Instant By A Point-In-Time Service"
description: |
  A coastal ferry wharf keeps its berth assignments effective over business time so that a
  re-berthing closes the window of the assignment it supersedes. One relational store carries
  the business-milestoned assignment table, one relational mapping binds the milestoned class
  with an explicit primary key and main table alias, and a single-execution service resolves
  the extent at a caller-supplied instant, keeps the named-vessel calls that reach a capacity
  floor and that either sit within the draught limit or carry a berthed call status, and
  projects five spaced display aliases. Assertion-backed coverage pins the extent both at a
  current instant and inside a closed business window so the out-of-range rows are visible.
