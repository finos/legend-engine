name: silver-reef-2
title: "Silver Reef 2 — Reef Survey Hub With Satellite Joins, A Category-Restricted Shared Code List And Enumeration-Decoded Condition Columns"
description: |
  A reef survey hub table joined out to two per-survey satellite tables and to a single
  shared code list that is reused for several unrelated code families, so every lookup join
  carries a literal category restriction and a bare key equality would return the wrong
  label. Two short code columns on the hub are decoded into enumerations through a
  trim-and-upper transform rather than read literally, and a derived label and a two-branch
  cover band are computed in the mapping. The suites graph-fetch and serialize the hub with
  its satellites nested, covering a survey that resolves everything, a survey whose code
  columns and satellites are all absent so the nested trees and labels serialize as null,
  and a survey whose code value exists only under a different category, and separately
  read the code list alone to show the composite category-and-value key keeping one code
  value distinct across two families.
modelSources:
