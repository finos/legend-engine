name: verdant-gecko-2-relational
title: "Tram Network Registry — Validity-Filtered Views, Association Join Paths, Wide Register Services"
description: |
  An advanced relational EMIT model over a tram network registry. One store
  holds eight base tables, each carrying a change-attribution column and a
  validity-window timestamp pair, and exposes one inline view per relation that
  projects a named column subset, promotes the surrogate identifier to the
  view's primary key and attaches a named validity filter, so every relation is
  read as a sub-select of currently valid rows only. The mapping binds every
  class to its view through a main-table alias and a single-column primary key
  and binds seven association ends to the joins declared between those views, so
  a projected column can require up to three chained ends before its value is
  reachable. Three single execution services publish wide flat registers off the
  count, stop and vehicle extents, and the mapping suites assert one surviving
  row each against fixtures holding superseded and filtered-out rows.
