name: ivory-marsh-2
title: "Wetland Boardwalk Estate — a section class gathered across three tables with collection-bounded, ordered and truncated registers"
description: |
  A wetland boardwalk estate model in which one boardwalk-section class is
  gathered across three relational tables — the section itself plus the reserve
  it crosses and the warden who holds it — so the mapping resolves attributes
  from neighbouring tables rather than a single main table. Three
  single-execution services expose the estate as tabular data sets and all of
  them are bounded by collection parameters: the section register narrows by a
  surface collection with a plank floor and a hazard ceiling before ordering and
  truncating the page; the inspection backlog keeps an inspection when its grade
  is in the requested collection or its defect tally passes a threshold, then
  orders by defect tally and truncates to a caller-supplied page size; and the
  hazard roster keeps every reserve when the reserve collection is left empty,
  holds sections at or above a hazard floor, and truncates to the sections a rota
  is called out for. Each service is exercised with deterministic relational
  fixtures and asserted against expected JSON, including the empty-collection
  path and the truncation path.

