name: maple-prairie
title: "Rocky-Shore Quadrat Cover — Service Relation with Subtype-Narrowed Recorder Columns"
description: |
  A rocky-shore quadrat survey whose polymorphic recorder hierarchy is mapped
  over a joined recorder table, so the accredited recorder columns are reached
  only by narrowing the subtype. A single-execution service guards the quadrats
  with a compound predicate combining a five-member shore-zone membership test
  and a tide-phase equality on the service parameter, then projects a
  twelve-column relation of direct, string and arithmetic derived columns.
modelSources:
  model:
    root: maple-prairie
    files:
      - test/mapleprairie/connection/ShoreH2Connection.pure
      - test/mapleprairie/domain/TidePoolDomain.pure
      - test/mapleprairie/mapping/ShoreQuadratMapping.pure
      - test/mapleprairie/runtime/TidePoolRuntime.pure
      - test/mapleprairie/service/QuadratCoverService.pure
      - test/mapleprairie/store/ShoreDatabase.pure
features:
