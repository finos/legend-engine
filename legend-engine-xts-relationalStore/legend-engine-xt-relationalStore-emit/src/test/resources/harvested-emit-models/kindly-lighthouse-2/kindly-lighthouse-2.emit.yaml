name: kindly-lighthouse-2
title: "Kindly Lighthouse 2 — Mountain Observatory Telescope Scheduling"
description: |
  A relational EMIT model for mountain observatory telescope scheduling. The model
  combines inherited temporal schedule entries with a cross-schema observatory path,
  a computed inline view label, and mapping assertions for active and expired slots.
modelSources:
  model:
    root: kindly-lighthouse-2
    files:
      - test/kindlylighthouse2/connection/ObservatoryConnection.pure
      - test/kindlylighthouse2/domain/ObservatoryDomain.pure
      - test/kindlylighthouse2/mapping/ObservatoryBaseMapping.pure
      - test/kindlylighthouse2/mapping/ObservatoryMapping.pure
      - test/kindlylighthouse2/profile/ObservatoryProfile.pure
      - test/kindlylighthouse2/runtime/ObservatoryRuntime.pure
      - test/kindlylighthouse2/store/ObservatoryStore.pure
