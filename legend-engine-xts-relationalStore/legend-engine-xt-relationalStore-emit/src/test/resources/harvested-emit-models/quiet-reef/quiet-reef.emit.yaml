name: quiet-reef
title: "Quiet Reef — an included relational mapping whose conditional, string-built and multi-hop transforms are proved row by row"
description: |
  A marine-park coral monitoring model. One store holds patches, reefs, zones,
  districts and dive surveys, a cross-table filter that keeps only the patches of
  an open reef, two grouped inline views — one tallying surveys, one banding cover
  by a store-side conditional — and joins chained up to three hops deep.
  A base mapping binds the reef, zone and district classes; the patch mapping
  includes it and derives its labels entirely by transform: an eight-armed tier
  chain with a fallback, a three-armed health chain with a fallback, a trail
  string concatenated from the one, two and three hop join paths with an untraced
  fallback, and a note arm that falls through to a null column. A single mapping
  suite asserts all ten kept rows so every arm, every hop and both views are hit.
