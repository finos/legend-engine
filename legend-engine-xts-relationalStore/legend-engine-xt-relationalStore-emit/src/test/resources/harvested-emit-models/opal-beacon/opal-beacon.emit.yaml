name: opal-beacon
title: "Opal Beacon — Bi-Temporal Star Catalogue with Four-Hop Coverage Associations, Keyed Multi-Executions and a Conditional Projection Column"
description: |
  A non-financial sky-survey catalogue whose beacon star records are bi-temporal,
  so every read pins both a business and a processing instant. Two associations
  reach the same observing-station extent from two different roots across a
  four-hop coverage chain whose link tables are gated by current-time join
  predicates, and an include-only mapping contributes nothing but those two
  association implementations. Two environment-keyed multi-execution services
  share one query body each: a shallow point-in-time roster and a deep pipeline
  whose projected coverage column branches into two traversals of different join
  depth before the tabular result is filtered again and de-duplicated.

