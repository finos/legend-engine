name: cobalt-cove-2-relational
title: "Cobalt Cove — Service Layer over Business- and Processing-Temporal Wildlife Monitoring"
description: |
  A service-centric coastal wildlife monitoring model in which every element of
  interest is a single-execution service. One service combines a set-membership
  test with an existence test over a to-many navigation on a business-temporal
  trail segment, one ranks trail cameras with a partitioned window function over
  a processing-temporal slice, and one collapses duplicate projected rows. Both
  milestoning windows therefore coexist across a single service set.
modelSources:
