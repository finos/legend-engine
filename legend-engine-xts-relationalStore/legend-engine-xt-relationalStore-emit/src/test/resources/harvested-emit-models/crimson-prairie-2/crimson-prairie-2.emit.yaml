name: crimson-prairie-2
title: "Crimson Prairie 2 - Bi-Temporal Extent Behind Conditional Transforms and Multi-Hop Join Paths"
description: |
  A range-management model whose single wide class is bound bi-temporally to a
  milestoned table under an explicit two-column identity that pairs the in-date
  with the entity key. Its transforms are conditional expressions over stored
  columns, null tests with materialised sentinels, a rounded numeric arm and
  marker codes reached over forced inner joins carrying literal conditions, while
  ancestry columns walk one, two and three hops through a denormalised tree.
  A point-in-time extract and a keyed multi-execution counterpart consume the
  computed columns.
