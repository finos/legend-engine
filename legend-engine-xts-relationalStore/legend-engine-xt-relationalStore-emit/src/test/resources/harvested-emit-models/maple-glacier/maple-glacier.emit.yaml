name: maple-glacier
title: "Glacier Mass-Balance Service — Date-Arithmetic Filter with a Relational Mapper Post-Processor Connection"
description: |
  A glacier-monitoring corpus over a single relational observation table.
  IceObservation carries a mass-balance reading, a baseline and a survey date,
  with derived net-change, severity and horizon-date properties. A
  single-execution service filters observations to a date-arithmetic window
  before a fixed reference date and projects the derived columns, asserted over
  an in-process H2 runtime; a mapping testSuite covers the derivations. A
  relational connection carries a mapper post-processor that rewrites schema and
  table names for lake execution.
