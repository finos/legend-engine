      - test/coppertundra3/mapping/CensusMapping.pure
      - test/coppertundra3/runtime/CensusRuntime.pure
      - test/coppertundra3/service/CensusHierarchyService.pure
      - test/coppertundra3/service/CensusRollupService.pure
      - test/coppertundra3/store/CensusDatabase.pure
