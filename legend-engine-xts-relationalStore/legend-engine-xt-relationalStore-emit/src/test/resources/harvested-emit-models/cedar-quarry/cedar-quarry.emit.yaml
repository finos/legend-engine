name: cedar-quarry
title: "Tree Nursery Propagation — Deep Conditional Derivations, Enum-of-Expression, Embedded Stewardship and Multi-Hop Joins"
description: |
  A tree-nursery propagation model whose seedling lots are derived from a
  two-schema relational store of beds, species, grafts, greenhouses, zones and
  propagation crews. One relational mapping reached through a mapping-include
  binds aliased main tables with explicit primary keys, decodes grades with a
  plain enumeration mapping and with three further enumeration mappings applied
  to computed expressions, folds height and care advice through nested
  conditional arms down to a null sentinel, composes labels with string
  functions, reaches the greenhouse and the propagation zone through two- and
  three-hop join paths, reads a grouped inline view for bed totals and projects
  an embedded stewardship stamp inline. Named store filters restrict beds and
  species, an association mapping binds bed-to-lot traversal onto the store
  join, and four mapping suites assert every conditional arm, the unmapped
  enumeration source value, the aggregated view and the graft register.
