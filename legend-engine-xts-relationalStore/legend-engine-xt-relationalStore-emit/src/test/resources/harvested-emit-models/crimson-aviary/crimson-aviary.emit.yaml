name: crimson-aviary
title: "Crimson Aviary — Point-in-Time Cohort Totals over a Milestoned Association"
description: |
  A bird-sanctuary cohort register whose single service threads one survey date
  through a business-temporal extent retrieval and through the milestoned
  enclosure association it traverses, so both ends of the traversal resolve at
  the same instant. The relation projection names its output columns
  independently of the properties behind them and the grouping collapses the
  projected rows to one total per species, enclosure and plumage stage.
