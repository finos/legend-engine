name: gilded-harbor-2-orchard
title: "Gilded Harbor 2 — Orchard Block Registry (inheritance, association implementation and a two hop keeper join across an included mapping)"
description: |
  An orchard planting registry built as a small inheritance hierarchy over milestoned relations. A profile
  declares two stereotypes and two tags that the classes and the association annotate themselves with, so the
  annotations carry registry meaning rather than decoration. A business-temporal planting spine holds the
  code, block, planting date and row count, and a grafted-block subtype extends it with cultivar, rootstock
  and canopy properties plus two keeper properties that are not columns of its own table. A second
  business-temporal class describes the nursery lot, and an association links lot and blocks bidirectionally.
  One store holds three tables — two of them business-date milestoned with an explicit infinity date, one
  plain keeper desk — and two named equality joins chained from block to lot to desk. A base mapping binds the
  lot with an explicit main-table alias and primary key, and the main mapping includes it, binds the subtype
  with inherited and declared properties resolved through the hierarchy, reaches both keeper properties over a
  two hop join path, and realises the association as a relational association implementation over the same
  named join. The test suite projects the register as of a growing date: one scenario proves every open block
  reaches its keeper across both hops and its lot across the association, and a second adds a block whose
  window closed before that date so the out-of-range row is filtered out.

