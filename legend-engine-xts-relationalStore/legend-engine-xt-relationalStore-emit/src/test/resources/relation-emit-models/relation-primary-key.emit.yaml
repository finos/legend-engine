name: relation-primary-key
title: "Relation Function Mapping — Explicit ~primaryKey (Relation Form)"
description: |
  Closes the relation-primary-key gap: the RELATION-form ~primaryKey — a colon
  followed by a bracketed list of bare column identifiers (grammar rule
  `primaryKey` in RelationFunctionMappingParserGrammar.g4), resolved at compile
  time against the ~func's RelationType. Two mappings over the shared Employee
  ~func exercise both the single-column (`~primaryKey: [ID]`) and composite
  (`~primaryKey: [ID, LAST_NAME]`) forms, each with a testSuite that projects and
  asserts. This is distinct from the relational `~primaryKey ([db]Table.COL)`
  form that relation-relational-union / relation-mixed-association-chain use on
  their relational set implementations.

modelSources:
  model:
    root: relation-primary-key
    files:
      - mapping/primaryKeyMapping.pure
  dependencies:
    - source: relation-shared-data.emit.yaml

features:
  - execution:data-element
  - execution:test-data
  - grammar:function
  - mapping:relation-primary-key
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
stores:
  - relational
complexity: intermediate
tags:
  - h2
  - mapping-test
  - relation
  - primary-key
