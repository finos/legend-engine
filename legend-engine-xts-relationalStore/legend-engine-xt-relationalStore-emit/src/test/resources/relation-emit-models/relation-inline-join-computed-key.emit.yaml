  - mapping:relation-filter-join
  - mapping:relation-inline-model-join
  - mapping:relation-navigation-join
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
  - scaffolding:relational-mapping
  - scaffolding:relational-store
  - store:relational-dyna-function
  - store:relational-nested-join
stores:
  - relational
complexity: intermediate
tags:
  - duckdb
  - mapping-test
  - relation
  - navigationjoin
  - filterjoin
