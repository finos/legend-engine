name: relation-inline-join-computed-key
title: "Relation Function Mapping — navigationJoin / filterJoin on a Column the Relation Computes"
description: |
  navigationJoin, filterJoin and modelJoin conditions that read a column the relation computes: a source key
  that falls back to a second column, a mixed-case computed key, and a target-side computed column. Single
  and chained joins, with ###Relational twins expecting the same rows.

modelSources:
  model:
    root: relation-inline-join-computed-key
    files:
      - store/joinComputedKeyDb.pure
      - data/joinComputedKeyData.pure
      - mapping/joinComputedKeyMapping.pure
      - mapping/relationalJoinComputedKeyMapping.pure

features:
  - execution:data-element
  - execution:graph-fetch
  - execution:test-data
