name: relation-inline-join-variant
title: "Relation Function Mapping — Variant Column of a Joined Relation Under filter, fold, map and a Join Inside the Lambda"
description: |
  A navigationJoin whose joined relation has a Variant column, read through get / toMany and then filtered
  (once with a second navigationJoin inside the filter lambda), folded or mapped.

modelSources:
  model:
    root: relation-inline-join-variant
    files:
      - store/joinVariantDb.pure
      - data/joinVariantData.pure
      - model/joinVariantModel.pure
      - mapping/joinVariantMapping.pure

features:
  - execution:data-element
  - execution:test-data
  - grammar:function
  - mapping:relation-navigation-join
  - mapping:relation-src
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
  - scaffolding:relational-store
  - store:relational-semistructured
stores:
  - relational
complexity: intermediate
tags:
  - duckdb
  - mapping-test
  - relation
  - navigationjoin
  - semi-structured
