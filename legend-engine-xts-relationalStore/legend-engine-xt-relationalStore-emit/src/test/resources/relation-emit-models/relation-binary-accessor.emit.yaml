name: relation-binary-accessor
title: "Relation Accessor over BINARY and VARBINARY Columns"
description: |
  A table with BINARY and VARBINARY columns, read directly through a relation
  accessor in a service query that names its runtime with from(). Compiling the
  accessor must give the binary columns a Pure type, and a test suite that gives
  the query its data runs it on H2, where the binary values come back as
  lowercase hex strings.

modelSources:
  model:
    root: relation-binary-accessor
    files:
      - store/db.pure
      - data/testData.pure
      - runtime/runtime.pure
      - service/binaryServices.pure

features:
  - execution:data-element
  - execution:plan-generation
  - execution:service
  - execution:service-test
  - execution:test-data
  - scaffolding:relational-connection
  - scaffolding:relational-store
  - scaffolding:runtime
stores:
  - relational
complexity: basic
tags:
  - h2
  - relation
  - service-test
