name: relation-class-mapping-extends
title: "Relation Function Mapping — Class Mappings That Extend a Parent Set"
description: |
  Relation class mappings that `extends` a parent set inherit its modelJoin, navigationJoin, filterJoin,
  plain, embedded and Inline property mappings, through a union leaf reached by `subType`, a union of leaves,
  a leaf queried directly and two levels of extends; a leaf that maps an inherited property itself reads its
  own mapping. Project, filter and graphFetch, with a ###Relational twin expecting the same rows.

modelSources:
  model:
    root: relation-class-mapping-extends
    files:
      - store/extendsDb.pure
      - data/extendsData.pure
      - model/extendsModel.pure
      - mapping/extendsMapping.pure
      - mapping/relationalExtendsMapping.pure

