name: relation-inline-join-filtered-target
title: "Relation Function Mapping — modelJoin onto a Filtered ###Relational Class Mapping"
description: |
  A Relation class mapping whose modelJoin property targets a ###Relational class mapping with a ~filter, non-temporal
  and processing-temporal: project, filter on the target, isEmpty, and graphFetch of a to-one target, a nested target
  and a to-many target, over a NULL key, a key with no match, a filtered-out target row and an expired target version.
  A ###Relational twin expects the same rows.

modelSources:
  model:
    root: relation-inline-join-filtered-target
    files:
      - store/filteredTargetDb.pure
      - data/filteredTargetData.pure
      - mapping/filteredTargetMapping.pure
      - mapping/relationalFilteredTargetMapping.pure

