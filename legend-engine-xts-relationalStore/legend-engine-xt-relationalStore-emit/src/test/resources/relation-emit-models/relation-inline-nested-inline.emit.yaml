name: relation-inline-nested-inline
title: "Relation Function Mapping — modelJoin Inside an Inline Target Nested in Another Inline Target, Under a Single and a Union Owner"
description: |
  Project, filter and graphFetch through a modelJoin declared in an `Inline [...]` target reached through
  another `Inline [...]` property, owned by a single class mapping or by each branch of a union.
  ###Relational twins expect the same rows.

modelSources:
  model:
    root: relation-inline-nested-inline
    files:
      - store/nestedInlineDb.pure
      - data/nestedInlineData.pure
      - model/nestedInlineModel.pure
      - mapping/nestedInlineMapping.pure
      - mapping/relationalNestedInlineMapping.pure

features:
  - execution:data-element
  - execution:graph-fetch
  - execution:test-data
  - grammar:function
  - mapping:operation-mapping
  - mapping:relation-inline-embedded
  - mapping:relation-inline-model-join
  - mapping:relation-src
  - mapping:relation-union
  - mapping:relational-embedded
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
  - scaffolding:relational-mapping
  - scaffolding:relational-store
  - store:relational-filter
stores:
  - relational
complexity: advanced
tags:
  - duckdb
  - h2
  - mapping-test
  - relation
  - inline
  - union
  - modeljoin
