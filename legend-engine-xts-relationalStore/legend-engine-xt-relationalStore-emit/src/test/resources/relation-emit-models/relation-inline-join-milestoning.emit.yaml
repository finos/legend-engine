name: relation-inline-join-milestoning
title: "Relation Function Mapping — Milestoned navigationJoin / filterJoin Targets"
description: |
  Processing-, business- and bi-temporal classes whose navigationJoin / filterJoin properties read milestoned
  tables, queried at %latest and at a point in time: each hop of a chain, the gate of a filterJoin and
  accessors nested inside a target expression. A ###Relational twin expects the same rows.

modelSources:
  model:
    root: relation-inline-join-milestoning
    files:
      - store/joinMilestoningDb.pure
      - data/joinMilestoningData.pure
      - mapping/joinMilestoningMapping.pure
      - mapping/relationalJoinMilestoningMapping.pure

features:
  - execution:data-element
  - execution:test-data
  - grammar:function
  - mapping:relation-filter-join
  - mapping:relation-navigation-join
  - mapping:relation-src
  - milestoning:bi-temporal
  - milestoning:business-temporal
  - milestoning:point-in-time-query
  - milestoning:processing-temporal
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
  - scaffolding:relational-store
  - store:relational-nested-join
stores:
  - relational
complexity: advanced
tags:
  - duckdb
  - mapping-test
  - relation
  - navigationjoin
  - filterjoin
  - milestoning
  - bitemporal
