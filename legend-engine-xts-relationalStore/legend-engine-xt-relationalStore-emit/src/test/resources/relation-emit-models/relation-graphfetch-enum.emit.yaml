name: relation-graphfetch-enum
title: "Relation Function Mapping — graphFetch of To-Many Enum Properties Decoded by an EnumerationMapping"
description: |
  graphFetch of to-many enum properties decoded by an EnumerationMapping: over a local column, over a
  navigationJoin and over a filtered navigationJoin inside an embedded block, fetched alone and with a
  to-one enum over the same column. A ###Relational twin expects the same rows.

modelSources:
