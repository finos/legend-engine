name: relation-inline-embedded-model-join
title: "Relation Function Mapping — modelJoin Inside Inline and Embedded Sets, Under a Single and a Union Owner"
description: |
  Project, filter and graphFetch through a modelJoin declared inside an embedded set: the target class mapping
  of an `Inline [...]` property owned by a single class mapping or by each branch of a union, and a directly
  embedded set owned by each branch of a union; also an inline modelJoin to a processing-milestoned class at a
  point in time. ###Relational twins expect the same rows.

modelSources:
  model:
    root: relation-inline-embedded-model-join
    files:
      - store/inlineEmbeddedJoinDb.pure
      - data/inlineEmbeddedJoinData.pure
      - model/inlineEmbeddedJoinModel.pure
      - mapping/inlineEmbeddedJoinMapping.pure
      - mapping/relationalInlineEmbeddedJoinMapping.pure

