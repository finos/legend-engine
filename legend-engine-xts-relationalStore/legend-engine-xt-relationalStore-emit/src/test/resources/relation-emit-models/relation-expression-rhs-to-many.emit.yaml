name: relation-expression-rhs-to-many
title: "Relation Function Mapping — Expression RHS on To-Many Primitive Properties"
description: |
  To-many String and StrictDate properties mapped with $row expressions that carry a literal or a type
  argument: cast(@String), substring(0, 1), an if() over two string literals and datePart()->cast(@StrictDate),
  fetched by graphFetch and projected. A ###Relational twin expects the same rows.

modelSources:
  model:
    root: relation-expression-rhs-to-many
    files:
      - mapping/toManyExprMapping.pure   # ###Pure (EmployeeLabels class, employees func) + ###Mapping + testSuites
      - mapping/relationalToManyExprMapping.pure   # ###Mapping twin over the same table + testSuites
  dependencies:
    - source: relation-shared-data.emit.yaml

features:
  - execution:data-element
  - execution:graph-fetch
  - execution:test-data
  - grammar:function
  - mapping:relation-expression-rhs
  - query:to-many-projection
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
  - scaffolding:relational-mapping
stores:
  - relational
complexity: intermediate
tags:
  - h2
  - mapping-test
  - relation
  - expression-rhs
  - graph-fetch
