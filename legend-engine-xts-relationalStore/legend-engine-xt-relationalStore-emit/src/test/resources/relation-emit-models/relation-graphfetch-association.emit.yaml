name: relation-graphfetch-association
title: "Relation Function Mapping — Graph Fetch Across Associations (XStore, ModelJoin, Mixed Relational)"
description: |
  Graph fetch through the Employment association between Relation (~func) mapped Employee
  and Firm. With an XStore association: a to-one child (Employee.employer), a to-many child
  (Firm.employees, including a firm with no employees) and a three-level chain back to the
  root type (Firm -> employees -> employer). The same to-many fetch through a ModelJoin
  association. And across the Relation/Relational store-type boundary, with Employee mapped
  classic Relational and Firm via ~func: a Relation root with a Relational child and a
  Relational root with a Relation child. Verifies that cross-set child fetches are planned
  and stitched back to their parents whichever side of the association is relation-mapped.

modelSources:
  model:
    root: relation-graphfetch-association
    files:
      - mapping/associationGraphFetchMapping.pure   # ###Mapping: XStore, ModelJoin and mixed Relational/Relation mappings with graph-fetch testSuites
      - data/testData.pure
  dependencies:
    - source: relation-shared-data.emit.yaml

features:
  - execution:data-element
  - execution:graph-fetch
  - execution:test-data
  - grammar:nested-association
  - mapping:relation-local-property
  - mapping:relation-model-join
  - mapping:relation-xstore-association
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
  - scaffolding:relational-mapping
stores:
  - relational
complexity: intermediate
tags:
  - h2
  - mapping-test
  - relation
  - graph-fetch
  - association
  - xstore
  - modeljoin
  - mixed-mapping
