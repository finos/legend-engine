name: relation-inline-join
title: "Relation Function Mapping — Inline Join Property Forms (navigationJoin / filterJoin / inline modelJoin)"
description: |
  End-to-end (SQL pushdown) coverage for the INLINE relation mapping join property
  forms: `$src->navigationJoin(rel(), {..}).COL` (keeps the
  RIGHT/target column), `$src->filterJoin(rel(), {..}).COL` (keeps the LEFT/source
  column, inner-join-gated), and the inline `modelJoin({e, f | $e.firmId == $f.id})`
  class navigation property. This is distinct from relation-modelJoin, which uses the
  `ModelJoin` association-block form; here the same model-level join condition (over the
  two classes' properties, not the relation columns) is carried INLINE on the property. The
  employee mapping's `~src` is an inline store accessor (`#>{db.table}#`); the firm mapping's
  calls a relation function. Reuses the shared EmployeeDB store + EmployeeFirmData
  (Alice→Acme, Bob→Beta).

modelSources:
  model:
    root: relation-inline-join
    files:
      - mapping/inlineJoinMapping.pure   # ###Pure (firmsRel) + ###Mapping (~src accessor and ~src function call) with inline nav/filter/modelJoin + testSuites
  dependencies:
    - source: relation-shared-data.emit.yaml

features:
  - execution:data-element
  - execution:test-data
  - grammar:function
  - mapping:relation-filter-join
  - mapping:relation-inline-model-join
  - mapping:relation-navigation-join
  - mapping:relation-src
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
stores:
  - relational
complexity: intermediate
tags:
  - duckdb
  - mapping-test
  - relation
  - navigationjoin
  - filterjoin
  - modeljoin
