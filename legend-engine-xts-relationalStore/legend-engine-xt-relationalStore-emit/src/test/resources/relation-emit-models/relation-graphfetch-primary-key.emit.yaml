name: relation-graphfetch-primary-key
title: "Relation Function Mapping — Graph Fetch With Explicit Single and Composite Primary Keys"
description: |
  Graph fetch over Relation (~func) class mappings that declare their identity explicitly:
  Employee with a single-column `~primaryKey: ID` and Firm with a composite
  `~primaryKey: [ID, LEGAL_NAME]`, linked by an XStore association. Each root is fetched with
  a nested child across the association, so the declared key is what the graph-fetch plan
  uses to identify root rows and to stitch the child objects back onto their parents.

modelSources:
  model:
    root: relation-graphfetch-primary-key
    files:
      - mapping/primaryKeyGraphFetchMapping.pure   # ###Mapping with single and composite ~primaryKey + graph-fetch testSuites
  dependencies:
    - source: relation-shared-data.emit.yaml

features:
  - execution:data-element
  - execution:graph-fetch
  - execution:test-data
  - mapping:relation-local-property
  - mapping:relation-primary-key
  - mapping:relation-xstore-association
  - scaffolding:class
  - scaffolding:relation-function
  - scaffolding:relation-mapping
stores:
  - relational
complexity: basic
tags:
  - h2
  - mapping-test
  - relation
  - graph-fetch
  - primary-key
