name: relational-dyna-function
title: "Relational Store — Dynamic Functions in Store Definition"
description: |
  Closes store:relational-dyna-function. ProductView defines two columns with
  dynamic functions in the store: concat('P-', NAME) builds a string label and
  plus(QTY, PRICE) sums two numeric columns. The Product class maps those computed
  columns, so the test query proves the dynamic-function operations translate to
  SQL and execute on H2. A View is the vehicle, so store:relational-inline-view is
  incidentally exercised too.

modelSources:
  model:
    root: relational-dyna-function
    files:
      - store/db.pure
      - mapping/mapping.pure
      - data/testData.pure

features:
  - execution:data-element
  - execution:test-data
  - scaffolding:class
  - scaffolding:relational-mapping
  - scaffolding:relational-store
  - store:relational-dyna-function
  - store:relational-inline-view
stores:
  - relational
complexity: basic
tags:
  - h2
  - dyna-function
  - view
