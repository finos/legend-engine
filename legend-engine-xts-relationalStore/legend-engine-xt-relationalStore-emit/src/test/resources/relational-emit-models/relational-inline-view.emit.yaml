name: relational-inline-view
title: "Relational Store — Inline View"
description: |
  Closes store:relational-inline-view. The BigSaleView is an inline view (subquery)
  defined in the store over SALE_TABLE and restricted by a Filter to rows with
  AMOUNT >= 100. The BigSale class mapping targets the view rather than the base
  table, so the test query reads through the view and the sub-threshold row is
  excluded — proving a class mapped to a store View resolves end-to-end.

modelSources:
  model:
    root: relational-inline-view
    files:
      - store/db.pure
      - mapping/mapping.pure
      - data/testData.pure

features:
  - execution:data-element
  - execution:test-data
  - scaffolding:class
  - scaffolding:relational-mapping
  - scaffolding:relational-store
  - store:relational-inline-view
stores:
  - relational
complexity: basic
tags:
  - h2
  - inline-view
  - view
