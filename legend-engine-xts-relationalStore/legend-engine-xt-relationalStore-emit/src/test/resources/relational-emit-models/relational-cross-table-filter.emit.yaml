name: relational-cross-table-filter
title: "Relational Store — Cross-Table Filter"
description: |
  Closes store:relational-cross-table-filter. The Employee class mapping applies
  NycDeptFilter through the Emp_Dept join
  (~filter [db]@Emp_Dept | [db]NycDeptFilter). The filter predicate is on a column
  of DEPARTMENT — a different table than the mapped EMPLOYEE — reached via the
  join, so only employees whose department is in NYC survive. This is distinct
  from relational-filter, whose predicate is on the mapped table itself.

modelSources:
  model:
    root: relational-cross-table-filter
    files:
      - mapping/crossTableFilterMapping.pure
      - data/testData.pure
  dependencies:
    - source: relational-shared-joins.emit.yaml

features:
  - execution:data-element
  - execution:test-data
  - scaffolding:class
  - scaffolding:relational-mapping
  - scaffolding:relational-store
  - store:relational-cross-table-filter
  - store:relational-inner-join
stores:
  - relational
complexity: intermediate
tags:
  - h2
  - cross-table-filter
  - filter
  - join
  - shared-store
