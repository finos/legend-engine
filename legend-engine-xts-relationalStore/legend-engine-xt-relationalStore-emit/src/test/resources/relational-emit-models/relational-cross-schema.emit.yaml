name: relational-cross-schema
title: "Relational Store — Cross-Schema Join"
description: |
  Closes store:relational-cross-schema. Sale (mapped to the SALES.SALE table) has
  a seller property realised through the Emp_Sale join, which crosses from the
  SALES schema to the HR.EMPLOYEE table in the shared two-schema JoinsDB store.
  The test query projects each sale's seller name alongside its amount, proving a
  join whose two sides live in different schemas resolves end-to-end.

modelSources:
  model:
    root: relational-cross-schema
    files:
      - mapping/crossSchemaMapping.pure
      - data/testData.pure
  dependencies:
    - source: relational-shared-joins.emit.yaml

features:
  - execution:data-element
  - execution:test-data
  - grammar:association
  - scaffolding:class
  - scaffolding:relational-mapping
  - scaffolding:relational-store
  - store:relational-cross-schema
  - store:relational-inner-join
stores:
  - relational
complexity: intermediate
tags:
  - h2
  - cross-schema
  - join
  - shared-store
