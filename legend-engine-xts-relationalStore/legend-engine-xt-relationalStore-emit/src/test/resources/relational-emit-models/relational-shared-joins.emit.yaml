name: relational-shared-joins
title: "Shared Two-Schema Store + Domain for Relational Join EMIT Models"
description: |
  A reusable bundle for the relational store-feature EMIT models: an Employee /
  Department / Sale domain plus a two-schema H2 store (demo::store::JoinsDB) with
  HR (EMPLOYEE, DEPARTMENT) and SALES (SALE) schemas, an intra-schema Emp_Dept
  join, and a cross-schema Emp_Sale join. Declares no mapping or runtime; consuming
  models layer those on via the EMIT dependencies mechanism. Its own EMIT run only
  exercises parse + compile.

modelSources:
  model:
    root: relational-shared-joins
    files:
      - model/domain.pure
      - store/joinsDb.pure

features:
  - grammar:association
  - scaffolding:class
  - scaffolding:relational-store
  - store:relational-cross-schema
  - store:relational-inner-join
  - store:relational-multi-table
stores:
  - relational
complexity: basic
tags:
  - h2
  - shared-store
  - shared-domain
  - multi-schema
  - join
