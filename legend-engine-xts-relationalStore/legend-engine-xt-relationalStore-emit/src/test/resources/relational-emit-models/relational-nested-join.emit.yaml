name: relational-nested-join
title: "Relational Store — Nested (Chained) Join"
description: |
  Closes store:relational-nested-join. The query navigates two associations in a
  single expression — Sale.seller.department.name — so the engine chains the
  Emp_Sale join (SALES.SALE -> HR.EMPLOYEE) into the Emp_Dept join
  (HR.EMPLOYEE -> HR.DEPARTMENT), producing a nested join in the generated SQL.
  The Emp_Sale leg also crosses the SALES/HR schema boundary, so the chain
  exercises a cross-schema hop as well.

modelSources:
  model:
    root: relational-nested-join
    files:
      - mapping/nestedJoinMapping.pure
      - data/testData.pure
  dependencies:
    - source: relational-shared-joins.emit.yaml

features:
  - execution:data-element
  - execution:test-data
  - grammar:association
  - grammar:nested-association
  - scaffolding:class
  - scaffolding:relational-mapping
  - scaffolding:relational-store
  - store:relational-cross-schema
  - store:relational-inner-join
  - store:relational-nested-join
stores:
  - relational
complexity: intermediate
tags:
  - h2
  - nested-join
  - chained-join
  - join
  - shared-store
