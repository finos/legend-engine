name: relational-semistructured-model-chain-typename
title: "typeName() in a Model-to-Model Mapping Whose Lambda Reuses the Query's Parameter Name"
description: |
  A model-to-model mapping reads a typed JSON document through a ModelChainConnection and exposes the
  runtime type of each element of an embedded array with `map(x | $x->toOne()->typeName())`. The query
  that reads the property names its own lambda parameter x as well.

  The mapping expression is routed while the query's x is still in scope. The inner x iterates a JSON
  array, so there is no mapping set for it to bind to and it must resolve to the array element rather
  than to the query's x. Resolving it to the query's x wraps the element in the query's routed set,
  typeName() then no longer takes its semi-structured path and falls back to genericType(), which has
  no SQL translation.


