name: dusky-willow
title: "Dusky Willow — Community tool-lending slips resolved by a model-to-model mapping (enumeration mappings, derived properties, a reusable data element and a graph-fetch service)"
description: |
  A community tool-lending library where the counter volunteers write slips in
  free text and everything downstream reads a resolved digest instead. The raw
  slip class carries the library's arithmetic as derived properties — a
  normalised reference, an overdue remainder measured against the fourteen-day
  allowance, a three-way deposit band that also covers the slip with no deposit at
  all, and a nested handling index — and the model-to-model mapping consumes
  those derived properties rather than repeating them. The coppice state and the
  tool bench arrive as free text and leave as enumerated members through two
  enumeration mappings, each with a fall-through arm for wording the vocabulary
  never anticipated. The digest class inherits its reference and desk from a
  constrained abstract library record, is shelved through an association onto
  the shelf bays, and is asserted twice: once in the mapping's own test suite
  over every vocabulary arm and deposit band, and once through a graph-fetch
  service whose fixture is a reusable data element referenced by the test rather
  than inlined, run twice against two different handling floors.

