name: verdant-isle
title: "Reading Room Cards — Self-Contained Model-To-Model Service Over A Nested Document"
description: |
  A store-less library corpus that bridges a decorated inbound reservation-card document
  onto a clean two-class target tree inside a single model-to-model mapping, splitting one
  text property into two target properties by explicit string surgery and handing the
  optional nested element to a second class mapping identified by name. The service carries
  no packageable runtime or connection at all: its execution embeds the runtime inline with
  a document-parsing model-store connection, and its checked graph fetch pins parsing,
  renaming and splitting in one assertion.
modelSources:
  model:
    root: verdant-isle
    files:
      - test/verdantisle/domain/ReadingCardDomain.pure
      - test/verdantisle/mapping/CardMapping.pure
      - test/verdantisle/service/ReadingCards.pure
      - test/verdantisle/source/CardDocument.pure
