name: olive-quarry-2
title: "Olive Quarry - a store-less heritage quarry dispatch feed transformed model-to-model through shared enumeration mappings, nested class mappings and router unions"
description: |
  A heritage stone quarry. Every cut block leaves with a JSON dispatch document carrying an optional block
  code, free-text grade and finish, a mass, a nested quarry-site element and a list of painted marking tags.
  A mapping holding only enumeration mappings is included by two model-to-model mappings: the dispatch
  mapping builds the published stone block with a computed label, an eight-arm mass band with an absent
  fallback, grade and finish values computed from the source text before the shared enumeration lookup
  (an unknown grade is filtered out rather than mapped), a nested location class mapping over the site
  element and identifiers unioned from a legacy and a live-tag class mapping; the review mapping builds a
  conservation review whose notes are unioned from a mass and a grade class mapping. Four services embed
  their runtime with a JSON model connection, graph-fetch and serialize trees of two levels, and declare
  deployment-identifier or user-list ownership with JSON equality test suites.
