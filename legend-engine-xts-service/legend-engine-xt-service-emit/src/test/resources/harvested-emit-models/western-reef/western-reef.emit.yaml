name: western-reef
title: "Western Reef — Banded Reef-Survey Graph Transforms with Embedded-Runtime Graph-Fetch Services"
description: |
  A coral-reef monitoring corpus built entirely from model-to-model transforms.
  An inbound survey record is banded by a nine-arm conditional over its optional
  bleached fraction, its optional reef zone is coerced from an enumeration to a
  text label under an emptiness guard, and its site and observer graphs are
  projected by chained references to other class mappings inside the same mapping
  element. A second mapping flattens the site block into a digest. Two
  single-execution services fetch and serialise those object graphs as nested
  documents, each embedding its runtime and its document-parsing model-store
  connection inline rather than referencing packageable elements.

modelSources:
