name: ivory-beacon-m2m
title: "Glacier Station Feed — Instance-to-Instance Projection with Graph-Fetch Serialisation"
description: |
  A store-less glacier-monitoring model whose whole computation lives in property
  expressions: two instance-to-instance mappings project a text-heavy inbound
  station report onto five target classes, one flat and one nested two levels
  deep, with every optional source branch guarded by a present-or-sentinel
  conditional and several narrowed to a source subtype on the way. Both flows are
  graph-fetch-and-serialise pipelines rather than tabular projections — one
  inlined in a service body with a reading-count parameter, the other owned by a
  packageable function that binds mapping and runtime itself and is delegated to
  by the second service.

