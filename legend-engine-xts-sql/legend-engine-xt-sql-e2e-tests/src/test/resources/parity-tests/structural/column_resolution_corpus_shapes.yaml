# Column resolution when a join is combined with grouping, windowing or ordering.
#
# WHY THIS FILE EXISTS, SEPARATELY FROM column_resolution_across_renames.yaml
#
# That file covers two specific defects, and every sort or grouping key in it is a bare column
# reference. This file covers the neighbouring space that leaves untested: keys that are
# *expressions*, keys that reach across a derived table's scope boundary, wildcard projections
# over a join, and explicit null ordering. Those all interact with the same machinery -- the
# join-alias suffixing in processDuplicateRenames, the rename bookkeeping in
# SqlTransformContext.aliases, and the extension columns processProjection synthesises for
# keys that are not plain column references -- but they exercise different paths through it.
#
# The organising principle is one case per distinct shape, plus a control that isolates each
# variable. Sections are grouped by where the key sits: inside a window, in a GROUP BY, in a
# statement-level ORDER BY, or across a subquery boundary.
#
# INPUT SQL IS PLAIN POSTGRESQL
#
# Every statement here is written as a PostgreSQL author would write it, and is validated
# against PostgreSQL by the harness before Legend ever sees it. Nothing is transcribed from the
# output of a tool that targets Legend: the binding under test is upstream of every SQL producer
# that feeds it, so taking its test inputs from one would make the suite circular.
#
# That is why null ordering appears as NULLS FIRST/LAST in section G1a. It is also common for a
# SQL producer to emulate null ordering with a leading `CASE WHEN col IS NULL THEN 1 ELSE 0 END`
# sort key, because the binding currently asserts nullOrdering == UNDEFINED and rejects the
# clause outright. Section G1b covers that spelling independently -- it is ordinary PostgreSQL in
# its own right, and once the clause is supported natively we still need to know whether the
# hand-written equivalent works. Neither section is derived from the other; both must hold.
#
# EXPECTED STATUSES ARE RECORDED FROM A RUN, NOT ASPIRATIONAL
#
# A case that is broken today says ERROR (or FAIL) rather than PASS, so the suite stays green
# and the harness's fix-detection flags each case for promotion as the corresponding defect is
# fixed. Do not "correct" a status to PASS by hand: change the code, re-run, and let the run
# move it. A case that starts passing is the signal this file exists to produce.
#
# Three distinctions are worth keeping straight when reading a failure here, because they point
# at different code and must not be taken as evidence about each other:
#
#   1. "The column 'X' can't be found in the relation (...)" is a COMPILE error from the
#      relation type-checker. It has no TDS counterpart, because TDS carries column names as
#      opaque strings and never checks them at compile time.
#
#      Where the message shows a suffixed name being looked up while the relation lists the
#      same expression unsuffixed -- e.g. asking for COALESCE(salary_p, 0) when the relation
#      has COALESCE(salary, 0) -- the extension column was created, just under a name derived
#      through a different context than the one the key lookup uses. processExtend calls
#      processSelectItems with useContextForNameResolve = false, so a synthesised key (which
#      carries no alias) is named without the alias map, while the key lookup resolves through
#      it. Single-table cases pass because the two spellings coincide when there is no suffix.
#
#   2. "Bad value for type <t> : <value>" means the query COMPILED and then mis-read a column
#      at execution. That is an execution-path concern, not name resolution.
#
#   3. A FAIL (rather than ERROR) means the query executed and returned the wrong rows. The
#      known cause here is a groupBy whose declared output type lost a key column while the
#      emitted ColSpecArray still grouped by it, so the caller read a result set of the wrong
#      shape. Wrong rows outrank every error above them.
#
# UNTESTED in the generated report maps to ERROR here: the harness has no UNTESTED status,
# it is a presentation rollup of an ERROR whose category is UNSUPPORTED_SYNTAX.
#
# NULL PLACEMENT IN THE FIXTURE (parity-tests/schema.yaml), for reading the cases below:
#   persons: Grace(7) age=NULL dept_id=NULL; Hank(8) salary=NULL active=NULL; Ivy(9) hire_date=NULL
#   strings: nullable_val NULL at ids 3 and 7
#   departments, orders: no NULLs
# So `PARTITION BY p.dept_id ORDER BY p.salary ...` puts a NULL inside multi-row partition 1,
# and `... ORDER BY p.hire_date ...` puts one inside partition 2. An INNER JOIN on dept_id
# drops Grace; a LEFT JOIN keeps her in a NULL partition of her own.
#
# Postgres defaults, for judging which cases are semantically load-bearing:
#   ASC  => NULLS LAST      DESC => NULLS FIRST
# so `ASC NULLS FIRST` and `DESC NULLS LAST` are the forms that change row order.
#
# Every case carries a total ORDER BY so the row-by-row comparison against Postgres is
# deterministic. Where a projection repeats a value, enough ordinals are added to break ties.

tests:

  # ==========================================================================
  # G1a. NULLS FIRST / LAST inside a window's ORDER BY, over a join
  #
  # The binding asserts nullOrdering == UNDEFINED and rejects the clause, so
  # these cannot be parsed today. No test anywhere else in this suite pairs
  # explicit null ordering with a window or a join -- the only NULLS FIRST/LAST
  # cases are single-table and statement-level (structural/order_limit_offset.yaml).
  # When the clause is supported, these are what say whether it works where a
  # window's own sort keys are resolved, not just at statement level.
  #
  # A note for whoever implements it: desugaring NULLS LAST into a CASE key in
  # the SQL AST, above the existing translation, makes these cases behave
  # exactly like G1b. If G1b is red and G1a is green, the implementation is
  # materialising the guard itself; if both are red, it is desugaring.
  # ==========================================================================

  - id: crcs_g1a_win_order_desc_nulls_last_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.salary DESC NULLS LAST) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY ... DESC NULLS LAST over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_order_asc_nulls_first_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.salary ASC NULLS FIRST) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY ... ASC NULLS FIRST over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_order_asc_nulls_last_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, RANK() OVER (PARTITION BY p.dept_id ORDER BY p.hire_date ASC NULLS LAST) AS rk FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY ... ASC NULLS LAST over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_order_desc_nulls_first_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, RANK() OVER (PARTITION BY p.dept_id ORDER BY p.hire_date DESC NULLS FIRST) AS rk FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY ... DESC NULLS FIRST over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # Multi-key window sorts are permitted only on the Relation path -- see the
  # unsupported() guard on $window.orderBy->size() in processWindowSingleColumn --
  # so the TDS column cannot cover this shape at all.
  - id: crcs_g1a_win_order_nulls_last_then_plain_key
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.salary DESC NULLS LAST, p.name ASC) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY with a null-ordered key plus a plain key, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_order_two_null_ordered_keys
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.hire_date ASC NULLS FIRST, p.salary DESC NULLS LAST) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY with two null-ordered keys, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_order_three_keys_mixed_null_ordering
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.active DESC NULLS LAST, p.salary DESC NULLS LAST, p.name ASC) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY with three keys and mixed null ordering, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # The null-ordered key is drawn from the right-hand side of the join, so its
  # physical name carries that side's suffix rather than the driving table's.
  - id: crcs_g1a_win_order_nulls_last_key_from_right_side
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY d.budget DESC NULLS LAST, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY null-ordered key from the right join side"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_partition_right_order_left_nulls_last
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY d.id ORDER BY p.salary DESC NULLS LAST, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window partitioned on one join side, null-ordered on the other"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # LEFT JOIN keeps the row whose dept_id is NULL, so there is a NULL partition
  # as well as a NULL sort key. Every join case in
  # column_resolution_across_renames.yaml is INNER, so outer joins are untested
  # against this machinery.
  - id: crcs_g1a_win_order_nulls_last_over_left_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.salary DESC NULLS LAST, p.name) AS rn FROM persons p LEFT OUTER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY ... NULLS LAST over a LEFT OUTER JOIN"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_order_nulls_last_over_three_way_join
    sql: "SELECT p.name AS name, o.id AS order_id, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY o.amount DESC NULLS LAST, o.id) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id INNER JOIN orders o ON o.person_id = p.id ORDER BY 1, 2"
    feature: "window ORDER BY ... NULLS LAST over a three-way join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_order_nulls_last_over_derived_table_join
    sql: "SELECT x.name AS name, y.budget AS budget, ROW_NUMBER() OVER (PARTITION BY x.dept_id ORDER BY x.salary DESC NULLS LAST, x.name) AS rn FROM (SELECT id, name, salary, dept_id FROM persons) x INNER JOIN (SELECT id, budget FROM departments) y ON x.dept_id = y.id ORDER BY 1"
    feature: "window ORDER BY ... NULLS LAST over a join of two derived tables"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # LEAD/LAG read a neighbouring row, so the window's sort order decides the
  # answer rather than just the row numbering -- a null-ordered key here changes
  # which row is read, not merely how ties break.
  - id: crcs_g1a_win_lead_nulls_last_over_join
    sql: "SELECT p.name AS name, LEAD(p.hire_date) OVER (PARTITION BY p.dept_id ORDER BY p.hire_date ASC NULLS LAST, p.name) AS next_hire FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "LEAD over a null-ordered window, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_win_lag_nulls_first_over_join
    sql: "SELECT p.name AS name, LAG(p.salary) OVER (PARTITION BY p.dept_id ORDER BY p.salary ASC NULLS FIRST, p.name) AS prev_salary FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "LAG over a null-ordered window, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # Rank inside a derived table, then filter to the winner. The window lives one
  # scope down from the predicate that consumes it, so the synthesised rank column
  # has to survive the projection boundary.
  - id: crcs_g1a_dedup_row_number_nulls_last_filtered
    sql: "SELECT a.name, a.budget FROM (SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.salary DESC NULLS LAST, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id) a WHERE a.rn = 1 ORDER BY 1"
    feature: "ROW_NUMBER dedup with NULLS LAST in a derived table, filtered on rn = 1"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_dedup_row_number_nulls_last_left_join_filtered
    sql: "SELECT a.name, a.budget FROM (SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.hire_date DESC NULLS LAST, p.name) AS rn FROM persons p LEFT OUTER JOIN departments d ON p.dept_id = d.id) a WHERE a.rn = 1 ORDER BY 1"
    feature: "ROW_NUMBER dedup with NULLS LAST over a LEFT JOIN, filtered on rn = 1"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # Controls that isolate one variable at a time from the cases above.
  - id: crcs_g1a_win_order_nulls_last_no_join
    sql: "SELECT p.name AS name, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY p.salary DESC NULLS LAST, p.name) AS rn FROM persons p ORDER BY 1"
    feature: "window ORDER BY ... NULLS LAST, single table (control: no join)"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_statement_order_nulls_last_over_join
    sql: "SELECT p.name AS name, p.salary AS salary FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY p.salary DESC NULLS LAST, p.name"
    feature: "statement-level ORDER BY ... NULLS LAST over a join (control: no window)"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1a_statement_order_nulls_first_over_join
    sql: "SELECT p.name AS name, p.hire_date AS hire_date FROM persons p LEFT OUTER JOIN departments d ON p.dept_id = d.id ORDER BY p.hire_date ASC NULLS FIRST, p.name"
    feature: "statement-level ORDER BY ... NULLS FIRST over a LEFT JOIN (control: no window)"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # ==========================================================================
  # G1b. The CASE null-ordering guard inside a window's ORDER BY, over a join
  #
  # Semantically equivalent to G1a, written by hand rather than transcribed from
  # any generator. A leading CASE guard is the usual way to express null
  # placement when the NULLS clause is unavailable, so it is worth covering in
  # its own right. Keeping both sections lets a run separate "expression keys in
  # a window are broken" from "the NULLS clause is unsupported": if G1a passes
  # and G1b fails, the
  # remaining defect is expression-key materialisation, not null ordering.
  # ==========================================================================

  - id: crcs_g1b_win_order_case_null_guard_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CASE WHEN p.salary IS NULL THEN 1 ELSE 0 END, p.salary DESC) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY CASE null guard plus real key, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1b_win_order_case_null_guard_only_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CASE WHEN p.salary IS NULL THEN 1 ELSE 0 END, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY CASE null guard as the leading key, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1b_win_order_case_null_guard_desc_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CASE WHEN p.hire_date IS NULL THEN 1 ELSE 0 END DESC, p.hire_date ASC, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY CASE null guard with DESC, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1b_win_order_case_null_guard_right_side_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CASE WHEN d.budget IS NULL THEN 1 ELSE 0 END, d.budget DESC, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY CASE null guard on the right join side"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1b_win_order_case_null_guard_over_left_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CASE WHEN p.salary IS NULL THEN 1 ELSE 0 END, p.salary DESC, p.name) AS rn FROM persons p LEFT OUTER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY CASE null guard over a LEFT OUTER JOIN"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1b_dedup_case_null_guard_filtered
    sql: "SELECT a.name, a.budget FROM (SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CASE WHEN p.salary IS NULL THEN 1 ELSE 0 END, p.salary DESC, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id) a WHERE a.rn = 1 ORDER BY 1"
    feature: "ROW_NUMBER dedup with a CASE null guard, filtered on rn = 1"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1b_win_order_case_null_guard_no_join
    sql: "SELECT p.name AS name, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CASE WHEN p.salary IS NULL THEN 1 ELSE 0 END, p.salary DESC, p.name) AS rn FROM persons p ORDER BY 1"
    feature: "window ORDER BY CASE null guard, single table (control: no join)"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  # ==========================================================================
  # G1c. Other expression keys inside a window's ORDER BY, over a join
  #
  # Window sort keys that are ordinary expressions rather than a null guard.
  # Supporting the NULLS clause does nothing for these: they need a window
  # sort-key expression to be materialised under a name that agrees between the
  # extend that creates the column and the lookup that later reads it.
  # ==========================================================================

  - id: crcs_g1c_win_order_upper_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY UPPER(p.name)) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY UPPER(col) over a join"
    category: "column_resolution_corpus"
    expected_tds_status: PASS
    expected_rel_status: PASS

  - id: crcs_g1c_win_order_cast_to_date_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY CAST(d.created_at AS DATE), p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY CAST(col AS DATE) over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1c_win_order_coalesce_one_side_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY COALESCE(p.salary, 0) DESC, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY COALESCE(col, literal) over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  # A single sort key reading columns from both join sides, so both suffixes
  # have to resolve inside one expression.
  - id: crcs_g1c_win_order_coalesce_both_sides_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY COALESCE(p.age, d.id) DESC, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY an expression reading both join sides"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1c_win_order_substring_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY SUBSTRING(p.name FROM 1 FOR 3), p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY SUBSTRING(col ...) over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1c_win_order_arithmetic_both_sides_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY COALESCE(p.salary, 0) + d.budget DESC, p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY arithmetic across both join sides"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: crcs_g1c_win_order_extract_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY EXTRACT(YEAR FROM p.hire_date), p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY EXTRACT(part FROM col) over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1c_win_order_nested_case_in_function_over_join
    sql: "SELECT p.name AS name, d.budget AS budget, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY UPPER(CASE WHEN p.active = true THEN p.name ELSE d.name END), p.name) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY a CASE nested inside a function, over a join"
    category: "column_resolution_corpus"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: crcs_g1c_win_order_expression_matching_a_projection_over_join
    sql: "SELECT p.name AS name, UPPER(p.name) AS upper_name, ROW_NUMBER() OVER (PARTITION BY p.dept_id ORDER BY UPPER(p.name)) AS rn FROM persons p INNER JOIN departments d ON p.dept_id = d.id ORDER BY 1"
    feature: "window ORDER BY an expression the projection already computes"
    category: "column_resolution_corpus"
    expected_tds_status: PASS
    expected_rel_status: PASS

  # ------------------------------------------------------------------
  # Single-table controls for the same expression keys.
  #
  # These exist to isolate one variable, and the suite has nothing like them:
  # across all 1600+ existing cases there is not one window key that is a
  # SCALAR expression. The only six expression window keys anywhere are
  # aggregate keys over a GROUP BY (compositions/window_over_agg.yaml), which
  # is a separate limitation.
  #
  # Read them against their joined twins above:
  #   single-table PASS + joined ERROR -> the join is the variable, i.e. the
  #     name the extend gives the helper column and the name the window key
  #     lookup asks for diverge once join suffixes and the projection's rename
  #     are in play.
  #   both ERROR -> the extend is not being produced for expression keys at
  #     all, independently of any join.
