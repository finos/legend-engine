  # ------------------------------------------------------------------
  # Outer alias shadowed by a derived table's internal alias
  #
  # A derived table on one side of a join internally re-uses an alias that is
  # also a table alias in the enclosing query. processAliasedRelation keeps the
  # subquery's internal child contexts on the context it returns, and
  # processStandardJoin feeds those into the join's row-variable map unguarded --
  # so the inner binding overwrites the outer one and the ON clause resolves the
  # outer alias against the wrong side of the join.
  #
  # The tell is an error naming a column of the outer alias while the reported
  # relation contains only the derived table's own columns.
  #
  # These six use an aggregating "latest row" subquery, which is how the shape is
  # most often written. That makes them poor at verifying a name-resolution fix:
  # every derived table here contains a GROUP BY and a join, so all six -- the
  # control included -- die on the Relation join+aggregate execution wall before
  # resolution runs, and they report the same failure either way. Read them as
  # coverage of the shape, not as a signal. The `..._simple_derived_side` block
  # below is the signal.
  # ------------------------------------------------------------------

  - id: crcs_g5_derived_table_reuses_an_outer_alias
    sql: "SELECT p.name AS name, latest.top_amount AS top_amount FROM persons p INNER JOIN (SELECT p.id AS person_id, MAX(o.amount) AS top_amount FROM persons p INNER JOIN orders o ON o.person_id = p.id GROUP BY p.id) latest ON latest.person_id = p.id ORDER BY 1"
    feature: "derived table internally re-using the enclosing query's table alias"
