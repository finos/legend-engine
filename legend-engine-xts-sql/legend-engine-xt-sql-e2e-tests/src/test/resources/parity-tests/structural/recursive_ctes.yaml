tests:
  # =============================================================================
  # WITH RECURSIVE common table expressions
  # https://www.postgresql.org/docs/16/queries-with.html#QUERIES-WITH-RECURSIVE
  # =============================================================================

  - id: recursive_cte_number_series
    sql: "WITH RECURSIVE t(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM t WHERE n < 5) SELECT n FROM t ORDER BY 1"
    feature: "WITH RECURSIVE simple series"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: recursive_cte_hierarchy
    sql: "WITH RECURSIVE org(id, name, dept_id, depth) AS (SELECT id, name, dept_id, 0 FROM persons WHERE dept_id = 1 UNION ALL SELECT p.id, p.name, p.dept_id, org.depth + 1 FROM persons p JOIN org ON p.dept_id = org.dept_id AND p.id > org.id) SELECT * FROM org ORDER BY depth, id"
    feature: "WITH RECURSIVE self-join traversal"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: cte_materialized_hint
    sql: "WITH cte AS MATERIALIZED (SELECT dept_id, COUNT(*) AS cnt FROM persons GROUP BY dept_id) SELECT * FROM cte ORDER BY 1"
    feature: "WITH ... AS MATERIALIZED"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: cte_not_materialized_hint
    sql: "WITH cte AS NOT MATERIALIZED (SELECT dept_id, COUNT(*) AS cnt FROM persons GROUP BY dept_id) SELECT * FROM cte ORDER BY 1"
    feature: "WITH ... AS NOT MATERIALIZED"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: ERROR


  # -----------------------------------------------------------------------------
  # Shapes the queryToPure -> recurse() mapping covers
  # -----------------------------------------------------------------------------

  - id: recursive_cte_from_table_anchor
    sql: "WITH RECURSIVE t(n) AS (SELECT id FROM persons WHERE id = 1 UNION ALL SELECT n + 1 FROM t WHERE n < 5) SELECT n FROM t ORDER BY 1"
    feature: "WITH RECURSIVE over a table-backed anchor"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: recursive_cte_downstream_filter
    sql: "WITH RECURSIVE t(n) AS (SELECT id FROM persons WHERE id = 1 UNION ALL SELECT n + 1 FROM t WHERE n < 5) SELECT n FROM t WHERE n > 2 ORDER BY 1"
    feature: "WITH RECURSIVE feeding a downstream filter"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: recursive_cte_downstream_aggregate
    sql: "WITH RECURSIVE t(n) AS (SELECT id FROM persons WHERE id = 1 UNION ALL SELECT n + 1 FROM t WHERE n < 5) SELECT COUNT(*) AS cnt FROM t"
    feature: "WITH RECURSIVE feeding a downstream aggregate"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: recursive_cte_union_distinct_unsupported
    sql: "WITH RECURSIVE t(n) AS (SELECT id FROM persons WHERE id = 1 UNION SELECT n + 1 FROM t WHERE n < 5) SELECT n FROM t ORDER BY 1"
    feature: "WITH RECURSIVE using UNION rather than UNION ALL"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: recursive_cte_mixed_with_plain
    sql: "WITH RECURSIVE t(n) AS (SELECT id FROM persons WHERE id = 1 UNION ALL SELECT n + 1 FROM t WHERE n < 5), summary AS (SELECT n FROM t WHERE n > 2) SELECT n FROM summary ORDER BY 1"
    feature: "WITH RECURSIVE list mixing a recursive and a plain member"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  # Postgres accepts WITH RECURSIVE whose members never reference themselves; it is then an
  # ordinary CTE list. The keyword alone must not send a member down the recurse() path.
  - id: recursive_keyword_without_recursion
    sql: "WITH RECURSIVE t AS (SELECT name, salary FROM persons WHERE salary > 70000) SELECT name, salary FROM t ORDER BY 1"
    feature: "WITH RECURSIVE with no self-referencing member"
    category: "recursive_ctes"
    expected_tds_status: ERROR
    expected_rel_status: PASS
