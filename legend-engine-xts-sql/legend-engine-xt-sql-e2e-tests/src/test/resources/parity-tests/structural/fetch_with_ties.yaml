tests:
  # =============================================================================
  # FETCH FIRST ... WITH TIES
  # https://www.postgresql.org/docs/16/sql-select.html#SQL-LIMIT
  # =============================================================================

  - id: fetch_first_with_ties
    sql: "SELECT dept_id, salary FROM persons ORDER BY salary DESC FETCH FIRST 3 ROWS WITH TIES"
    feature: "FETCH FIRST n ROWS WITH TIES"
    category: "fetch_with_ties"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: fetch_first_only
    sql: "SELECT dept_id, salary FROM persons ORDER BY salary DESC FETCH FIRST 3 ROWS ONLY"
    feature: "FETCH FIRST n ROWS ONLY"
    category: "fetch_with_ties"
    expected_tds_status: PASS
    expected_rel_status: PASS

  - id: fetch_next_with_ties
    sql: "SELECT dept_id, salary FROM persons ORDER BY salary DESC OFFSET 1 FETCH NEXT 3 ROWS WITH TIES"
    feature: "OFFSET ... FETCH NEXT n ROWS WITH TIES"
    category: "fetch_with_ties"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

