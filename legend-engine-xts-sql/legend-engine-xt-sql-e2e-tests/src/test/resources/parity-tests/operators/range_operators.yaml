tests:
# =============================================================================
# Range / Multirange Operators
# https://www.postgresql.org/docs/16/rangetypes.html
# No range-typed columns exist in the shared schema; int4range/int4multirange
# literals are used to exercise every anyrange/anymultirange combination
# listed for this category in operator-coverage.md.
# =============================================================================

# && (overlap)
- id: range_overlap__range_range
  sql: SELECT int4range(1,10) && int4range(5,15) AS result FROM persons WHERE id = 1
  operator: "&&"
  signature: "&&(anyrange, anyrange) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: range_overlap__multirange_multirange
  sql: SELECT int4multirange(int4range(1,10)) && int4multirange(int4range(5,15)) AS result FROM persons WHERE id = 1
  operator: "&&"
  signature: "&&(anymultirange, anymultirange) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: range_overlap__multirange_range
  sql: SELECT int4multirange(int4range(1,10)) && int4range(5,15) AS result FROM persons WHERE id = 1
  operator: "&&"
  signature: "&&(anymultirange, anyrange) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: range_overlap__range_multirange
  sql: SELECT int4range(1,10) && int4multirange(int4range(5,15)) AS result FROM persons WHERE id = 1
  operator: "&&"
  signature: "&&(anyrange, anymultirange) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

