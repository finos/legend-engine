tests:
# =============================================================================
# Geometric Operators
# https://www.postgresql.org/docs/16/functions-geometry.html
# No geometric columns exist in the shared schema; point/line/lseg/box/path/
# polygon/circle literals are used to exercise every signature listed for
# this category in operator-coverage.md.
# =============================================================================

# # (number of points / intersection point)
- id: geo_hash__path_npoints
  sql: SELECT # path '((1,1),(2,2),(3,1))' AS result FROM persons WHERE id = 1
  operator: "#"
  signature: "#(-, path) → int4"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: geo_hash__polygon_npoints
  sql: SELECT # polygon '((0,0),(0,1),(1,1),(1,0))' AS result FROM persons WHERE id = 1
  operator: "#"
  signature: "#(-, polygon) → int4"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: geo_hash__box_intersection
  sql: SELECT box '(3,3),(1,1)' # box '(4,4),(2,2)' AS result FROM persons WHERE id = 1
  operator: "#"
  signature: "#(box, box) → box"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: geo_hash__line_intersection
  sql: SELECT line '{1,0,0}' # line '{0,1,0}' AS result FROM persons WHERE id = 1
  operator: "#"
  signature: "#(line, line) → point"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: geo_hash__lseg_intersection
  sql: SELECT lseg '[(0,0),(2,2)]' # lseg '[(0,2),(2,0)]' AS result FROM persons WHERE id = 1
  operator: "#"
  signature: "#(lseg, lseg) → point"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# ## (point of closest proximity)
- id: geo_hashhash__line_lseg
  sql: SELECT line '{1,0,0}' ## lseg '[(1,1),(1,5)]' AS result FROM persons WHERE id = 1
