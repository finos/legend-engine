# ---------------------------------------------------------------------------
# Unary prefix +/- (identity / negation)
# ---------------------------------------------------------------------------

- id: op_unary_plus__int__basic
  sql: SELECT id, +int_val AS result FROM numbers WHERE id = 1
  operator: "+"
  signature: "+(-, numeric) → numeric"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: op_unary_minus__int__basic
  sql: SELECT id, -int_val AS result FROM numbers WHERE id = 1
  operator: "-"
  signature: "-(-, numeric) → numeric"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# datetime <-> numeric cross-type arithmetic (date +/- integer days,
# interval * / numeric scaling)
# ---------------------------------------------------------------------------

- id: op_add__date_plus_int_days
  sql: SELECT d + 5 AS result FROM dates WHERE id = 1
  operator: "+"
  signature: "+(datetime, numeric) → datetime"
  expected_tds_status: FAIL
  expected_rel_status: FAIL

- id: op_add__int_plus_date_days
  sql: SELECT 5 + d AS result FROM dates WHERE id = 1
  operator: "+"
  signature: "+(numeric, datetime) → datetime"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: op_sub__date_minus_int_days
  sql: SELECT d - 5 AS result FROM dates WHERE id = 1
  operator: "-"
  signature: "-(datetime, numeric) → datetime"
  expected_tds_status: FAIL
  expected_rel_status: FAIL

- id: op_mul__interval_times_numeric
  sql: SELECT INTERVAL '1 day' * 2 AS result FROM dates WHERE id = 1
  operator: "*"
  signature: "*(datetime, numeric) → datetime"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: op_mul__numeric_times_interval
  sql: SELECT 2 * INTERVAL '1 day' AS result FROM dates WHERE id = 1
  operator: "*"
  signature: "*(numeric, datetime) → datetime"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: op_div__interval_by_numeric
  sql: SELECT INTERVAL '1 day' / 2 AS result FROM dates WHERE id = 1
  operator: "/"
  signature: "/(datetime, numeric) → datetime"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# ---------------------------------------------------------------------------
# pg_lsn <-> numeric arithmetic (log sequence number pseudo-type)
# ---------------------------------------------------------------------------

- id: op_add__pg_lsn_plus_numeric
  sql: SELECT CAST('0/1' AS pg_lsn) + 16 AS result FROM dates WHERE id = 1
  operator: "+"
  signature: "+(pg_lsn, numeric) → pg_lsn"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: op_add__numeric_plus_pg_lsn
  sql: SELECT 16 + CAST('0/1' AS pg_lsn) AS result FROM dates WHERE id = 1
  operator: "+"
  signature: "+(numeric, pg_lsn) → pg_lsn"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: op_sub__pg_lsn_minus_numeric
  sql: SELECT CAST('0/10' AS pg_lsn) - 16 AS result FROM dates WHERE id = 1
  operator: "-"
  signature: "-(pg_lsn, numeric) → pg_lsn"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

