tests:
  # =============================================================================
  # JSON/JSONB Operators (arrow, path, containment, existence)
  # =============================================================================

  # -> operator (get JSON object field by key, returns json/jsonb)

  - id: to_json__from_column
    sql: SELECT TO_JSON(val) AS result FROM strings WHERE val IS NOT NULL ORDER BY 1
    function: to_json
    signature: to_json(anyelement) ? json
    expected_tds_status: BUG
    expected_rel_status: BUG

  - id: to_jsonb__from_column
    sql: SELECT TO_JSONB(val) AS result FROM strings WHERE val IS NOT NULL ORDER BY 1
    function: to_jsonb
    signature: to_jsonb(anyelement) ? jsonb
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: array_to_json__unsupported_type
    sql: SELECT ARRAY_TO_JSON(ARRAY[1, 2, 3]) AS result FROM persons WHERE id = 1
    function: array_to_json
    signature: array_to_json(anyarray) ? json
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: array_to_json__bool__unsupported_type
    sql: SELECT ARRAY_TO_JSON(ARRAY[1, 2, 3], true) AS result FROM persons WHERE id = 1
    function: array_to_json
    signature: array_to_json(anyarray, boolean) ? json
