tests:
# =============================================================================
# JSON/JSONB Operators (arrow, path, containment, existence)
# =============================================================================

# -> operator (get JSON object field by key, returns json/jsonb)
- id: json_arrow_get_field
  sql: SELECT json_val -> 'a' AS result FROM json_data WHERE id = 1
  function: "->"
  signature: json -> text → json
  expected_tds_status: ERROR
  expected_rel_status: FAIL

- id: jsonb_arrow_get_field
  sql: SELECT jsonb_val -> 'b' AS result FROM json_data WHERE id = 1
  function: "->"
  signature: jsonb -> text → jsonb
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# -> operator (get JSON array element by index)
- id: json_arrow_get_index
  sql: SELECT json_arr -> 0 AS result FROM json_data WHERE id = 1
  function: "->"
  signature: json -> integer → json
  expected_tds_status: ERROR
  expected_rel_status: FAIL

- id: jsonb_arrow_get_index
  sql: SELECT jsonb_arr -> 1 AS result FROM json_data WHERE id = 1
  function: "->"
  signature: jsonb -> integer → jsonb
  expected_tds_status: ERROR
  expected_rel_status: FAIL

# ->> operator (get JSON object field as text)
- id: json_arrow_text_get_field
  sql: SELECT json_val ->> 'b' AS result FROM json_data WHERE id = 1
  function: "->>"
  signature: json ->> text → text
  expected_tds_status: ERROR
  expected_rel_status: PASS

- id: jsonb_arrow_text_get_field
  sql: SELECT jsonb_val ->> 'b' AS result FROM json_data WHERE id = 1
  function: "->>"
  signature: jsonb ->> text → text
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# ->> operator (get JSON array element as text)
- id: json_arrow_text_get_index
  sql: SELECT json_arr ->> 0 AS result FROM json_data WHERE id = 1
  function: "->>"
  signature: json ->> integer → text
  expected_tds_status: ERROR
  expected_rel_status: PASS

- id: jsonb_arrow_text_get_index
  sql: SELECT jsonb_arr ->> 1 AS result FROM json_data WHERE id = 1
  function: "->>"
  signature: jsonb ->> integer → text
  expected_tds_status: ERROR
  expected_rel_status: PASS

# #> operator (get JSON object at specified path)
- id: json_hash_arrow_path
  sql: SELECT json_val #> '{a,b,c}' AS result FROM json_data WHERE id = 2
  function: "#>"
  signature: json #> text[] → json
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: jsonb_hash_arrow_path
