  function: "#>"
  signature: jsonb #> text[] → jsonb
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# #>> operator (get JSON object at specified path as text)
- id: json_hash_arrow_text_path
  sql: SELECT json_val #>> '{a,b,c}' AS result FROM json_data WHERE id = 2
  function: "#>>"
  signature: json #>> text[] → text
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: jsonb_hash_arrow_text_path
  sql: SELECT jsonb_val #>> '{a,b,c}' AS result FROM json_data WHERE id = 2
  function: "#>>"
  signature: jsonb #>> text[] → text
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# @> operator (does left JSON contain right?)
- id: jsonb_contains
  sql: SELECT jsonb_val @> '{"a":1}' AS result FROM json_data WHERE id = 1
  function: "@>"
  signature: jsonb @> jsonb → boolean
  expected_tds_status: ERROR
  expected_rel_status: ERROR

