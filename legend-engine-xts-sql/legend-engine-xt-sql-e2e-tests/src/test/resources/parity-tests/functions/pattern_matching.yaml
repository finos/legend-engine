  # === Regex match operators (~, !~, ~*, !~*) ===
  # createRegexMatch (fromPure.pure) routes rather than rejects: a literal, fully ^...$-anchored
  # pattern with no top-level alternation goes to Pure matches(), which far more stores implement;
  # everything else - unanchored, case-insensitive, column-valued - goes to regexpLike(), which is
  # what Postgres ~ actually means. See docs/engineering/reference/regex-portability.md and ADR-002.

  - id: regexp_like__txt_txt__fully_anchored_supported
    sql: "SELECT REGEXP_LIKE('hello', '^hello$') AS matches, REGEXP_LIKE('world', '^hello$') AS noMatch FROM strings WHERE id = 1"
    function: regexp_like
    signature: "regexp_like(text, text) → boolean"
    expected_tds_status: PASS
    expected_rel_status: PASS

  # SIMILAR TO is absent from SqlBaseLexer.g4/SqlBaseParser.g4, so it fails while parsing rather
  # than at function resolution — an earlier tier than the regexp_* misses above. The expected-
  # function catalog lists similar_to, so this gap was previously untested rather than accepted.
