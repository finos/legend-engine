  # ---------------------------------------------------------------------------
  # Divergence tests: fromPure function_processors.pure silently discards the
  # `start` and `N` (occurrence) positional args of REGEXP_SUBSTR, and the
  # `start` arg of REGEXP_COUNT. These tests document the gap by picking a row
  # whose `val` has multiple non-overlapping matches ("the quick brown fox"
  # has four [a-z]+ tokens, sixteen [a-z] characters). Postgres honours the
  # positional args and returns the correct match/count; Legend returns the
  # first match / total count and the results diverge → FAIL. When the Pure
  # processor is fixed to honour start/N, `FIX DETECTED` will fire and the
  # expected_*_status here should be flipped to PASS.
  # ---------------------------------------------------------------------------
