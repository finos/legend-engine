tests:
# =============================================================================
# EXTRACT / date_part field keywords
# https://www.postgresql.org/docs/16/functions-datetime.html#FUNCTIONS-DATETIME-EXTRACT
# One row per documented field (Table 9.33), applied to a representative
# timestamp literal.
# =============================================================================

- id: extract_field__century
  sql: "SELECT EXTRACT(CENTURY FROM TIMESTAMP '2024-06-15 13:45:22') AS result"
  format_token: "extract:century"
  expected_tds_status: PASS
  expected_rel_status: PASS

