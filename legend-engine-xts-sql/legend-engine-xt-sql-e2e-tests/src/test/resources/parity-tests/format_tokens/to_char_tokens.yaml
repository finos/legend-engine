tests:
# =============================================================================
# to_char template pattern tokens
# https://www.postgresql.org/docs/16/functions-formatting.html#FUNCTIONS-FORMATTING-DATETIME-TABLE
# One row per documented token (Table 9.25), applied to a representative
# timestamp literal so the parity report can show a PASS/FAIL/UNTESTED matrix
# keyed by (function, format_token) rather than by test id alone.
# =============================================================================

- id: to_char_token__HH
  sql: "SELECT to_char(TIMESTAMP '2024-06-15 13:45:22', 'HH') AS result"
  format_token: "to_char:HH"
  expected_tds_status: PASS
  expected_rel_status: PASS

