  expected_rel_status: ERROR

# ---------------------------------------------------------------------------
# IN / NOT IN
# ---------------------------------------------------------------------------

- id: in__int__match
  sql: SELECT id, int_val IN (42, 100, 7) AS result FROM numbers WHERE id IN (1, 8, 9) ORDER BY id
  predicate: "IN"
  signature: "in(integer, list) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: in__int__no_match
  sql: SELECT id, int_val IN (999, 888) AS result FROM numbers WHERE id = 1
  predicate: "IN"
  signature: "in(integer, list) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: in__int__null
  sql: SELECT id, int_val IN (42, NULL) AS result FROM numbers WHERE id IN (1, 5) ORDER BY id
  predicate: "IN"
  signature: "in(integer, list) → boolean"
  expected_tds_status: PASS
  expected_rel_status: ERROR

- id: in__varchar__match
  sql: SELECT id, name IN ('Alice', 'Bob', 'Charlie') AS result FROM persons WHERE id IN (1, 4, 5) ORDER BY id
  predicate: "IN"
  signature: "in(varchar, list) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: not_in__int__from_table
  sql: SELECT id, int_val NOT IN (42, 100, 7) AS result FROM numbers WHERE id IN (1, 2, 3) ORDER BY id
  predicate: "NOT IN"
  signature: "not_in(integer, list) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

