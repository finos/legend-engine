tests:
# =============================================================================
# Comparison Predicates (BETWEEN, IS [NOT] DISTINCT FROM, IS [NOT] NULL,
# IS [NOT] TRUE/FALSE/UNKNOWN, IN / NOT IN)
# https://www.postgresql.org/docs/16/functions-comparison.html
# =============================================================================

- id: between__int__in_range
  sql: SELECT id, int_val BETWEEN 0 AND 100 AS result FROM numbers WHERE id IN (1, 2, 3, 8) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(integer, integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: between__int__null
  sql: SELECT id, int_val BETWEEN 0 AND 100 AS result FROM numbers WHERE id = 5
  predicate: "BETWEEN"
  signature: "between(integer, integer, integer) → boolean"
  expected_tds_status: FAIL
  expected_rel_status: FAIL

- id: between__float__in_range
  sql: SELECT id, float_val BETWEEN -1.0 AND 5.0 AS result FROM numbers WHERE id IN (1, 2, 3, 6, 7) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(double precision, double precision, double precision) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: between__varchar__in_range
  sql: SELECT id, name BETWEEN 'A' AND 'D' AS result FROM persons WHERE id IN (1, 2, 3, 4) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(varchar, varchar, varchar) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: between__date__in_range
  sql: SELECT id, d BETWEEN DATE '2020-01-01' AND DATE '2024-12-31' AS result FROM dates WHERE id IN (1, 2, 6, 8) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(date, date, date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: between__decimal__in_range
  sql: SELECT id, salary BETWEEN 50000 AND 80000 AS result FROM persons WHERE id IN (1, 2, 3, 4) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(numeric, numeric, numeric) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: not_between__int__from_table
  sql: SELECT id, int_val NOT BETWEEN 0 AND 100 AS result FROM numbers WHERE id IN (1, 2, 4, 10) ORDER BY id
  predicate: "NOT BETWEEN"
  signature: "not_between(integer, integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: between_symmetric__int
  sql: SELECT id, int_val BETWEEN SYMMETRIC 100 AND 0 AS result FROM numbers WHERE id IN (1, 2, 3, 8) ORDER BY id
  predicate: "BETWEEN SYMMETRIC"
  signature: "between_symmetric(integer, integer, integer) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: between__timestamp__in_range
  sql: SELECT id, ts BETWEEN TIMESTAMP '2020-01-01 00:00:00' AND TIMESTAMP '2024-12-31 23:59:59' AS result FROM dates WHERE id IN (1, 2, 6, 8) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(timestamp, timestamp, timestamp) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: between__date_and_timestamp__mixed_bounds
  sql: SELECT id, d BETWEEN TIMESTAMP '2020-01-01 00:00:00' AND DATE '2024-12-31' AS result FROM dates WHERE id IN (1, 2, 6, 8) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(date, timestamp, date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: between__timestamp_and_date__mixed_bounds
  sql: SELECT id, ts BETWEEN DATE '2020-01-01' AND TIMESTAMP '2024-12-31 23:59:59' AS result FROM dates WHERE id IN (1, 2, 6, 8) ORDER BY id
  predicate: "BETWEEN"
  signature: "between(timestamp, date, timestamp) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# IS DISTINCT FROM / IS NOT DISTINCT FROM
# ---------------------------------------------------------------------------

- id: is_distinct_from__int__both_non_null
  sql: SELECT id, int_val IS DISTINCT FROM 42 AS result FROM numbers WHERE id = 1
  predicate: "IS DISTINCT FROM"
  signature: "is_distinct_from(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_distinct_from__int__one_null
  sql: SELECT id, int_val IS DISTINCT FROM 42 AS result FROM numbers WHERE id = 5
  predicate: "IS DISTINCT FROM"
  signature: "is_distinct_from(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: FAIL

- id: is_distinct_from__null_null
  sql: SELECT NULL IS DISTINCT FROM NULL AS result FROM persons WHERE id = 1
  predicate: "IS DISTINCT FROM"
  signature: "is_distinct_from(unknown, unknown) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_not_distinct_from__int__both_non_null
  sql: SELECT id, int_val IS NOT DISTINCT FROM 42 AS result FROM numbers WHERE id = 1
  predicate: "IS NOT DISTINCT FROM"
  signature: "is_not_distinct_from(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_not_distinct_from__null_null
  sql: SELECT NULL IS NOT DISTINCT FROM NULL AS result FROM persons WHERE id = 1
  predicate: "IS NOT DISTINCT FROM"
  signature: "is_not_distinct_from(unknown, unknown) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# IS NULL / IS NOT NULL
# ---------------------------------------------------------------------------

- id: is_null__int__null
  sql: SELECT id, int_val IS NULL AS result FROM numbers WHERE id = 5
  predicate: "IS NULL"
  signature: "is_null(integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_null__int__not_null
  sql: SELECT id, int_val IS NULL AS result FROM numbers WHERE id = 1
  predicate: "IS NULL"
  signature: "is_null(integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_null__varchar__null
  sql: SELECT id, nullable_val IS NULL AS result FROM strings WHERE id = 3
  predicate: "IS NULL"
  signature: "is_null(varchar) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_null__date__null
  sql: SELECT id, d IS NULL AS result FROM dates WHERE id = 5
  predicate: "IS NULL"
  signature: "is_null(date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_not_null__int__not_null
  sql: SELECT id, int_val IS NOT NULL AS result FROM numbers WHERE id = 1
  predicate: "IS NOT NULL"
  signature: "is_not_null(integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: is_not_null__int__null
  sql: SELECT id, int_val IS NOT NULL AS result FROM numbers WHERE id = 5
  predicate: "IS NOT NULL"
  signature: "is_not_null(integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# IS TRUE / IS FALSE / IS UNKNOWN (boolean tests)
# ---------------------------------------------------------------------------

- id: is_true__boolean__true
  sql: SELECT id, active IS TRUE AS result FROM persons WHERE id = 1
  predicate: "IS TRUE"
  signature: "is_true(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_true__boolean__false
  sql: SELECT id, active IS TRUE AS result FROM persons WHERE id = 3
  predicate: "IS TRUE"
  signature: "is_true(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_true__boolean__null
  sql: SELECT id, active IS TRUE AS result FROM persons WHERE id = 8
  predicate: "IS TRUE"
  signature: "is_true(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_false__boolean__false
  sql: SELECT id, active IS FALSE AS result FROM persons WHERE id = 3
  predicate: "IS FALSE"
  signature: "is_false(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_false__boolean__null
  sql: SELECT id, active IS FALSE AS result FROM persons WHERE id = 8
  predicate: "IS FALSE"
  signature: "is_false(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_unknown__boolean__null
  sql: SELECT id, active IS UNKNOWN AS result FROM persons WHERE id = 8
  predicate: "IS UNKNOWN"
  signature: "is_unknown(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_unknown__boolean__not_null
  sql: SELECT id, active IS UNKNOWN AS result FROM persons WHERE id = 1
  predicate: "IS UNKNOWN"
  signature: "is_unknown(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_not_true__boolean__false
  sql: SELECT id, active IS NOT TRUE AS result FROM persons WHERE id = 3
  predicate: "IS NOT TRUE"
  signature: "is_not_true(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_not_false__boolean__true
  sql: SELECT id, active IS NOT FALSE AS result FROM persons WHERE id = 1
  predicate: "IS NOT FALSE"
  signature: "is_not_false(boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: is_not_unknown__boolean__not_null
  sql: SELECT id, active IS NOT UNKNOWN AS result FROM persons WHERE id = 1
  predicate: "IS NOT UNKNOWN"
  signature: "is_not_unknown(boolean) → boolean"
