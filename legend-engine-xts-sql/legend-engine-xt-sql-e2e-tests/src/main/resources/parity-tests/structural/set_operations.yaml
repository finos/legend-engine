tests:
  # UNION ALL
  - id: union_all_basic
    sql: "SELECT name, salary FROM persons WHERE dept_id = 1 UNION ALL SELECT name, salary FROM persons WHERE dept_id = 2 ORDER BY 1"
    feature: "UNION ALL"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  - id: union_all_different_cols
    sql: "SELECT name AS label, salary AS value FROM persons WHERE id <= 3 UNION ALL SELECT status AS label, amount AS value FROM orders WHERE id <= 3 ORDER BY 1"
    feature: "UNION ALL"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  - id: union_all_with_limit
    sql: "SELECT name FROM persons WHERE dept_id = 1 UNION ALL SELECT name FROM persons WHERE dept_id = 2 ORDER BY 1 LIMIT 5"
    feature: "UNION ALL"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  # UNION (dedup)
  - id: union_dedup
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL UNION SELECT dept_id FROM persons WHERE salary > 60000 ORDER BY 1"
    feature: "UNION"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  - id: union_dedup_strings
    sql: "SELECT name FROM persons WHERE age > 30 UNION SELECT name FROM persons WHERE salary > 70000 ORDER BY 1"
    feature: "UNION"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  # Multiple UNIONs
  - id: union_multiple
    sql: "SELECT name FROM persons WHERE dept_id = 1 UNION ALL SELECT name FROM persons WHERE dept_id = 2 UNION ALL SELECT name FROM persons WHERE dept_id = 3 ORDER BY 1"
    feature: "Multiple UNION"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  - id: union_multiple_mixed
    sql: "SELECT 'dept1' AS src, name FROM persons WHERE dept_id = 1 UNION ALL SELECT 'dept2', name FROM persons WHERE dept_id = 2 ORDER BY 1, 2"
    feature: "Multiple UNION"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # UNION with aggregates
  - id: union_with_agg
    sql: "SELECT dept_id, COUNT(*) AS cnt FROM persons WHERE dept_id IS NOT NULL GROUP BY dept_id UNION ALL SELECT NULL, COUNT(*) FROM persons ORDER BY 1"
    feature: "UNION with aggregates"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: union_with_agg_sum
    sql: "SELECT 'by_dept' AS label, dept_id, SUM(salary) AS total FROM persons WHERE dept_id IS NOT NULL AND salary IS NOT NULL GROUP BY dept_id UNION ALL SELECT 'overall', NULL, SUM(salary) FROM persons WHERE salary IS NOT NULL ORDER BY 1, 2"
    feature: "UNION with aggregates"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # EXCEPT
  - id: except_basic
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL EXCEPT SELECT id as dept_id FROM departments WHERE budget < 600000 ORDER BY 1"
    feature: "EXCEPT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: except_strings
    sql: "SELECT name FROM persons WHERE dept_id = 1 EXCEPT SELECT name FROM persons WHERE salary > 70000 ORDER BY 1"
    feature: "EXCEPT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: except_with_limit
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL EXCEPT SELECT id as dept_id FROM departments WHERE budget < 600000 ORDER BY 1 LIMIT 5"
    feature: "EXCEPT with LIMIT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: except_multiple
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL EXCEPT SELECT id as dept_id FROM departments WHERE budget < 400000 EXCEPT SELECT id as dept_id FROM departments WHERE budget > 900000 ORDER BY 1"
    feature: "Multiple EXCEPT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: except_nulls
    sql: "SELECT age FROM persons EXCEPT SELECT age FROM persons WHERE age > 40 ORDER BY 1"
    feature: "EXCEPT with NULLs"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: except_with_agg
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL GROUP BY dept_id EXCEPT SELECT id FROM departments WHERE budget < 600000 ORDER BY 1"
    feature: "EXCEPT with aggregates"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: except_expression
    sql: "SELECT salary * 1.1 AS adjusted FROM persons WHERE dept_id = 1 AND salary IS NOT NULL EXCEPT SELECT salary * 0.9 FROM persons WHERE dept_id = 2 AND salary IS NOT NULL ORDER BY 1"
    feature: "EXCEPT with expressions"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: except_count
    sql: "SELECT COUNT(*) AS total FROM (SELECT dept_id FROM persons WHERE dept_id IS NOT NULL EXCEPT SELECT id as dept_id FROM departments WHERE budget < 600000) sub"
    feature: "EXCEPT count"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  # INTERSECT
  - id: intersect_basic
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL AND salary > 50000 INTERSECT SELECT dept_id FROM persons WHERE dept_id IS NOT NULL AND age > 30 ORDER BY 1"
    feature: "INTERSECT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: intersect_strings
    sql: "SELECT name FROM persons WHERE age > 30 INTERSECT SELECT name FROM persons WHERE salary > 70000 ORDER BY 1"
    feature: "INTERSECT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: intersect_with_limit
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL AND salary > 50000 INTERSECT SELECT dept_id FROM persons WHERE dept_id IS NOT NULL AND age > 30 ORDER BY 1 LIMIT 5"
    feature: "INTERSECT with LIMIT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: intersect_multiple
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL INTERSECT SELECT dept_id FROM persons WHERE salary > 50000 INTERSECT SELECT dept_id FROM persons WHERE age > 30 ORDER BY 1"
    feature: "Multiple INTERSECT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: intersect_nulls
    sql: "SELECT age FROM persons INTERSECT SELECT age FROM persons WHERE age IS NULL ORDER BY 1"
    feature: "INTERSECT with NULLs"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: intersect_with_agg
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL GROUP BY dept_id INTERSECT SELECT id FROM departments WHERE budget > 400000 ORDER BY 1"
    feature: "INTERSECT with aggregates"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: intersect_expression
    sql: "SELECT salary * 1.1 AS adjusted FROM persons WHERE dept_id = 1 AND salary IS NOT NULL INTERSECT SELECT salary * 0.9 FROM persons WHERE dept_id = 2 AND salary IS NOT NULL ORDER BY 1"
    feature: "INTERSECT with expressions"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  - id: intersect_count
    sql: "SELECT COUNT(*) AS total FROM (SELECT dept_id FROM persons WHERE dept_id IS NOT NULL AND salary > 50000 INTERSECT SELECT dept_id FROM persons WHERE dept_id IS NOT NULL AND age > 30) sub"
    feature: "INTERSECT count"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  # Mixed set operations
  - id: except_then_intersect
    sql: "SELECT dept_id FROM persons WHERE dept_id IS NOT NULL EXCEPT SELECT id as dept_id FROM departments WHERE budget < 400000 INTERSECT SELECT dept_id FROM persons WHERE salary > 50000 ORDER BY 1"
    feature: "EXCEPT with INTERSECT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  - id: union_then_except
    sql: "SELECT dept_id FROM persons WHERE dept_id = 1 UNION ALL SELECT dept_id FROM persons WHERE dept_id = 2 EXCEPT SELECT id as dept_id FROM departments WHERE budget < 400000 ORDER BY 1"
    feature: "UNION with EXCEPT"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: PASS

  # UNION ALL with NULL values
  - id: union_all_nulls
    sql: "SELECT name, age FROM persons WHERE age IS NULL UNION ALL SELECT name, age FROM persons WHERE age > 40 ORDER BY 1"
    feature: "UNION ALL with NULLs"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  # UNION ALL with expressions
  - id: union_all_expression
    sql: "SELECT name, salary * 1.1 AS adjusted FROM persons WHERE dept_id = 1 AND salary IS NOT NULL UNION ALL SELECT name, salary * 0.9 FROM persons WHERE dept_id = 2 AND salary IS NOT NULL ORDER BY 1"
    feature: "UNION ALL with expressions"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # UNION with CASE
  - id: union_with_case
    sql: "SELECT 'active' AS status, name FROM persons WHERE active = true UNION ALL SELECT 'inactive', name FROM persons WHERE active = false ORDER BY 1, 2"
    feature: "UNION with CASE/labels"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR

  # UNION ALL count verification
  - id: union_all_count
    sql: "SELECT COUNT(*) AS total FROM (SELECT id FROM persons WHERE dept_id = 1 UNION ALL SELECT id FROM persons WHERE dept_id = 2) sub"
    feature: "UNION ALL count"
    category: "set_operations"
    expected_tds_status: PASS
    expected_rel_status: PASS

  # UNION dedup with NULL
  - id: union_dedup_null
    sql: "SELECT dept_id FROM persons UNION SELECT NULL ORDER BY 1"
    feature: "UNION dedup with NULL"
    category: "set_operations"
    expected_tds_status: ERROR
    expected_rel_status: ERROR
