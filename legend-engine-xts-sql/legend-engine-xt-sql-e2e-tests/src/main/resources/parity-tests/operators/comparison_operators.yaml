# ---------------------------------------------------------------------------

- id: eq__int_vs_decimal
  sql: SELECT id, int_val = 42.0 AS result FROM numbers WHERE id = 1
  operator: "="
  signature: "=(integer, numeric) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__int_vs_float
  sql: SELECT id, int_val < 42.5 AS result FROM numbers WHERE id = 1
  operator: "<"
  signature: "<(integer, double precision) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: gt__int_vs_float
  sql: SELECT id, int_val > 41.5 AS result FROM numbers WHERE id = 1
  operator: ">"
  signature: ">(integer, double precision) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: gt__bigint_vs_int
  sql: SELECT id, big_val > 1000 AS result FROM numbers WHERE id IN (1, 2, 3) ORDER BY id
  operator: ">"
  signature: ">(bigint, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# Postgres unknown-type inference: string literal vs typed column
# In Postgres, unquoted string literals are type 'unknown' and get
# auto-cast to the comparison target type.
# ---------------------------------------------------------------------------

- id: gt__varchar_vs_int_literal__pg_unknown_cast
  sql: SELECT CASE WHEN '8' > '10' THEN 'lexicographic' ELSE 'numeric' END AS result FROM persons WHERE id = 1
  operator: ">"
  signature: ">(varchar, varchar) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: gt__string_literal_date__pg_unknown_cast
  sql: SELECT CASE WHEN '2026-01-01' > d THEN true ELSE false END AS result FROM dates WHERE id = 1
  operator: ">"
  signature: ">(unknown, date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__string_literal_date__pg_unknown_cast
  sql: SELECT CASE WHEN '2023-01-15' = d THEN true ELSE false END AS result FROM dates WHERE id = 1
  operator: "="
  signature: "=(unknown, date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__string_literal_int__pg_unknown_cast
  sql: SELECT CASE WHEN '5' < int_val THEN true ELSE false END AS result FROM numbers WHERE id = 1
  operator: "<"
  signature: "<(unknown, integer) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: gte__string_literal_decimal__pg_unknown_cast
  sql: SELECT CASE WHEN '50000.00' >= salary THEN true ELSE false END AS result FROM persons WHERE id = 1
  operator: ">="
  signature: ">=(unknown, numeric) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: eq__string_literal_boolean__pg_unknown_cast
  sql: SELECT CASE WHEN 'true' = active THEN 'match' ELSE 'no match' END AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(unknown, boolean) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: neq__string_literal_timestamp__pg_unknown_cast
  sql: SELECT CASE WHEN '2023-01-15 10:30:00' <> ts THEN true ELSE false END AS result FROM dates WHERE id = 1
  operator: "<>"
  signature: "<>(unknown, timestamp) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# Chained / compound comparisons
# ---------------------------------------------------------------------------

- id: comparison__select__multi_type
  sql: SELECT id, int_val > 0 AS positive, float_val > 0 AS float_positive, name > 'D' AS name_after_d FROM persons WHERE id IN (1, 3, 5) ORDER BY id
  operator: ">"
  signature: ">(any, any) → boolean"
  expected_tds_status: BUG
  expected_rel_status: BUG

- id: comparison__select__all_operators
  sql: SELECT id, int_val = 42 AS eq, int_val <> 42 AS neq, int_val < 42 AS lt, int_val > 42 AS gt, int_val <= 42 AS lte, int_val >= 42 AS gte FROM numbers WHERE id IN (1, 2, 8) ORDER BY id
  operator: "comparison"
  signature: "comparison operators → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

