tests:
# =============================================================================
# Comparison Operators
# https://www.postgresql.org/docs/16/functions-comparison.html
# =============================================================================

- id: eq__int__match
  sql: SELECT id, int_val = 42 AS result FROM numbers WHERE id = 1
  operator: "="
  signature: "=(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__int__no_match
  sql: SELECT id, int_val = 999 AS result FROM numbers WHERE id = 1
  operator: "="
  signature: "=(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__int__null
  sql: SELECT id, int_val = 42 AS result FROM numbers WHERE id = 5
  operator: "="
  signature: "=(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__float__match
  sql: SELECT id, float_val = 3.14159 AS result FROM numbers WHERE id = 1
  operator: "="
  signature: "=(double precision, double precision) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__varchar__match
  sql: SELECT id, name = 'Alice' AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(varchar, varchar) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__varchar__case_sensitive
  sql: SELECT id, name = 'alice' AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(varchar, varchar) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__boolean__match
  sql: SELECT id, active = true AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__date__match
  sql: SELECT id, d = DATE '2023-01-15' AS result FROM dates WHERE id = 1
  operator: "="
  signature: "=(date, date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__decimal__match
  sql: SELECT id, salary = 50000.00 AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(numeric, numeric) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: eq__null_null
  sql: SELECT NULL = NULL AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(unknown, unknown) → boolean"
  expected_tds_status: FAIL
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# <> / != (not equal) operator
# ---------------------------------------------------------------------------

- id: neq__int__match
  sql: SELECT id, int_val <> 42 AS result FROM numbers WHERE id = 1
  operator: "<>"
  signature: "<>(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: neq__int__different
  sql: SELECT id, int_val <> 999 AS result FROM numbers WHERE id = 1
  operator: "<>"
  signature: "<>(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: neq__int__null
  sql: SELECT id, int_val <> 42 AS result FROM numbers WHERE id = 5
  operator: "<>"
  signature: "<>(integer, integer) → boolean"
  expected_tds_status: FAIL
  expected_rel_status: FAIL

- id: neq_bang__int__match
  sql: SELECT id, int_val != 42 AS result FROM numbers WHERE id = 1
  operator: "!="
  signature: "!=(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: neq__varchar__match
  sql: SELECT id, name <> 'Alice' AS result FROM persons WHERE id = 1
  operator: "<>"
  signature: "<>(varchar, varchar) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: neq__boolean__match
  sql: SELECT id, active <> true AS result FROM persons WHERE id = 1
  operator: "<>"
  signature: "<>(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# Boolean ordering comparisons (<, <=, >, >=) — Postgres defines false < true
# ---------------------------------------------------------------------------

- id: lt__boolean__false_lt_true
  sql: SELECT id, active < true AS result FROM persons WHERE id = 3
  operator: "<"
  signature: "<(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lte__boolean__basic
  sql: SELECT id, active <= true AS result FROM persons WHERE id = 1
  operator: "<="
  signature: "<=(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: gt__boolean__true_gt_false
  sql: SELECT id, active > false AS result FROM persons WHERE id = 1
  operator: ">"
  signature: ">(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: gte__boolean__basic
  sql: SELECT id, active >= false AS result FROM persons WHERE id = 1
  operator: ">="
  signature: ">=(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# xid vs numeric comparisons (transaction id pseudo-type)
# ---------------------------------------------------------------------------

- id: eq__xid_vs_numeric
  sql: SELECT CAST('1' AS xid) = 1 AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(xid, numeric) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: neq__xid_vs_numeric
  sql: SELECT CAST('1' AS xid) <> 2 AS result FROM persons WHERE id = 1
  operator: "<>"
  signature: "<>(xid, numeric) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: neq__date__match
  sql: SELECT id, d <> DATE '2023-01-15' AS result FROM dates WHERE id = 1
  operator: "<>"
  signature: "<>(date, date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# < (less than) operator
# ---------------------------------------------------------------------------

- id: lt__int__true
  sql: SELECT id, int_val < 100 AS result FROM numbers WHERE id = 1
  operator: "<"
  signature: "<(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__int__false
  sql: SELECT id, int_val < 10 AS result FROM numbers WHERE id = 1
