  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__int__null
  sql: SELECT id, int_val < 100 AS result FROM numbers WHERE id = 5
  operator: "<"
  signature: "<(integer, integer) → boolean"
  expected_tds_status: PASS
  expected_rel_status: FAIL

- id: lt__float__from_table
  sql: SELECT id, float_val < 1.0 AS result FROM numbers WHERE id IN (1, 2, 3) ORDER BY id
  operator: "<"
  signature: "<(double precision, double precision) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__varchar__lexicographic
  sql: SELECT id, name < 'Charlie' AS result FROM persons WHERE id IN (1, 2, 3) ORDER BY id
  operator: "<"
  signature: "<(varchar, varchar) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__date__from_table
  sql: SELECT id, d < DATE '2020-01-01' AS result FROM dates WHERE id IN (1, 3, 4, 8) ORDER BY id
  operator: "<"
  signature: "<(date, date) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__decimal__from_table
  sql: SELECT id, salary < 60000 AS result FROM persons WHERE id IN (1, 2, 3) ORDER BY id
  operator: "<"
  signature: "<(numeric, numeric) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: lt__timestamp__from_table
  sql: SELECT id, ts < TIMESTAMP '2020-01-01 00:00:00' AS result FROM dates WHERE id IN (1, 3, 4, 8) ORDER BY id
  operator: "<"
  signature: "<(timestamp, timestamp) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

