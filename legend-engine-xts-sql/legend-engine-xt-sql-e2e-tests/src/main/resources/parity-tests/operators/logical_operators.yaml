tests:
# =============================================================================
# Logical Operators (AND, OR, NOT)
# https://www.postgresql.org/docs/16/functions-logical.html
# =============================================================================

- id: compound__and__int_comparisons
  sql: SELECT id FROM numbers WHERE int_val > 0 AND int_val < 100 ORDER BY id
  operator: "AND"
  signature: "AND(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: compound__or__int_comparisons
  sql: SELECT id FROM numbers WHERE int_val < -100 OR int_val > 100 ORDER BY id
  operator: "OR"
  signature: "OR(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: compound__not__comparison
  sql: SELECT id FROM numbers WHERE NOT (int_val > 0) AND int_val IS NOT NULL ORDER BY id
  operator: "NOT"
  signature: "NOT(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# AND truth table (three-valued logic) — PostgreSQL 16 docs, Table 9.1
# https://www.postgresql.org/docs/16/functions-logical.html
# ---------------------------------------------------------------------------

- id: and__true_true
  sql: SELECT (true AND true) AS result FROM persons WHERE id = 1
  operator: "AND"
  signature: "AND(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: and__true_false
  sql: SELECT (true AND false) AS result FROM persons WHERE id = 1
  operator: "AND"
  signature: "AND(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: and__false_false
  sql: SELECT (false AND false) AS result FROM persons WHERE id = 1
  operator: "AND"
  signature: "AND(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: and__true_null
  sql: SELECT (true AND CAST(NULL AS BOOLEAN)) AS result FROM persons WHERE id = 1
  operator: "AND"
  signature: "AND(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: and__false_null
  sql: SELECT (false AND CAST(NULL AS BOOLEAN)) AS result FROM persons WHERE id = 1
  operator: "AND"
  signature: "AND(boolean, boolean) → boolean"
  expected_tds_status: FAIL
  expected_rel_status: FAIL

- id: and__null_null
  sql: SELECT (CAST(NULL AS BOOLEAN) AND CAST(NULL AS BOOLEAN)) AS result FROM persons WHERE id = 1
  operator: "AND"
  signature: "AND(boolean, boolean) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

