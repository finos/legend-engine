# ---------------------------------------------------------------------------
# NOT truth table — PostgreSQL 16 docs, Table 9.1
# https://www.postgresql.org/docs/16/functions-logical.html
# ---------------------------------------------------------------------------

- id: not__true
  sql: SELECT (NOT true) AS result FROM persons WHERE id = 1
