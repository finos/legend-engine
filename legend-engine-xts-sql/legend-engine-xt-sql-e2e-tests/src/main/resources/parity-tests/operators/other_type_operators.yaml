tests:
# =============================================================================
# Comparison operators over Postgres pseudo/internal scalar types
# (bytea, oid, uuid, tid, xid, xid8, pg_lsn, record). These have no
# corresponding columns in the shared parity-test schema, so operands are
# built from literals/casts. Most are expected to fail or error against the
# Legend engine, which has no native representation for several of these
# types — the point of these tests is to close operator-coverage.md
# UNTESTED gaps, not to assert full support.
# https://www.postgresql.org/docs/16/functions-comparison.html
# =============================================================================

# ---------------------------------------------------------------------------
# bytea
# ---------------------------------------------------------------------------

- id: bytea_eq
  sql: SELECT CAST('\x0102' AS bytea) = CAST('\x0102' AS bytea) AS result FROM persons WHERE id = 1
  operator: "="
  signature: "=(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_neq
  sql: SELECT CAST('\x0102' AS bytea) <> CAST('\x03' AS bytea) AS result FROM persons WHERE id = 1
  operator: "<>"
  signature: "<>(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_lt
  sql: SELECT CAST('\x01' AS bytea) < CAST('\x02' AS bytea) AS result FROM persons WHERE id = 1
  operator: "<"
  signature: "<(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_lte
  sql: SELECT CAST('\x01' AS bytea) <= CAST('\x02' AS bytea) AS result FROM persons WHERE id = 1
  operator: "<="
  signature: "<=(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_gt
  sql: SELECT CAST('\x02' AS bytea) > CAST('\x01' AS bytea) AS result FROM persons WHERE id = 1
  operator: ">"
  signature: ">(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_gte
  sql: SELECT CAST('\x02' AS bytea) >= CAST('\x01' AS bytea) AS result FROM persons WHERE id = 1
  operator: ">="
  signature: ">=(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_concat
  sql: SELECT CAST('\x01' AS bytea) || CAST('\x02' AS bytea) AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "||(bytea, bytea) → bytea"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_like
  sql: SELECT CAST('abc' AS bytea) ~~ CAST('a%' AS bytea) AS result FROM persons WHERE id = 1
  operator: "~~"
  signature: "~~(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bytea_not_like
  sql: SELECT CAST('abc' AS bytea) !~~ CAST('z%' AS bytea) AS result FROM persons WHERE id = 1
  operator: "!~~"
  signature: "!~~(bytea, bytea) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

