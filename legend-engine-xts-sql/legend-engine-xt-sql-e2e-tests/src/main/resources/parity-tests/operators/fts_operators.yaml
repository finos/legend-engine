tests:
# =============================================================================
# Full Text Search Operators
# https://www.postgresql.org/docs/16/textsearch.html
# No tsvector/tsquery columns exist in the shared schema; to_tsvector/
# to_tsquery literals are used.
# =============================================================================

- id: tsquery_negate
  sql: SELECT !! to_tsquery('english', 'fox') AS result FROM persons WHERE id = 1
  operator: "!!"
  signature: "!!(-, tsquery) → tsquery"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: tsquery_and
  sql: SELECT to_tsquery('english', 'fox') && to_tsquery('english', 'dog') AS result FROM persons WHERE id = 1
  operator: "&&"
  signature: "&&(tsquery, tsquery) → tsquery"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: tsquery_lt
  sql: SELECT to_tsquery('english', 'dog') < to_tsquery('english', 'fox') AS result FROM persons WHERE id = 1
  operator: "<"
  signature: "<(tsquery, tsquery) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: tsvector_lt
  sql: SELECT to_tsvector('english', 'dog') < to_tsvector('english', 'fox') AS result FROM persons WHERE id = 1
  operator: "<"
  signature: "<(tsvector, tsvector) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: tsquery_phrase
  sql: SELECT to_tsquery('english', 'fox') <-> to_tsquery('english', 'jumps') AS result FROM persons WHERE id = 1
  operator: "<->"
  signature: "<->(tsquery, tsquery) → tsquery"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

