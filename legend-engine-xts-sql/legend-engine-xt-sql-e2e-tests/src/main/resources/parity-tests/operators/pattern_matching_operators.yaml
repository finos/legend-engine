- id: ilike__txt_txt__case_insensitive
  sql: "SELECT 'Hello' ILIKE 'hello' AS matches, 'world' ILIKE 'hello' AS noMatch FROM strings LIMIT 1"
  operator: "ILIKE"
  signature: "ilike(text, text) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: ilike__txt_txt__case_insensitive_wildcard
  sql: "SELECT 'Hello World' ILIKE '%hello%' AS matches, 'Goodbye' ILIKE '%hello%' AS noMatch FROM strings LIMIT 1"
