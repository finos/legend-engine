  expected_rel_status: PASS

- id: like__txt_txt__underscore_and_percent
  sql: "SELECT 'axbc' LIKE 'a_b%' AS matches, 'abc' LIKE 'a_b%' AS noMatch FROM strings LIMIT 1"
  operator: "LIKE"
  signature: "like(text, text) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: like__txt_txt__multiple_underscores
  sql: "SELECT 'abcd' LIKE 'a__d' AS matches, 'abd' LIKE 'a__d' AS noMatch FROM strings LIMIT 1"
