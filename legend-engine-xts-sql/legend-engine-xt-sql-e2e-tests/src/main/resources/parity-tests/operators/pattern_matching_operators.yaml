- id: ilike__txt_txt__from_table
  sql: "SELECT val ILIKE '%LO%' AS result FROM strings ORDER BY 1"
  operator: "ILIKE"
  signature: "ilike(text, text) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: like__txt_txt__regex_special_chars
  sql: "SELECT 'a.c' LIKE 'a.c' AS matches, 'abc' LIKE 'a.c' AS noMatch FROM strings LIMIT 1"
  operator: "LIKE"
  signature: "like(text, text) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

# === regexp_count ===

- id: regex_match__anchored_literal__supported
  sql: "SELECT val ~ '^hello$' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "~"
  signature: "~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: regex_not_match__anchored_literal__supported
  sql: "SELECT val !~ '^hello$' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "!~"
  signature: "!~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

# Postgres ~ is a substring match, so '^hello|fox$' parses as (^hello)|(fox$) and is true for
# 'the quick brown fox'. Stripping the anchors and calling matches(val,'hello|fox') would make it
# false, so a fully anchored pattern only takes the matches() path when it has no top-level
# alternation. This test is what holds that guard in place.

- id: regex_match__alternation__preserves_substring_semantics
  sql: "SELECT val ~ '^hello|fox$' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "~"
  signature: "~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

# PASSES, and the reason matters: this suite cannot see a regex *flavor* divergence. Both sides
# execute on the same Postgres — the Legend path transpiles to Pure and pushes back down to it —
# so the pattern is interpreted by ARE on both sides and agrees with itself. Evaluated on the
# normative Java runtime the same expression answers differently, because java.util.regex has no
# POSIX bracket expression and reads [[:alpha:]] as the character set {: a l p h}: 'hello' is
# true here and false there. What this test pins is that the transpiler round-trips the pattern
# unaltered; it is not evidence of portability. Flavor divergence is a PCT concern, not a parity
# one. See docs/engineering/reference/regex-portability.md § Traps.

- id: regex_match__posix_bracket_class__round_trips_unaltered
  sql: "SELECT val ~ '^[[:alpha:]]+$' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "~"
  signature: "~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

# An unanchored pattern routes to regexpLike, matching Postgres ~ substring semantics.

- id: regex_match__unanchored__substring
  sql: "SELECT val ~ 'ell' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "~"
  signature: "~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ~* carries RegexpParameter.CASE_INSENSITIVE through to regexpLike.

- id: regex_match_ci__anchored__supported
  sql: "SELECT val ~* '^world$' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "~*"
  signature: "~*(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: regex_not_match_ci__anchored__supported
  sql: "SELECT val !~* '^world$' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "!~*"
  signature: "!~*(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

# A column-valued pattern is passed through to regexpLike rather than reactivated, so it no
# longer has to be a string literal.

- id: regex_match__non_literal_pattern__supported
  sql: "SELECT val ~ nullable_val AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "~"
  signature: "~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

# regexp_like inside the supported envelope: a fully anchored, case-sensitive literal. The existing
# regexp_like cases above all sit outside it, so nothing tested that the envelope works.

- id: similar_to__txt_txt__unsupported
  sql: "SELECT val SIMILAR TO 'h%' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "SIMILAR TO"
  signature: "similar_to(text, text) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: not_similar_to__txt_txt__unsupported
  sql: "SELECT val NOT SIMILAR TO 'h%' AS result FROM strings WHERE val IS NOT NULL ORDER BY 1"
  operator: "NOT SIMILAR TO"
  signature: "similar_to(text, text) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR
