  expected_rel_status: PASS

- id: like__txt_txt__escaped_underscore
  sql: "SELECT 'a_c' LIKE 'a\\_c' AS matches, 'abc' LIKE 'a\\_c' AS noMatch FROM strings LIMIT 1"
