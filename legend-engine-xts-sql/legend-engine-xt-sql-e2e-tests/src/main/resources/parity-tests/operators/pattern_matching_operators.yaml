tests:
# =============================================================================
# Pattern Matching Operators (LIKE, ILIKE, SIMILAR TO, regex match operators)
# https://www.postgresql.org/docs/16/functions-matching.html
# =============================================================================

- id: like__bytea_bytea__unsupported_type
  sql: "SELECT 1 AS result FROM persons WHERE id = 1"
  operator: "LIKE"
  signature: "like(bytea, bytea) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: like__name_txt__from_table
  sql: "SELECT name LIKE '%li%' AS result FROM persons ORDER BY 1"
  operator: "LIKE"
  signature: "like(name, text) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: like__txt_txt__from_table
  sql: "SELECT val LIKE '%lo%' AS result FROM strings ORDER BY 1"
  operator: "LIKE"
  signature: "like(text, text) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: like__txt_txt__func_syntax
  sql: "SELECT LIKE(val, '%lo%') AS result FROM strings ORDER BY 1"
  operator: "LIKE"
  signature: "like(text, text) → boolean"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: like__txt_txt__underscore
  sql: "SELECT 'abc' LIKE 'a_c' AS matches, 'abbc' LIKE 'a_c' AS noMatch FROM strings LIMIT 1"
  operator: "LIKE"
  signature: "like(text, text) → boolean"
  expected_tds_status: PASS
  expected_rel_status: PASS

