  expected_rel_status: ERROR

- id: regex_not_match__bpchar__basic
  sql: SELECT CAST(val AS CHAR(20)) !~ '^hello' AS result FROM strings WHERE id = 1
  operator: "!~"
  signature: "!~(bpchar, text) → bool"
