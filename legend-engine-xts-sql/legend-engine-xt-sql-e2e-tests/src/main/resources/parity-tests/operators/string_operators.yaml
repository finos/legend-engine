tests:
# =============================================================================
# String Operators
# https://www.postgresql.org/docs/16/functions-string.html
# =============================================================================

- id: concat_op__txt_txt__from_table
  sql: SELECT val || '-' || nullable_val AS result FROM strings ORDER BY 1
  operator: "||"
  signature: "||(text, text) → text"
  expected_tds_status: FAIL
  expected_rel_status: PASS

- id: concat_op__mixed_types__int_bool
  sql: SELECT 'abc' || 1 || true || false AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "text || text → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: concat_op__mixed_types__int
  sql: SELECT name || '-' || age AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "text || text → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: concat_op__mixed_types__decimal
  sql: SELECT 'salary=' || salary AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "text || text → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: concat_op__mixed_types__date
  sql: SELECT 'hired:' || hire_date AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "text || text → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: concat_op__mixed_types__boolean
  sql: SELECT 'active=' || active AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "text || text → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: concat_op__mixed_types__null_handling
  sql: SELECT 'val=' || NULL || '-' || 42 AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "text || text → text"
  expected_tds_status: FAIL
  expected_rel_status: PASS

- id: concat_op__mixed_types__all_types
  sql: SELECT name || '|' || age || '|' || salary || '|' || hire_date || '|' || active AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "text || text → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# || anynonarray overloads (concatenating text with a non-array, non-text value
# directly, without going through a chained text||text||text expression)
# ---------------------------------------------------------------------------

- id: concat_op__text_anynonarray
  sql: SELECT 'age=' || age AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "||(text, anynonarray) → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: concat_op__anynonarray_text
  sql: SELECT age || '=age' AS result FROM persons WHERE id = 1
  operator: "||"
  signature: "||(anynonarray, text) → text"
  expected_tds_status: PASS
  expected_rel_status: PASS

# ---------------------------------------------------------------------------
# name-typed regex/pattern operators (catalog column names are type `name`;
# cast a literal to exercise the name overload directly)
# ---------------------------------------------------------------------------

- id: regex_match__name__basic
  sql: SELECT CAST(val AS name) ~ '^hello$' AS result FROM strings WHERE id = 1
  operator: "~"
  signature: "~(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: regex_not_match__name__basic
  sql: SELECT CAST(val AS name) !~ '^hello$' AS result FROM strings WHERE id = 1
  operator: "!~"
  signature: "!~(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: regex_match_ci__name__basic
  sql: SELECT CAST(val AS name) ~* '^HELLO$' AS result FROM strings WHERE id = 1
  operator: "~*"
  signature: "~*(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: regex_not_match_ci__name__basic
  sql: SELECT CAST(val AS name) !~* '^HELLO$' AS result FROM strings WHERE id = 1
  operator: "!~*"
  signature: "!~*(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: like__name__basic
  sql: SELECT CAST(val AS name) ~~ 'hel%' AS result FROM strings WHERE id = 1
  operator: "~~"
  signature: "~~(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: not_like__name__basic
  sql: SELECT CAST(val AS name) !~~ 'zzz%' AS result FROM strings WHERE id = 1
  operator: "!~~"
  signature: "!~~(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: ilike__name__basic
  sql: SELECT CAST(val AS name) ~~* 'HEL%' AS result FROM strings WHERE id = 1
  operator: "~~*"
  signature: "~~*(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: not_ilike__name__basic
  sql: SELECT CAST(val AS name) !~~* 'ZZZ%' AS result FROM strings WHERE id = 1
  operator: "!~~*"
  signature: "!~~*(name, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# ---------------------------------------------------------------------------
# bpchar (blank-padded CHAR(n)) regex/pattern operators
# ---------------------------------------------------------------------------

