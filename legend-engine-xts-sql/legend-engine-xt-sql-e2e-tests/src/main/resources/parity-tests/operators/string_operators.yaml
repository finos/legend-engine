# ---------------------------------------------------------------------------
# @@ (full text search match, text operand auto-cast to tsvector/tsquery) and
# ^@ (starts-with)
# ---------------------------------------------------------------------------

- id: text_starts_with_op
  sql: SELECT val ^@ 'hel' AS result FROM strings WHERE id = 1
  operator: "^@"
  signature: "^@(text, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: text_fts_match_op
  sql: SELECT val @@ 'hello' AS result FROM strings WHERE id = 1
  operator: "@@"
  signature: "@@(text, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

# ---------------------------------------------------------------------------
# ~~ / ~~* / !~~ / !~~* via literal operator syntax (as opposed to the LIKE/
# ILIKE keyword forms already covered in pattern_matching_operators.yaml)
# ---------------------------------------------------------------------------

- id: like_op__text_text
  sql: SELECT val ~~ 'hel%' AS result FROM strings WHERE id = 1
  operator: "~~"
  signature: "~~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: not_like_op__text_text
  sql: SELECT val !~~ 'zzz%' AS result FROM strings WHERE id = 1
  operator: "!~~"
  signature: "!~~(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: ilike_op__text_text
  sql: SELECT val ~~* 'HEL%' AS result FROM strings WHERE id = 1
  operator: "~~*"
  signature: "~~*(text, text) → bool"
  expected_tds_status: PASS
  expected_rel_status: PASS

- id: not_ilike_op__text_text
  sql: SELECT val !~~* 'ZZZ%' AS result FROM strings WHERE id = 1
  operator: "!~~*"
  signature: "!~~*(text, text) → bool"
  expected_tds_status: PASS
