- id: bpchar_lt
  sql: SELECT CAST(val AS CHAR(20)) ~<~ CAST('zzz' AS CHAR(20)) AS result FROM strings WHERE id = 1
  operator: "~<~"
  signature: "~<~(bpchar, bpchar) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bpchar_lte
  sql: SELECT CAST(val AS CHAR(20)) ~<=~ CAST('zzz' AS CHAR(20)) AS result FROM strings WHERE id = 1
  operator: "~<=~"
  signature: "~<=~(bpchar, bpchar) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bpchar_gt
  sql: SELECT CAST(val AS CHAR(20)) ~>~ CAST('aaa' AS CHAR(20)) AS result FROM strings WHERE id = 1
  operator: "~>~"
  signature: "~>~(bpchar, bpchar) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: bpchar_gte
  sql: SELECT CAST(val AS CHAR(20)) ~>=~ CAST('aaa' AS CHAR(20)) AS result FROM strings WHERE id = 1
  operator: "~>=~"
  signature: "~>=~(bpchar, bpchar) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: text_lt_lexcompare
  sql: SELECT val ~<~ 'zzz' AS result FROM strings WHERE id = 1
  operator: "~<~"
  signature: "~<~(text, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: text_lte_lexcompare
  sql: SELECT val ~<=~ 'zzz' AS result FROM strings WHERE id = 1
  operator: "~<=~"
  signature: "~<=~(text, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: text_gt_lexcompare
  sql: SELECT val ~>~ 'aaa' AS result FROM strings WHERE id = 1
  operator: "~>~"
  signature: "~>~(text, text) → bool"
  expected_tds_status: ERROR
  expected_rel_status: ERROR

- id: text_gte_lexcompare
  sql: SELECT val ~>=~ 'aaa' AS result FROM strings WHERE id = 1
